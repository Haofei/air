agent:
  name: deep-research-final-report-agent
  version: 0.1.0
  description: "Synthesize compressed research notes into a final report."

inputs:
  question: string
  plan:
    type: object
    required: [research_brief]
    properties:
      research_brief: string
  notes:
    type: array
    items:
      type: object
      required: [topic, summary, sources]
      properties:
        topic: string
        summary: string
        key_findings:
          type: array
          items: string
        evidence:
          type: array
          items:
            type: object
            required: [claim, support, source_ids]
            properties:
              claim: string
              support: string
              source_ids:
                type: array
                items: string
        implications:
          type: array
          items: string
        gaps:
          type: array
          items: string
        confidence:
          type: enum
          enum: [low, medium, high]
        sources:
          type: array
          items: string

outputs:
  final_report:
    type: object
    required: [report, sources, limitations]
    properties:
      title: string
      executive_summary: string
      report: string
      key_findings:
        type: array
        items: string
      comparison_matrix:
        type: array
        items:
          type: object
          required: [dimension, assessment, evidence, confidence]
          properties:
            dimension: string
            assessment: string
            evidence: string
            confidence:
              type: enum
              enum: [low, medium, high]
      recommendations:
        type: array
        items:
          type: object
          required: [action, rationale, priority]
          properties:
            action: string
            rationale: string
            priority:
              type: enum
              enum: [low, medium, high]
      sources:
        type: array
        items: string
      limitations:
        type: array
        items: string
      open_questions:
        type: array
        items: string

state:
  phase:
    type: enum
    enum: [init, write, done, failed]
  final_report:
    type: object
    required: [report, sources, limitations]
    properties:
      title: string
      executive_summary: string
      report: string
      key_findings:
        type: array
        items: string
      comparison_matrix:
        type: array
        items:
          type: object
          required: [dimension, assessment, evidence, confidence]
          properties:
            dimension: string
            assessment: string
            evidence: string
            confidence:
              type: enum
              enum: [low, medium, high]
      recommendations:
        type: array
        items:
          type: object
          required: [action, rationale, priority]
          properties:
            action: string
            rationale: string
            priority:
              type: enum
              enum: [low, medium, high]
      sources:
        type: array
        items: string
      limitations:
        type: array
        items: string
      open_questions:
        type: array
        items: string

workflow:
  kind: state_machine
  initial: init
  max_steps: 5
  rules:
    - id: init
      when: phase == "init"
      actions:
        - kind: set
          values:
            phase: write
    - id: write
      when: phase == "write"
      actions:
        - kind: model_call
          model: final_reporter
          input:
            object:
              question:
                ref: question
              research_brief:
                ref: plan.research_brief
              notes:
                ref: notes
          output: final_report
          timeout_seconds: 180
          retry:
            max_attempts: 3
            on_provider_error:
              token_limit:
                max_input_chars: [24000, 12000]
        - kind: set
          values:
            phase: done
    - id: done
      when: phase == "done"
      actions:
        - kind: return
          output: final_report

policy:
  timeout_seconds: 240

observability:
  traces: true
