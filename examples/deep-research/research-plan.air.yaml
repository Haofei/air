agent:
  name: deep-research-plan-agent
  version: 0.1.0
  description: "Plan bounded research topics from a user question."

inputs:
  question: string

outputs:
  plan:
    type: object
    required: [research_brief, topic_1, topic_2, topic_3]
    properties:
      research_brief: string
      topic_1: string
      topic_2: string
      topic_3: string

state:
  phase:
    type: enum
    enum: [init, plan, done, failed]
  plan:
    type: object
    required: [research_brief, topic_1, topic_2, topic_3]
    properties:
      research_brief: string
      topic_1: string
      topic_2: string
      topic_3: string

workflow:
  kind: state_machine
  initial: init
  max_steps: 5
  terminal: [done, failed]
  rules:
    - id: init
      when: phase == "init"
      actions:
        - kind: set
          values:
            phase: plan
    - id: plan
      when: phase == "plan"
      actions:
        - kind: model_call
          model: research_planner
          input:
            object:
              question:
                ref: question
              max_topics:
                literal: 3
          output: plan
          timeout_seconds: 60
          retry:
            max_attempts: 3
        - kind: set
          values:
            phase: done
    - id: done
      when: phase == "done"
      actions:
        - kind: return
          output: plan

policy:
  timeout_seconds: 90

observability:
  traces: true
