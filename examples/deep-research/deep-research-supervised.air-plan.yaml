# Example compiler output for a bounded supervised deep research plan.
# The second researcher wave is statically present but conditionally skipped.
plan:
  name: deep-research-supervised-four-topic
  version: 0.1.0

requires:
  capabilities: [network.search, research.reflect]

nodes:
  - id: plan
    module: deep_research.plan_array@0.1.0
  - id: topic_1
    module: deep_research.research_topic@0.1.0
  - id: topic_2
    module: deep_research.research_topic@0.1.0
  - id: supervisor
    module: deep_research.supervisor@0.1.0
  - id: topic_3
    module: deep_research.research_topic@0.1.0
    when: supervisor.decision.action == "conduct_research" || supervisor.decision.needs_more == true
  - id: topic_4
    module: deep_research.research_topic@0.1.0
    when: supervisor.decision.action == "conduct_research" || supervisor.decision.needs_more == true
  - id: final
    module: deep_research.final_report@0.1.0

entry: plan

schedule:
  max_parallel: 2
  groups:
    - id: initial_research_wave
      nodes: [topic_1, topic_2]
      max_parallel: 2
    - id: supervisor_follow_up_wave
      nodes: [topic_3, topic_4]
      max_parallel: 2

edges:
  - from: plan
    to: topic_1
  - from: plan
    to: topic_2
  - from: topic_1
    to: supervisor
  - from: topic_2
    to: supervisor
  - from: supervisor
    to: topic_3
  - from: supervisor
    to: topic_4
  - from: supervisor
    to: final
  - from: topic_1
    to: final
  - from: topic_2
    to: final
  - from: topic_3
    to: final
  - from: topic_4
    to: final

connect:
  - from: $input.question
    to: plan.question
  - from: plan.plan.research_brief
    to: topic_1.research_brief
  - from: plan.plan.topics[0]
    to: topic_1.topic
  - from: plan.plan.research_brief
    to: topic_2.research_brief
  - from: plan.plan.topics[1]
    to: topic_2.topic
  - from: plan.plan.research_brief
    to: supervisor.research_brief
  - from: topic_1.note
    to: supervisor.notes[]
  - from: topic_2.note
    to: supervisor.notes[]
  - from: plan.plan.research_brief
    to: topic_3.research_brief
  - from: supervisor.decision.follow_up_topics[0]
    to: topic_3.topic
  - from: plan.plan.research_brief
    to: topic_4.research_brief
  - from: supervisor.decision.follow_up_topics[1]
    to: topic_4.topic
  - from: topic_1.note
    to: final.notes[]
  - from: topic_2.note
    to: final.notes[]
  - from: topic_3.note
    to: final.notes[]
  - from: topic_4.note
    to: final.notes[]
  - from: plan.plan
    to: final.plan
  - from: $input.question
    to: final.question

outputs:
  result: final.final_report
  supervisor_decision: supervisor.decision

decisions:
  - id: supervised-second-wave
    rationale: "Keep both waves statically bounded; use a supervisor condition to skip or run the second wave."
    selected: [plan, topic_1, topic_2, supervisor, topic_3, topic_4, final]
