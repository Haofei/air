store:
  name: deep-research-module-store
  version: 0.1.0

modules:
  deep_research.clarify_scope@0.1.0:
    path: examples/deep-research/clarify-scope.air.yaml
    kind: primitive
    visibility: public
    description: "Normalize a research request, state assumptions, and identify whether the user should clarify scope before planning."
    tags: [deep_research, clarification, scope]
    covers: [clarify_scope, normalize_question, state_assumptions]
    priority: 120
  deep_research.plan@0.1.0:
    path: examples/deep-research/research-plan.air.yaml
    kind: composite
    visibility: public
    description: "Turn a user research question into a bounded research brief and three concrete research topics."
    tags: [deep_research, planning, brief]
    covers: [write_research_brief, plan_research_topics]
    priority: 100
  deep_research.plan_array@0.1.0:
    path: examples/deep-research/research-plan-array.air.yaml
    kind: composite
    visibility: public
    description: "Turn a user research question into a bounded research brief and a topic array for planner-instantiated researcher fan-out."
    tags: [deep_research, planning, brief, array_topics]
    covers: [write_research_brief, plan_research_topics]
    priority: 110
  deep_research.research_topic@0.1.0:
    path: examples/deep-research/research-topic.air.yaml
    kind: primitive
    visibility: internal
    description: "Research one planned topic and compress findings into one note. RunPlan may instantiate it multiple times."
    tags: [deep_research, researcher, search, compression]
    covers: [web_research, compress_research]
    priority: 40
  deep_research.supervisor@0.1.0:
    path: examples/deep-research/research-supervisor.air.yaml
    kind: primitive
    visibility: internal
    description: "Evaluate compressed notes and decide whether a bounded second researcher wave should run."
    tags: [deep_research, supervisor, bounded_loop]
    covers: [supervise_research, decide_more_research]
    priority: 60
  deep_research.final_report@0.1.0:
    path: examples/deep-research/final-report.air.yaml
    kind: composite
    visibility: public
    description: "Synthesize the research brief and compressed notes into a final cited report."
    tags: [deep_research, synthesis, report]
    covers: [synthesize_report, cite_sources, identify_limitations]
    priority: 100

recipes:
  - id: deep_research.four_topic_report@0.1.0
    visibility: public
    description: "Bounded deep-research workflow for a task with four named research topics: plan an array, fan out four reusable researchers, append notes, and synthesize a final report."
    tags: [deep_research, four_topic, fanout, report]
    covers: [deep_research_report, plan_research_topics, web_research, compress_research, synthesize_report]
    priority: 200
    plan:
      plan:
        name: deep-research-four-topic-recipe
        version: 0.1.0
      requires:
        capabilities: [network.search, research.reflect]
      nodes:
        - id: plan
          module: deep_research.plan_array@0.1.0
        - id: topic_1
          module: deep_research.research_topic@0.1.0
        - id: topic_2
          module: deep_research.research_topic@0.1.0
        - id: topic_3
          module: deep_research.research_topic@0.1.0
        - id: topic_4
          module: deep_research.research_topic@0.1.0
        - id: final
          module: deep_research.final_report@0.1.0
      entry: plan
      schedule:
        max_parallel: 4
        groups:
          - id: initial_research_wave
            nodes: [topic_1, topic_2, topic_3, topic_4]
            max_parallel: 4
      edges:
        - from: plan
          to: topic_1
        - from: plan
          to: topic_2
        - from: plan
          to: topic_3
        - from: plan
          to: topic_4
        - from: topic_1
          to: final
        - from: topic_2
          to: final
        - from: topic_3
          to: final
        - from: topic_4
          to: final
      connect:
        - from: $input.question
          to: plan.question
        - from: $input.question
          to: final.question
        - from: plan.plan.research_brief
          to: topic_1.research_brief
        - from: plan.plan.research_brief
          to: topic_2.research_brief
        - from: plan.plan.research_brief
          to: topic_3.research_brief
        - from: plan.plan.research_brief
          to: topic_4.research_brief
        - from: plan.plan.topics[0]
          to: topic_1.topic
        - from: plan.plan.topics[1]
          to: topic_2.topic
        - from: plan.plan.topics[2]
          to: topic_3.topic
        - from: plan.plan.topics[3]
          to: topic_4.topic
        - from: plan.plan
          to: final.plan
        - from: topic_1.note
          to: final.notes[]
        - from: topic_2.note
          to: final.notes[]
        - from: topic_3.note
          to: final.notes[]
        - from: topic_4.note
          to: final.notes[]
      outputs:
        result: final.final_report
      decisions:
        - id: use-four-topic-recipe
          rationale: "Use the module-store recipe so the planner selects a bounded higher-level workflow instead of hand-assembling small components."
          selected: [deep_research.four_topic_report@0.1.0]
