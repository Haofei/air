plan:
  name: deep-research-dynamic-topic-fanout
  version: 0.1.0

requires:
  capabilities: [network.search, research.reflect]

nodes:
  - id: plan
    module: deep_research.plan_array@0.1.0
  - id: final
    module: deep_research.final_report@0.1.0

entry: plan

edges:
  - from: plan
    to: final

connect:
  - from: $input.question
    to: plan.question
  - from: $input.question
    to: final.question
  - from: plan.plan
    to: final.plan

dynamic:
  fanouts:
    - id: topic_wave
      after: plan
      source: plan.plan.topics
      module: deep_research.research_topic@0.1.0
      id_prefix: topic
      min_items: 1
      max_items: 4
      max_parallel: 4
      input:
        - from: plan.plan.research_brief
          to: $each.research_brief
        - from: $item
          to: $each.topic
      fan_in:
        - from: $each.note
          to: final.notes[]

outputs:
  final_report: final.final_report

decisions:
  - id: use-dynamic-topic-fanout
    rationale: "Let the planner module choose the topic count at runtime, then materialize a bounded typed researcher wave."
    selected:
      - deep_research.plan_array@0.1.0
      - deep_research.research_topic@0.1.0
      - deep_research.final_report@0.1.0
