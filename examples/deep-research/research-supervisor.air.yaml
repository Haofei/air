agent:
  name: deep-research-supervisor-agent
  version: 0.1.0
  description: "Decide whether a bounded second wave of researcher modules should run."

inputs:
  research_brief: string
  notes:
    type: array
    items:
      type: object
      required: [topic, summary, sources]
      properties:
        topic: string
        summary: string
        sources:
          type: array
          items: string

outputs:
  decision:
    type: object
    required: [action, needs_more, follow_up_topics, rationale]
    properties:
      action:
        type: enum
        enum: [conduct_research, research_complete]
      needs_more: boolean
      follow_up_topics:
        type: array
        min_items: 2
        max_items: 2
        items: string
      rationale: string

state:
  phase:
    type: enum
    enum: [init, decide, done, failed]
  decision:
    type: object
    required: [action, needs_more, follow_up_topics, rationale]
    properties:
      action:
        type: enum
        enum: [conduct_research, research_complete]
      needs_more: boolean
      follow_up_topics:
        type: array
        min_items: 2
        max_items: 2
        items: string
      rationale: string
  reflection:
    type: object
    required: [reflection]
    properties:
      reflection: string

tools:
  - name: research.think
    capability: research.reflect
    timeout_ms: 1000

requires:
  capabilities: [research.reflect]

workflow:
  kind: state_machine
  initial: init
  max_steps: 5
  terminal: [done, failed]
  rules:
    - id: init
      when: phase == "init"
      actions:
        - kind: set
          values:
            phase: decide
    - id: decide
      when: phase == "decide"
      actions:
        - kind: model_call
          model: research_supervisor
          input:
            object:
              research_brief:
                ref: research_brief
              notes:
                ref: notes
          output: decision
          timeout_seconds: 60
          retry:
            max_attempts: 3
        - kind: tool_call
          tool: research.think
          input:
            object:
              needs_more:
                ref: decision.needs_more
              reflection:
                ref: decision.rationale
          output: reflection
          timeout_seconds: 5
          retry:
            max_attempts: 3
        - kind: set
          values:
            phase: done
    - id: done
      when: phase == "done"
      actions:
        - kind: return
          output: decision

policy:
  max_tool_calls: 1
  max_model_calls: 3
  timeout_seconds: 90

observability:
  traces: true
