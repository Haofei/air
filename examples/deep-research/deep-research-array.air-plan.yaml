# Example compiler output for a bounded 4-topic research plan.
# End users should normally generate this shape with `air plan` from the
# module store instead of hand-authoring topic_1/topic_2/... nodes.
plan:
  name: deep-research-array-four-topic
  version: 0.1.0

requires:
  capabilities: [network.search, research.reflect]

nodes:
  - id: plan
    module: deep_research.plan_array@0.1.0
  - id: topic_1
    module: deep_research.research_topic@0.1.0
  - id: topic_2
    module: deep_research.research_topic@0.1.0
  - id: topic_3
    module: deep_research.research_topic@0.1.0
  - id: topic_4
    module: deep_research.research_topic@0.1.0
  - id: final
    module: deep_research.final_report@0.1.0

entry: plan

schedule:
  max_parallel: 4
  groups:
    - id: initial_research_wave
      nodes: [topic_1, topic_2, topic_3, topic_4]
      max_parallel: 4

edges:
  - from: plan
    to: topic_1
  - from: plan
    to: topic_2
  - from: plan
    to: topic_3
  - from: plan
    to: topic_4
  - from: plan
    to: final
  - from: topic_1
    to: final
  - from: topic_2
    to: final
  - from: topic_3
    to: final
  - from: topic_4
    to: final

connect:
  - from: $input.question
    to: plan.question
  - from: plan.plan.research_brief
    to: topic_1.research_brief
  - from: plan.plan.topics.0
    to: topic_1.topic
  - from: plan.plan.research_brief
    to: topic_2.research_brief
  - from: plan.plan.topics.1
    to: topic_2.topic
  - from: plan.plan.research_brief
    to: topic_3.research_brief
  - from: plan.plan.topics.2
    to: topic_3.topic
  - from: plan.plan.research_brief
    to: topic_4.research_brief
  - from: plan.plan.topics.3
    to: topic_4.topic
  - from: $input.question
    to: final.question
  - from: plan.plan
    to: final.plan
  - from: topic_1.note
    to: final.notes[]
  - from: topic_2.note
    to: final.notes[]
  - from: topic_3.note
    to: final.notes[]
  - from: topic_4.note
    to: final.notes[]

outputs:
  final_report: final.final_report

decisions:
  - id: use-array-topic-plan
    rationale: "Use a bounded topic array so the planner can instantiate any fixed number of researcher nodes before execution."
    selected: [plan]
  - id: fan-out-four-researchers
    rationale: "Instantiate the same bounded researcher module four times, one per planned array topic."
    selected: [topic_1, topic_2, topic_3, topic_4]
  - id: fan-in-final-report
    rationale: "Collect all compressed notes through the AIR array fan-in reducer."
    selected: [final]
