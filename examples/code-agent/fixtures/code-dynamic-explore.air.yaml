agent:
  name: code-dynamic-explore-agent
  version: 0.1.0
  description: "Bounded plan-act-observe code exploration with model-selected declared tools."

inputs:
  task: string
  query: string
  target_path: string

outputs:
  exploration:
    type: object
    required: [summary, relevant_files, findings, source_ids, next_steps]
    properties:
      summary: string
      relevant_files:
        type: array
        items:
          type: object
          required: [path, reason]
          properties:
            path: string
            reason: string
      findings:
        type: array
        items:
          type: object
          required: [title, evidence, source_ids]
          properties:
            title: string
            evidence: string
            source_ids:
              type: array
              items: string
      source_ids:
        type: array
        items: string
      next_steps:
        type: array
        items: string

requires:
  capabilities: [file.read, code.read]

state:
  phase:
    type: enum
    enum: [init, choose, route, done, failed]
  observations:
    type: array
    items: object
  decision:
    type: object
    required: [complete, tool_calls, rationale]
    properties:
      complete: boolean
      tool_calls:
        type: array
        max_items: 4
        items:
          type: object
          required: [tool, input]
          properties:
            tool: string
            input: object
      rationale: string
  observation:
    type: array
    items:
      type: object
      required: [tool, input, output]
      properties:
        tool: string
        input: object
        output: object
  exploration:
    type: object
    required: [summary, relevant_files, findings, source_ids, next_steps]
    properties:
      summary: string
      relevant_files:
        type: array
        items:
          type: object
          required: [path, reason]
          properties:
            path: string
            reason: string
      findings:
        type: array
        items:
          type: object
          required: [title, evidence, source_ids]
          properties:
            title: string
            evidence: string
            source_ids:
              type: array
              items: string
      source_ids:
        type: array
        items: string
      next_steps:
        type: array
        items: string

tools:
  - name: repo.files
    capability: code.read
    timeout_ms: 10000
  - name: repo.search
    capability: code.read
    timeout_ms: 10000
  - name: repo.symbols
    capability: code.read
    timeout_ms: 10000
  - name: repo.references
    capability: code.read
    timeout_ms: 10000
  - name: repo.context
    capability: code.read
    timeout_ms: 10000
  - name: read
    capability: file.read
    timeout_ms: 10000
  - name: read_many
    capability: file.read
    timeout_ms: 10000
  - name: grep
    capability: file.read
    timeout_ms: 10000

workflow:
  kind: state_machine
  initial: init
  max_steps: 8
  terminal: [done, failed]
  rules:
    - id: init
      when: phase == "init"
      actions:
        - kind: set
          values:
            observations: []
            phase: choose

    - id: choose
      when: phase == "choose"
      actions:
        - kind: model_call
          model: code_tool_planner
          input:
            object:
              task:
                ref: task
              query:
                ref: query
              target_path:
                ref: target_path
              observations:
                ref: observations
              allowed_tools:
                array:
                  - literal: repo.files
                  - literal: repo.search
                  - literal: repo.symbols
                  - literal: repo.references
                  - literal: repo.context
                  - literal: read
                  - literal: read_many
                  - literal: grep
              tool_specs:
                array:
                  - object:
                      tool:
                        literal: repo.files
                      purpose:
                        literal: "List repository files before selecting a narrower read target."
                      input_schema:
                        literal:
                          required: []
                          optional:
                            query: "string: filename/path token to filter files"
                            path: "string: optional repo-relative directory"
                            max_files: "integer: optional per-call limit capped by tool config"
                  - object:
                      tool:
                        literal: repo.search
                      purpose:
                        literal: "Search file contents across the repository and return matching lines."
                      input_schema:
                        literal:
                          required:
                            query: "string: regex or fixed search text"
                          optional:
                            path: "string: optional repo-relative scope"
                            mode: "string: fixed or regex"
                            max_matches: "integer: optional per-call limit capped by tool config"
                  - object:
                      tool:
                        literal: repo.symbols
                      purpose:
                        literal: "Find likely code symbols by name before reading files."
                      input_schema:
                        literal:
                          required:
                            query: "string: symbol or identifier fragment"
                          optional:
                            path: "string: optional repo-relative scope"
                            glob: "string: optional filename glob"
                            max_symbols: "integer: optional per-call limit capped by tool config"
                  - object:
                      tool:
                        literal: repo.references
                      purpose:
                        literal: "Find references and nearby snippets for one symbol."
                      input_schema:
                        literal:
                          required:
                            symbol: "string: exact symbol or identifier"
                          optional:
                            path: "string: optional repo-relative scope"
                            context_lines: "integer: optional per-call context capped by tool config"
                            max_matches: "integer: optional per-call limit capped by tool config"
                  - object:
                      tool:
                        literal: repo.context
                      purpose:
                        literal: "Return contextual snippets around repository search hits."
                      input_schema:
                        literal:
                          required:
                            query: "string: regex or fixed search text"
                          optional:
                            path: "string: optional repo-relative scope"
                            mode: "string: fixed or regex"
                            context_lines: "integer: optional per-call context capped by tool config"
                            max_matches: "integer: optional per-call limit capped by tool config"
                  - object:
                      tool:
                        literal: read
                      purpose:
                        literal: "Read one known text file or a line range."
                      input_schema:
                        literal:
                          required:
                            path: "string: repo-relative file path"
                          optional:
                            start_line: "integer: first 1-based line"
                            end_line: "integer: last 1-based line"
                            line_numbers: "boolean: include numbered_content"
                  - object:
                      tool:
                        literal: read_many
                      purpose:
                        literal: "Read several known text files in one bounded call."
                      input_schema:
                        literal:
                          required:
                            files: "array: repo-relative file paths or objects with path"
                          optional:
                            line_numbers: "boolean: include numbered_content per file"
                            max_bytes_per_file: "integer: optional per-file byte limit capped by tool config"
                  - object:
                      tool:
                        literal: grep
                      purpose:
                        literal: "Search within one known file and return matching lines with optional context."
                      input_schema:
                        literal:
                          required:
                            path: "string: repo-relative file path"
                            pattern: "string: regular expression"
                          optional:
                            context_lines: "integer: optional context capped by tool config"
                            max_matches: "integer: optional per-call limit capped by tool config"
                            max_line_chars: "integer: optional per-line limit capped by tool config"
          output: decision
          timeout_seconds: 30
        - kind: set
          values:
            phase: route

    - id: act
      when: phase == "route" && decision.complete == false
      actions:
        - kind: tool_batch_dispatch
          input:
            path: decision.tool_calls
          output: observation
          max_calls: 4
          timeout_seconds: 10
          on_error: observe
        - kind: append
          target: observations
          value:
            object:
              tool:
                literal: batch
              input:
                path: decision.tool_calls
              rationale:
                path: decision.rationale
              result:
                ref: observation
        - kind: set
          values:
            phase: choose

    - id: summarize
      when: phase == "route" && decision.complete == true
      actions:
        - kind: model_call
          model: code_dynamic_summarizer
          input:
            object:
              task:
                ref: task
              query:
                ref: query
              target_path:
                ref: target_path
              observations:
                ref: observations
              final_decision:
                ref: decision
          output: exploration
          timeout_seconds: 30
        - kind: set
          values:
            phase: done

    - id: done
      when: phase == "done"
      actions:
        - kind: return
          output: exploration

policy:
  max_model_calls: 4
  max_tool_calls: 8
  max_repeated_tool_calls: 2
