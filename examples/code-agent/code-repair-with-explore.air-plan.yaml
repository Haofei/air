plan:
  name: code-repair-with-explore
  version: 0.1.0
  description: "Core coding-agent loop: explore read-only context, select bounded repair context, patch, and verify."

requires:
  capabilities: [task.progress, network.search, file.read, file.write, code.read, code.test]

nodes:
  - id: explore
    module: code.explore@0.1.0
  - id: select_context
    module: code.repair_context@0.1.0
  - id: repair
    module: code.repair@0.1.0

entry: explore

edges:
  - from: explore
    to: select_context
  - from: select_context
    to: repair

connect:
  - from: $input.task
    to: explore.task
  - from: $input.query
    to: explore.query
  - from: $input.target_path
    to: explore.target_path
  - from: $input.task
    to: select_context.task
  - from: $input.target_path
    to: select_context.target_path
  - to: select_context.related_files
    value:
      coalesce:
        - from: $input.related_files
        - literal: []
  - from: explore.exploration
    to: select_context.exploration
  - from: $input.task
    to: repair.task
  - from: $input.query
    to: repair.query
  - from: select_context.repair_context.target_path
    to: repair.target_path
  - from: $input.target_search_pattern
    to: repair.target_search_pattern
  - from: select_context.repair_context.related_files
    to: repair.related_files
  - from: $input.test_command
    to: repair.test_command
  - from: $input.force_patch
    to: repair.force_patch

outputs:
  exploration: explore.exploration
  repair_context: select_context.repair_context
  repair: repair.repair

decisions:
  - id: choose-core-coding-loop
    rationale: "The task asks for a code fix, so use the core loop: read-only exploration, explicit context selection, bounded patching, and retest."
    selected: [explore, select_context, repair]
