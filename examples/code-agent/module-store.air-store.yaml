store:
  name: code-agent-store
  version: 0.1.0

imports:
  - ../../modules/std/module-store.air-store.yaml

modules:
  code.project_plan@0.1.0:
    path: examples/code-agent/code-project-plan.air.yaml
    kind: composite
    visibility: public
    description: "Read-only project planning subagent that creates a grounded task graph, file plan, and acceptance checks before implementation."
    tags: [coding, project_plan, task_graph, acceptance, provenance]
    covers: [project_planning, task_graph, acceptance_criteria, source_grounding, coding_milestone_planning]
    priority: 130
  code.explore@0.1.0:
    path: examples/code-agent/code-explore.air.yaml
    kind: composite
    visibility: public
    description: "Read-only code exploration subagent for open-ended repository questions."
    tags: [coding, explore, search, code_read, provenance]
    covers: [code_exploration, repository_question_answering, documentation_lookup, source_grounding]
    priority: 110
  code.dynamic_explore@0.1.0:
    path: examples/code-agent/code-dynamic-explore.air.yaml
    kind: composite
    visibility: public
    description: "Read-only plan-act-observe code exploration where the model selects among declared tools through governed AIR tool_dispatch."
    tags: [coding, explore, dynamic_tools, plan_act_observe, code_read, provenance]
    covers: [code_exploration, repository_question_answering, dynamic_tool_choice, bounded_plan_act_observe]
    priority: 105
  code.repair_context@0.1.0:
    path: examples/code-agent/code-repair-context.air.yaml
    kind: primitive
    visibility: internal
    description: "Semantic adapter that selects bounded repair context files from read-only exploration output."
    tags: [coding, repair, semantic_adapter, context_selection]
    covers: [code_fix_context_selection, interface_adaptation, bounded_repair_context]
    priority: 70
  code.review@0.1.0:
    path: examples/code-agent/code-review.air.yaml
    kind: composite
    visibility: public
    description: "Grounded coding review agent using search, file context, and git diff evidence."
    tags: [coding, review, search, provenance]
    covers: [code_review, documentation_lookup, diff_review, grounded_recommendations]
    priority: 100
  code.review_gather@0.1.0:
    path: examples/code-agent/code-review-gather.air.yaml
    kind: primitive
    visibility: internal
    description: "Gather bounded code-review evidence before shared context compaction."
    tags: [coding, review, evidence, search, provenance]
    covers: [code_review_evidence, documentation_lookup, diff_review, test_evidence]
    priority: 70
  code.review_analyze@0.1.0:
    path: examples/code-agent/code-review-analyze.air.yaml
    kind: primitive
    visibility: internal
    description: "Analyze a standard AIR context object into grounded code-review findings."
    tags: [coding, review, analysis, provenance]
    covers: [code_review_analysis, grounded_recommendations]
    priority: 70
  code.build_page@0.1.0:
    path: examples/code-agent/code-build-page.air.yaml
    kind: composite
    visibility: public
    description: "Bounded static page builder using model generation, constrained file write, smoke verification, browser screenshots, and one visual revision pass."
    tags: [coding, build, static_site, file_write, browser_audit]
    covers: [static_page_build, landing_page, bounded_file_write, smoke_test, visual_audit]
    priority: 90
  code.repair@0.1.0:
    path: examples/code-agent/code-repair.air.yaml
    kind: composite
    visibility: public
    description: "Bounded code repair agent using structured diagnostics, constrained file.patch, and retest."
    tags: [coding, repair, diagnostics, patch, test]
    covers: [code_fix, diagnostics_loop, bounded_patch, retest]
    priority: 95

recipes:
  - id: code.project_plan_recipe@0.1.0
    visibility: public
    description: "Project planning workflow: gather repository and external evidence, then return a structured task graph with files and acceptance checks."
    tags: [coding, project_plan, task_graph, acceptance, provenance]
    covers: [project_planning, task_graph, acceptance_criteria, source_grounding, coding_milestone_planning]
    priority: 170
    plan:
      plan:
        name: code-project-plan-recipe
        version: 0.1.0
      requires:
        capabilities: [task.progress, network.search, code.read]
      nodes:
        - id: plan
          module: code.project_plan@0.1.0
      entry: plan
      connect:
        - from: $input.task
          to: plan.task
        - from: $input.query
          to: plan.query
      outputs:
        project_plan: plan.project_plan
      decisions:
        - id: use-project-plan-recipe
          rationale: "Use the high-level project planning component so the code agent starts with a grounded task graph instead of jumping directly into file edits."
          selected: [code.project_plan_recipe@0.1.0]
  - id: code.core_repair@0.1.0
    visibility: public
    description: "Core coding-agent repair loop: gather read-only context, select bounded repair files, apply a constrained patch, and retest."
    tags: [coding, repair, fix, diagnostics, patch, test]
    covers: [code_fix, failing_test_repair, diagnostics_loop, bounded_patch, retest]
    priority: 150
    plan:
      plan:
        name: code-repair-with-explore-recipe
        version: 0.1.0
      requires:
        capabilities: [task.progress, network.search, file.read, file.write, code.read, code.test]
      nodes:
        - id: explore
          module: code.explore@0.1.0
        - id: select_context
          module: code.repair_context@0.1.0
        - id: repair
          module: code.repair@0.1.0
      entry: explore
      edges:
        - from: explore
          to: select_context
        - from: select_context
          to: repair
      connect:
        - from: $input.task
          to: explore.task
        - from: $input.query
          to: explore.query
        - from: $input.target_path
          to: explore.target_path
        - from: $input.task
          to: select_context.task
        - from: $input.target_path
          to: select_context.target_path
        - to: select_context.related_files
          value:
            coalesce:
              - from: $input.related_files
              - literal: []
        - from: explore.exploration
          to: select_context.exploration
        - from: $input.task
          to: repair.task
        - from: $input.query
          to: repair.query
        - from: select_context.repair_context.target_path
          to: repair.target_path
        - from: $input.target_search_pattern
          to: repair.target_search_pattern
        - from: select_context.repair_context.related_files
          to: repair.related_files
        - from: $input.test_command
          to: repair.test_command
        - from: $input.force_patch
          to: repair.force_patch
      outputs:
        exploration: explore.exploration
        repair_context: select_context.repair_context
        repair: repair.repair
      decisions:
        - id: use-core-code-repair-loop
          rationale: "Use the higher-level repair recipe so the primary coding agent explores first, adapts context explicitly, then patches and retests."
          selected: [code.core_repair@0.1.0]
  - id: code.review_with_std_context@0.1.0
    visibility: public
    description: "Grounded code review workflow that composes evidence gathering, the AIR standard context compactor, and final analysis."
    tags: [coding, review, context_compaction, provenance]
    covers: [code_review, documentation_lookup, diff_review, compact_context, grounded_recommendations]
    priority: 180
    plan:
      plan:
        name: code-review-with-std-context-recipe
        version: 0.1.0
      requires:
        capabilities: [task.progress, context.manage, provenance.validate, network.search, file.read, code.read, code.test]
      nodes:
        - id: gather
          module: code.review_gather@0.1.0
        - id: compact
          module: context.compact@0.1.0
        - id: analyze
          module: code.review_analyze@0.1.0
      entry: gather
      edges:
        - from: gather
          to: compact
        - from: compact
          to: analyze
      connect:
        - from: $input.task
          to: gather.task
        - from: $input.search_query
          to: gather.search_query
        - from: $input.repo_query
          to: gather.repo_query
        - from: $input.required_terms
          to: gather.required_terms
        - from: $input.target_file
          to: gather.target_file
        - to: gather.related_files
          value:
            coalesce:
              - from: $input.related_files
              - literal: []
        - from: gather.evidence
          to: compact.payload
        - to: compact.compact_for
          value:
            literal: a downstream code-review agent that needs concise, source-grounded repository evidence
        - to: compact.max_context_chars
          value:
            literal: 200000
        - to: compact.threshold_percent
          value:
            literal: 80
        - from: $input.task
          to: analyze.task
        - from: $input.target_file
          to: analyze.target_file
        - from: compact.context
          to: analyze.context
      outputs:
        review: analyze.review
      decisions:
        - id: use-std-context-review-recipe
          rationale: "Use the higher-level recipe so the planner selects a reusable AIR standard compaction module instead of hand-assembling compaction logic inside one coding agent."
          selected: [code.review_with_std_context@0.1.0]
