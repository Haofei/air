agent:
  name: code-review-analyze-agent
  version: 0.1.0
  description: "Analyze a standard AIR compacted context object into grounded code review guidance."

inputs:
  task: string
  target_file: string
  context: object

outputs:
  review:
    type: object
    required: [summary, findings, source_ids, search_quality, next_steps]
    properties:
      summary: string
      findings:
        type: array
        items:
          type: object
          required: [severity, title, evidence, source_ids, recommendation]
          properties:
            severity:
              type: enum
              enum: [info, low, medium, high, critical]
            title: string
            evidence: string
            source_ids:
              type: array
              items: string
            recommendation: string
      source_ids:
        type: array
        items: string
      search_quality:
        type: object
        required: [sufficient, gaps]
        properties:
          sufficient: boolean
          gaps:
            type: array
            items: string
      next_steps:
        type: array
        items: string

requires:
  capabilities: [provenance.validate]

state:
  phase:
    type: enum
    enum: [init, analyze, validate_citations, done, failed]
  review:
    type: object
    required: [summary, findings, source_ids, search_quality, next_steps]
    properties:
      summary: string
      findings:
        type: array
        items:
          type: object
          required: [severity, title, evidence, source_ids, recommendation]
          properties:
            severity:
              type: enum
              enum: [info, low, medium, high, critical]
            title: string
            evidence: string
            source_ids:
              type: array
              items: string
            recommendation: string
      source_ids:
        type: array
        items: string
      search_quality:
        type: object
        required: [sufficient, gaps]
        properties:
          sufficient: boolean
          gaps:
            type: array
            items: string
      next_steps:
        type: array
        items: string
  citation_check:
    type: object
    required: [valid, registered_ids, cited_ids, missing_ids, artifacts]
    properties:
      valid: boolean
      registered_ids:
        type: array
        items: string
      cited_ids:
        type: array
        items: string
      missing_ids:
        type: array
        items: string
      artifacts:
        type: array
        items:
          type: object

tools:
  - name: artifact.validate
    capability: provenance.validate

workflow:
  kind: state_machine
  initial: init
  max_steps: 5
  terminal: [done, failed]
  rules:
    - id: init
      when: phase == "init"
      actions:
        - kind: set
          values:
            phase: analyze

    - id: analyze
      when: phase == "analyze"
      actions:
        - kind: model_call
          model: code_reviewer
          input:
            object:
              task:
                ref: task
              target_file:
                ref: target_file
              context:
                ref: context
          output: review
          timeout_seconds: 120
          retry:
            max_attempts: 2
        - kind: set
          values:
            phase: validate_citations

    - id: validate-citations
      when: phase == "validate_citations"
      actions:
        - kind: tool_call
          tool: artifact.validate
          input:
            object:
              evidence:
                ref: context
              registered_ids:
                path: context.source_ids
              citations:
                ref: review
          output: citation_check
          timeout_seconds: 10
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: done

    - id: done
      when: phase == "done"
      actions:
        - kind: return
          output: review

policy:
  max_tool_calls: 1
  timeout_seconds: 180

observability:
  traces: true
