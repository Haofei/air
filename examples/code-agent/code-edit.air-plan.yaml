plan:
  name: code-edit
  version: 0.1.0
  description: "Unified coding-agent edit loop for a bounded task with configured validation."

requires:
  capabilities: [task.progress, file.read, file.write, code.read, code.test]

nodes:
  - id: edit
    module: code.edit@0.1.0

entry: edit

connect:
  - from: $input.task
    to: edit.task
  - from: $input.query
    to: edit.query
  - from: $input.target_path
    to: edit.target_path
  - from: $input.target_search_pattern
    to: edit.target_search_pattern
  - from: $input.target_symbol_query
    to: edit.target_symbol_query
  - from: $input.related_files
    to: edit.related_files
outputs:
  edit: edit.edit

decisions:
  - id: choose-code-edit-loop
    rationale: "Run the unified AIR edit loop with configured validation. If target_path is empty, the loop must discover and read the target before writing."
    selected: [edit]
