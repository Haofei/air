plan:
  name: code-edit
  version: 0.1.0
  description: "Unified coding-agent edit loop for a bounded task with configured validation."

requires:
  capabilities: [task.progress, file.read, file.write, code.read, code.test]

nodes:
  - id: edit
    module: code.edit@0.1.0

entry: edit

connect:
  - from: $input.task
    to: edit.task
outputs:
  edit: edit.edit

decisions:
  - id: choose-code-edit-loop
    rationale: "Run the unified AIR edit loop with configured validation. The loop must discover and read the relevant files before writing."
    selected: [edit]
