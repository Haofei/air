agent:
  name: code-repair-agent
  version: 0.1.0
  description: "Bounded coding repair agent: read one target file plus related context files, run an allowlisted test, generate structured file operations from diagnostics, dry-run them through file.ops, apply, retest, and optionally run one more bounded repair pass."

inputs:
  task: string
  query: string
  target_path: string
  target_search_pattern: string
  related_files:
    type: array
    items: string
  test_command: string
  force_patch: boolean

outputs:
  repair:
    type: object
    required: [target_path, initial_success, final_success, patch_applied, rationale, diagnostics, workspace_clean_before, workspace_clean, preexisting_changed_files, changed_files, workspace_changed_files, workspace_diff]
    properties:
      target_path: string
      initial_success: boolean
      final_success: boolean
      patch_applied: boolean
      rationale: string
      diagnostics:
        type: array
        items: object
      workspace_clean_before: boolean
      workspace_clean: boolean
      preexisting_changed_files:
        type: array
        items: object
      changed_files:
        type: array
        items: object
      workspace_changed_files:
        type: array
        items: object
      workspace_diff:
        type: object
        required: [repo, diff, bytes, truncated, artifacts]
        properties:
          repo: string
          diff: string
          bytes: integer
          truncated: boolean
          artifacts:
            type: array
            items: object

requires:
  capabilities: [task.progress, file.read, file.write, code.read, code.test]

state:
  phase:
    type: enum
    enum: [init, read, test, route, repair, patch_check, patch_check_route, patch, retest, evaluate, reread, repair_again, patch_check_again, patch_check_again_route, patch_again, retest_again, status, done, failed]
  file_context:
    type: object
    required: [path, content, artifacts]
    properties:
      path: string
      content: string
      artifacts:
        type: array
        items: object
  related_context:
    type: object
    required: [files, file_count, bytes, truncated, artifacts]
    properties:
      files:
        type: array
        items: object
      file_count: integer
      bytes: integer
      truncated: boolean
      artifacts:
        type: array
        items: object
  target_matches:
    type: object
    required: [path, pattern, matches, match_count, returned_match_count, total_lines, context_lines, truncated, bytes, artifacts]
    properties:
      path: string
      pattern: string
      matches:
        type: array
        items: object
      match_count: integer
      returned_match_count: integer
      total_lines: integer
      context_lines: integer
      truncated: boolean
      bytes: integer
      artifacts:
        type: array
        items: object
  test_results:
    type: object
    required: [command, success, log, diagnostics, artifacts]
    properties:
      command: string
      success: boolean
      status: integer
      log: string
      diagnostics:
        type: array
        items: object
      artifacts:
        type: array
        items: object
  diagnostic_context:
    type: object
    required: [repo, diagnostics, snippets, unreadable, artifacts]
    properties:
      repo: string
      diagnostics:
        type: array
        items: object
      snippets:
        type: array
        items: object
      unreadable:
        type: array
        items: object
      artifacts:
        type: array
        items: object
  repair_plan:
    type: object
    required: [operations, rationale]
    properties:
      operations:
        type: array
        min_items: 1
        max_items: 20
        items:
          type: object
          additional_properties: false
          required: [kind, path]
          properties:
            kind:
              type: enum
              enum: [edit, write]
            path: string
            old_string: string
            new_string: string
            content: string
            replace_all: boolean
            match_strategy:
              type: enum
              enum: [auto, exact, line_trimmed, whitespace_normalized, indentation_flexible]
      rationale: string
  patch_result:
    type: object
    required: [repo, success, checked, applied, files, file_count, diagnostics, artifacts]
    properties:
      repo: string
      success: boolean
      checked: boolean
      applied: boolean
      files:
        type: array
        items: object
      file_count: integer
      diagnostics:
        type: array
        items: object
      artifacts:
        type: array
        items: object
  patch_check_result:
    type: object
    required: [repo, success, checked, applied, files, file_count, diagnostics, artifacts]
    properties:
      repo: string
      success: boolean
      checked: boolean
      applied: boolean
      files:
        type: array
        items: object
      file_count: integer
      diagnostics:
        type: array
        items: object
      artifacts:
        type: array
        items: object
  final_test_results:
    type: object
    required: [command, success, log, diagnostics, artifacts]
    properties:
      command: string
      success: boolean
      status: integer
      log: string
      diagnostics:
        type: array
        items: object
      artifacts:
        type: array
        items: object
  file_context_retry:
    type: object
    required: [path, content, artifacts]
    properties:
      path: string
      content: string
      artifacts:
        type: array
        items: object
  target_matches_retry:
    type: object
    required: [path, pattern, matches, match_count, returned_match_count, total_lines, context_lines, truncated, bytes, artifacts]
    properties:
      path: string
      pattern: string
      matches:
        type: array
        items: object
      match_count: integer
      returned_match_count: integer
      total_lines: integer
      context_lines: integer
      truncated: boolean
      bytes: integer
      artifacts:
        type: array
        items: object
  diagnostic_context_retry:
    type: object
    required: [repo, diagnostics, snippets, unreadable, artifacts]
    properties:
      repo: string
      diagnostics:
        type: array
        items: object
      snippets:
        type: array
        items: object
      unreadable:
        type: array
        items: object
      artifacts:
        type: array
        items: object
  repair_plan_retry:
    type: object
    required: [operations, rationale]
    properties:
      operations:
        type: array
        min_items: 1
        max_items: 20
        items:
          type: object
          additional_properties: false
          required: [kind, path]
          properties:
            kind:
              type: enum
              enum: [edit, write]
            path: string
            old_string: string
            new_string: string
            content: string
            replace_all: boolean
            match_strategy:
              type: enum
              enum: [auto, exact, line_trimmed, whitespace_normalized, indentation_flexible]
      rationale: string
  patch_result_retry:
    type: object
    required: [repo, success, checked, applied, files, file_count, diagnostics, artifacts]
    properties:
      repo: string
      success: boolean
      checked: boolean
      applied: boolean
      files:
        type: array
        items: object
      file_count: integer
      diagnostics:
        type: array
        items: object
      artifacts:
        type: array
        items: object
  patch_check_result_retry:
    type: object
    required: [repo, success, checked, applied, files, file_count, diagnostics, artifacts]
    properties:
      repo: string
      success: boolean
      checked: boolean
      applied: boolean
      files:
        type: array
        items: object
      file_count: integer
      diagnostics:
        type: array
        items: object
      artifacts:
        type: array
        items: object
  final_test_results_retry:
    type: object
    required: [command, success, log, diagnostics, artifacts]
    properties:
      command: string
      success: boolean
      status: integer
      log: string
      diagnostics:
        type: array
        items: object
      artifacts:
        type: array
        items: object
  workspace_status:
    type: object
    required: [repo, clean, entries, file_count, artifacts]
    properties:
      repo: string
      clean: boolean
      entries:
        type: array
        items: object
      file_count: integer
      truncated: boolean
      artifacts:
        type: array
        items: object
  workspace_status_before:
    type: object
    required: [repo, clean, entries, file_count, artifacts]
    properties:
      repo: string
      clean: boolean
      entries:
        type: array
        items: object
      file_count: integer
      truncated: boolean
      artifacts:
        type: array
        items: object
  workspace_diff:
    type: object
    required: [repo, diff, bytes, truncated, artifacts]
    properties:
      repo: string
      diff: string
      bytes: integer
      truncated: boolean
      artifacts:
        type: array
        items: object
  repair_draft:
    type: object
    required: [target_path, initial_success, final_success, patch_applied, rationale, diagnostics, changed_files]
    properties:
      target_path: string
      initial_success: boolean
      final_success: boolean
      patch_applied: boolean
      rationale: string
      diagnostics:
        type: array
        items: object
      changed_files:
        type: array
        items: object
  repair:
    type: object
    required: [target_path, initial_success, final_success, patch_applied, rationale, diagnostics, workspace_clean_before, workspace_clean, preexisting_changed_files, changed_files, workspace_changed_files, workspace_diff]
    properties:
      target_path: string
      initial_success: boolean
      final_success: boolean
      patch_applied: boolean
      rationale: string
      diagnostics:
        type: array
        items: object
      workspace_clean_before: boolean
      workspace_clean: boolean
      preexisting_changed_files:
        type: array
        items: object
      changed_files:
        type: array
        items: object
      workspace_changed_files:
        type: array
        items: object
      workspace_diff:
        type: object
        required: [repo, diff, bytes, truncated, artifacts]
        properties:
          repo: string
          diff: string
          bytes: integer
          truncated: boolean
          artifacts:
            type: array
            items: object
  progress:
    type: object
    required: [todos, total, open_count, pending_count, in_progress_count, completed_count, cancelled_count, artifacts]
    properties:
      todos:
        type: array
        items: object
      total: integer
      open_count: integer
      pending_count: integer
      in_progress_count: integer
      completed_count: integer
      cancelled_count: integer
      artifacts:
        type: array
        items: object

tools:
  - name: todo.write
    capability: task.progress
    timeout_ms: 10000
  - name: todo.read
    capability: task.progress
    timeout_ms: 10000
  - name: file.read
    capability: file.read
    timeout_ms: 10000
  - name: file.search
    capability: file.read
    timeout_ms: 10000
  - name: file.ops
    capability: file.write
    timeout_ms: 10000
  - name: file.read_many
    capability: file.read
    timeout_ms: 10000
  - name: diagnostic.context
    capability: code.read
    timeout_ms: 10000
  - name: git.status
    capability: code.read
    timeout_ms: 10000
  - name: git.diff
    capability: code.read
    timeout_ms: 10000
  - name: test.run
    capability: code.test
    timeout_ms: 30000

workflow:
  kind: state_machine
  initial: init
  max_steps: 18
  terminal: [done, failed]
  rules:
    - id: init
      when: phase == "init"
      actions:
        - kind: tool_call
          tool: todo.write
          input:
            object:
              todos:
                array:
                  - object:
                      id:
                        literal: inspect
                      content:
                        literal: "Inspect target and related files"
                      status:
                        literal: in_progress
                      priority:
                        literal: high
                  - object:
                      id:
                        literal: test
                      content:
                        literal: "Run allowlisted failing test"
                      status:
                        literal: pending
                      priority:
                        literal: high
                  - object:
                      id:
                        literal: repair
                      content:
                        literal: "Patch the failing behavior"
                      status:
                        literal: pending
                      priority:
                        literal: high
                  - object:
                      id:
                        literal: verify
                      content:
                        literal: "Retest and collect workspace diff"
                      status:
                        literal: pending
                      priority:
                        literal: high
          output: progress
          timeout_seconds: 10
          retry:
            max_attempts: 1
        - kind: tool_call
          tool: git.status
          input:
            literal: {}
          output: workspace_status_before
          timeout_seconds: 10
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: read

    - id: read
      when: phase == "read"
      actions:
        - kind: tool_call
          tool: file.read
          input:
            object:
              path:
                ref: target_path
              line_numbers:
                literal: true
          output: file_context
          timeout_seconds: 10
          retry:
            max_attempts: 1
        - kind: tool_call
          tool: file.search
          input:
            object:
              path:
                ref: target_path
              pattern:
                ref: target_search_pattern
              context_lines:
                literal: 8
          output: target_matches
          timeout_seconds: 10
          retry:
            max_attempts: 1
        - kind: tool_call
          tool: file.read_many
          input:
            object:
              files:
                ref: related_files
              line_numbers:
                literal: true
          output: related_context
          timeout_seconds: 10
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: test

    - id: test
      when: phase == "test"
      actions:
        - kind: tool_call
          tool: test.run
          input:
            object:
              command:
                ref: test_command
          output: test_results
          timeout_seconds: 30
          retry:
            max_attempts: 1
        - kind: tool_call
          tool: diagnostic.context
          input:
            object:
              diagnostics:
                ref: test_results.diagnostics
              context_lines:
                literal: 3
          output: diagnostic_context
          timeout_seconds: 10
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: route

    - id: already-passing
      when: phase == "route" && test_results.success == true && force_patch == false
      actions:
        - kind: set
          values:
            repair_draft:
              object:
                target_path:
                  ref: target_path
                initial_success:
                  literal: true
                final_success:
                  literal: true
                patch_applied:
                  literal: false
                rationale:
                  literal: "The allowlisted test already passed, so no patch was applied."
                diagnostics:
                  ref: test_results.diagnostics
                changed_files:
                  array: []
            phase: status

    - id: repair
      when: phase == "route" && test_results.success == false || phase == "route" && force_patch == true
      actions:
        - kind: tool_call
          tool: todo.write
          input:
            object:
              todos:
                array:
                  - object:
                      id:
                        literal: inspect
                      content:
                        literal: "Inspect target and related files"
                      status:
                        literal: completed
                      priority:
                        literal: high
                  - object:
                      id:
                        literal: test
                      content:
                        literal: "Run allowlisted failing test"
                      status:
                        literal: completed
                      priority:
                        literal: high
                  - object:
                      id:
                        literal: repair
                      content:
                        literal: "Patch the failing behavior"
                      status:
                        literal: in_progress
                      priority:
                        literal: high
                  - object:
                      id:
                        literal: verify
                      content:
                        literal: "Retest and collect workspace diff"
                      status:
                        literal: pending
                      priority:
                        literal: high
          output: progress
          timeout_seconds: 10
          retry:
            max_attempts: 1
        - kind: tool_call
          tool: todo.read
          input:
            literal: {}
          output: progress
          timeout_seconds: 10
          retry:
            max_attempts: 1
        - kind: model_call
          model: code_repairer
          input:
            object:
              task:
                ref: task
              target_path:
                ref: target_path
              file_context:
                ref: file_context
              target_matches:
                ref: target_matches
              related_context:
                ref: related_context
              diagnostics:
                ref: test_results.diagnostics
              diagnostic_context:
                ref: diagnostic_context
              log:
                ref: test_results.log
              progress:
                ref: progress
          output: repair_plan
          timeout_seconds: 120
          retry:
            max_attempts: 2
        - kind: set
          values:
            phase: patch_check

    - id: patch-check
      when: phase == "patch_check"
      actions:
        - kind: approval
          approval_for: [file.write]
        - kind: tool_call
          tool: file.ops
          input:
            object:
              operations:
                ref: repair_plan.operations
              dry_run:
                literal: true
          output: patch_check_result
          timeout_seconds: 10
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: patch_check_route

    - id: patch-check-ok
      when: phase == "patch_check_route" && patch_check_result.success == true
      actions:
        - kind: set
          values:
            phase: patch

    - id: patch-check-failed
      when: phase == "patch_check_route" && patch_check_result.success == false
      actions:
        - kind: set
          values:
            final_test_results:
              object:
                command:
                  ref: test_command
                success:
                  literal: false
                status:
                  literal: 1
                log:
                  literal: "structured file operations dry-run failed before apply"
                diagnostics:
                  ref: patch_check_result.diagnostics
                artifacts:
                  ref: patch_check_result.artifacts
            phase: reread

    - id: patch
      when: phase == "patch"
      actions:
        - kind: tool_call
          tool: file.ops
          input:
            object:
              operations:
                ref: repair_plan.operations
          output: patch_result
          timeout_seconds: 10
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: retest

    - id: retest
      when: phase == "retest"
      actions:
        - kind: tool_call
          tool: test.run
          input:
            object:
              command:
                ref: test_command
          output: final_test_results
          timeout_seconds: 30
          retry:
            max_attempts: 1
        - kind: set
          values:
            repair_draft:
              object:
                target_path:
                  ref: target_path
                initial_success:
                  literal: false
                final_success:
                  ref: final_test_results.success
                patch_applied:
                  literal: true
                rationale:
                  ref: repair_plan.rationale
                diagnostics:
                  ref: final_test_results.diagnostics
                changed_files:
                  ref: patch_result.files
            phase: evaluate

    - id: first-pass-success
      when: phase == "evaluate" && final_test_results.success == true
      actions:
        - kind: set
          values:
            phase: status

    - id: first-pass-failed
      when: phase == "evaluate" && final_test_results.success == false
      actions:
        - kind: set
          values:
            phase: reread

    - id: reread
      when: phase == "reread"
      actions:
        - kind: tool_call
          tool: file.read
          input:
            object:
              path:
                ref: target_path
              line_numbers:
                literal: true
          output: file_context_retry
          timeout_seconds: 10
          retry:
            max_attempts: 1
        - kind: tool_call
          tool: file.search
          input:
            object:
              path:
                ref: target_path
              pattern:
                ref: target_search_pattern
              context_lines:
                literal: 8
          output: target_matches_retry
          timeout_seconds: 10
          retry:
            max_attempts: 1
        - kind: tool_call
          tool: diagnostic.context
          input:
            object:
              diagnostics:
                ref: final_test_results.diagnostics
              context_lines:
                literal: 3
          output: diagnostic_context_retry
          timeout_seconds: 10
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: repair_again

    - id: repair-again
      when: phase == "repair_again"
      actions:
        - kind: tool_call
          tool: todo.write
          input:
            object:
              todos:
                array:
                  - object:
                      id:
                        literal: inspect
                      content:
                        literal: "Inspect target and related files"
                      status:
                        literal: completed
                      priority:
                        literal: high
                  - object:
                      id:
                        literal: test
                      content:
                        literal: "Run allowlisted failing test"
                      status:
                        literal: completed
                      priority:
                        literal: high
                  - object:
                      id:
                        literal: repair
                      content:
                        literal: "Patch the failing behavior"
                      status:
                        literal: completed
                      priority:
                        literal: high
                  - object:
                      id:
                        literal: verify
                      content:
                        literal: "Retest and collect workspace diff"
                      status:
                        literal: in_progress
                      priority:
                        literal: high
          output: progress
          timeout_seconds: 10
          retry:
            max_attempts: 1
        - kind: tool_call
          tool: todo.read
          input:
            literal: {}
          output: progress
          timeout_seconds: 10
          retry:
            max_attempts: 1
        - kind: model_call
          model: code_repairer
          input:
            object:
              task:
                ref: task
              target_path:
                ref: target_path
              file_context:
                ref: file_context_retry
              target_matches:
                ref: target_matches_retry
              related_context:
                ref: related_context
              diagnostics:
                ref: final_test_results.diagnostics
              diagnostic_context:
                ref: diagnostic_context_retry
              log:
                ref: final_test_results.log
              previous_rationale:
                ref: repair_plan.rationale
              progress:
                ref: progress
          output: repair_plan_retry
          timeout_seconds: 120
          retry:
            max_attempts: 2
        - kind: set
          values:
            phase: patch_check_again

    - id: patch-check-again
      when: phase == "patch_check_again"
      actions:
        - kind: tool_call
          tool: file.ops
          input:
            object:
              operations:
                ref: repair_plan_retry.operations
              dry_run:
                literal: true
          output: patch_check_result_retry
          timeout_seconds: 10
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: patch_check_again_route

    - id: patch-check-again-ok
      when: phase == "patch_check_again_route" && patch_check_result_retry.success == true
      actions:
        - kind: set
          values:
            phase: patch_again

    - id: patch-check-again-failed
      when: phase == "patch_check_again_route" && patch_check_result_retry.success == false
      actions:
        - kind: set
          values:
            repair_draft:
              object:
                target_path:
                  ref: target_path
                initial_success:
                  literal: false
                final_success:
                  literal: false
                patch_applied:
                  literal: false
                rationale:
                  template: "{{repair_plan.rationale}}\n\nSecond pass structured file operations validation failed before apply: {{repair_plan_retry.rationale}}"
                diagnostics:
                  ref: patch_check_result_retry.diagnostics
                changed_files:
                  ref: patch_check_result_retry.files
            phase: status

    - id: patch-again
      when: phase == "patch_again"
      actions:
        - kind: tool_call
          tool: file.ops
          input:
            object:
              operations:
                ref: repair_plan_retry.operations
          output: patch_result_retry
          timeout_seconds: 10
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: retest_again

    - id: retest-again
      when: phase == "retest_again"
      actions:
        - kind: tool_call
          tool: test.run
          input:
            object:
              command:
                ref: test_command
          output: final_test_results_retry
          timeout_seconds: 30
          retry:
            max_attempts: 1
        - kind: set
          values:
            repair_draft:
              object:
                target_path:
                  ref: target_path
                initial_success:
                  literal: false
                final_success:
                  ref: final_test_results_retry.success
                patch_applied:
                  literal: true
                rationale:
                  template: "{{repair_plan.rationale}}\n\nSecond pass: {{repair_plan_retry.rationale}}"
                diagnostics:
                  ref: final_test_results_retry.diagnostics
                changed_files:
                  ref: patch_result_retry.files
            phase: status

    - id: status
      when: phase == "status"
      actions:
        - kind: tool_call
          tool: git.status
          input:
            literal: {}
          output: workspace_status
          timeout_seconds: 10
          retry:
            max_attempts: 1
        - kind: tool_call
          tool: git.diff
          input:
            object:
              files:
                ref: repair_draft.changed_files
          output: workspace_diff
          timeout_seconds: 10
          retry:
            max_attempts: 1
        - kind: set
          values:
            repair:
              object:
                target_path:
                  ref: repair_draft.target_path
                initial_success:
                  ref: repair_draft.initial_success
                final_success:
                  ref: repair_draft.final_success
                patch_applied:
                  ref: repair_draft.patch_applied
                rationale:
                  ref: repair_draft.rationale
                diagnostics:
                  ref: repair_draft.diagnostics
                workspace_clean_before:
                  ref: workspace_status_before.clean
                workspace_clean:
                  ref: workspace_status.clean
                preexisting_changed_files:
                  ref: workspace_status_before.entries
                changed_files:
                  ref: repair_draft.changed_files
                workspace_changed_files:
                  ref: workspace_status.entries
                workspace_diff:
                  ref: workspace_diff
            phase: done

    - id: done
      when: phase == "done"
      actions:
        - kind: return
          output: repair

policy:
  max_tool_calls: 21
  max_model_calls: 2
  require_approval: [file.write]
  timeout_seconds: 360

observability:
  traces: true
