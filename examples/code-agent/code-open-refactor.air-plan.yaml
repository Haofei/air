plan:
  name: code-open-refactor
  version: 0.1.0
  description: "Open-ended bounded refactor loop: explore first, select one safe target/test pair, then run the direct refactor kernel."

requires:
  capabilities: [task.progress, network.search, file.read, file.write, code.read, code.test]

nodes:
  - id: explore
    module: code.explore@0.1.0
  - id: select_candidate
    module: code.refactor_candidate@0.1.0
  - id: refactor
    module: code.repair@0.1.0

entry: explore

edges:
  - from: explore
    to: select_candidate
  - from: select_candidate
    to: refactor

connect:
  - from: $input.task
    to: explore.task
  - from: $input.query
    to: explore.query
  - to: explore.target_path
    value:
      literal: ""
  - from: $input.task
    to: select_candidate.task
  - from: $input.query
    to: select_candidate.query
  - from: $input.allowed_test_commands
    to: select_candidate.allowed_test_commands
  - from: explore.exploration
    to: select_candidate.exploration
  - from: $input.task
    to: refactor.task
  - from: $input.query
    to: refactor.query
  - from: $input.target_search_pattern
    to: refactor.target_search_pattern
  - from: select_candidate.refactor_candidate.target_path
    to: refactor.target_path
  - from: select_candidate.refactor_candidate.related_files
    to: refactor.related_files
  - from: select_candidate.refactor_candidate.test_command
    to: refactor.test_command
  - to: refactor.force_patch
    value:
      literal: true

outputs:
  exploration: explore.exploration
  refactor_candidate: select_candidate.refactor_candidate
  refactor: refactor.repair
  repair: refactor.repair

decisions:
  - id: choose-open-refactor-loop
    rationale: "No target file was provided, so first explore read-only context, select one bounded refactor candidate with an allowlisted test, then run the direct refactor kernel."
    selected: [explore, select_candidate, refactor]
