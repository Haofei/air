plan:
  name: code-build-page
  version: 0.1.0
  description: "Build one bounded static HTML page through an AIR code builder module."

requires:
  capabilities: [file.write, code.test]

nodes:
  - id: build
    module: code.build_page@0.1.0

entry: build

connect:
  - from: $input.task
    to: build.task
  - from: $input.output_path
    to: build.output_path
  - from: $input.brand
    to: build.brand
  - from: $input.product
    to: build.product
  - from: $input.constraints
    to: build.constraints

outputs:
  build: build.build

decisions:
  - id: choose-static-page-builder
    rationale: "The task asks the code agent to create a static landing page, so use the bounded page builder with file write and smoke test capabilities."
    selected: [build]
