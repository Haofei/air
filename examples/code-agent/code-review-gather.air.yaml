agent:
  name: code-review-gather-agent
  version: 0.1.0
  description: "Gather bounded coding review evidence before shared context compaction and final analysis."

inputs:
  task: string
  search_query: string
  repo_query: string
  required_terms:
    type: array
    items: string
  target_file: string
  related_files:
    type: array
    items: string

outputs:
  evidence: object

requires:
  capabilities: [task.progress, network.search, file.read, code.read, code.test]

state:
  phase:
    type: enum
    enum: [init, plan, search, list_files, inspect_symbols, inspect_references, search_repo, read_context, read_file, read_related_files, read_diff, read_status, run_tests, read_todos, done, failed]
  plan_status: object
  todo_snapshot: object
  search_results: object
  repo_files: object
  repo_search: object
  repo_symbols: object
  repo_references: object
  repo_context: object
  file_context: object
  related_file_context: object
  diff_context: object
  workspace_status: object
  test_results: object
  evidence: object

tools:
  - name: todo.write
    capability: task.progress
    timeout_ms: 10000
  - name: todo.read
    capability: task.progress
    timeout_ms: 10000
  - name: web.search
    capability: network.search
    timeout_ms: 120000
  - name: file.read
    capability: file.read
    timeout_ms: 10000
  - name: file.read_many
    capability: file.read
    timeout_ms: 10000
  - name: repo.files
    capability: code.read
    timeout_ms: 10000
  - name: repo.search
    capability: code.read
    timeout_ms: 10000
  - name: repo.symbols
    capability: code.read
    timeout_ms: 10000
  - name: repo.references
    capability: code.read
    timeout_ms: 10000
  - name: repo.context
    capability: code.read
    timeout_ms: 10000
  - name: git.diff
    capability: code.read
    timeout_ms: 10000
  - name: git.status
    capability: code.read
    timeout_ms: 10000
  - name: test.run
    capability: code.test
    timeout_ms: 120000

workflow:
  kind: state_machine
  initial: init
  max_steps: 16
  terminal: [done, failed]
  rules:
    - id: init
      when: phase == "init"
      actions:
        - kind: set
          values:
            phase: plan

    - id: plan
      when: phase == "plan"
      actions:
        - kind: tool_call
          tool: todo.write
          input:
            object:
              todos:
                array:
                  - object:
                      id:
                        literal: gather-evidence
                      content:
                        literal: Gather external references, repository matches, target file context, diff, status, and verification output.
                      status:
                        literal: in_progress
                      priority:
                        literal: high
                  - object:
                      id:
                        literal: compact-context
                      content:
                        literal: Route the evidence bundle through the shared AIR context compaction module when needed.
                      status:
                        literal: pending
                      priority:
                        literal: high
                  - object:
                      id:
                        literal: analyze-risks
                      content:
                        literal: Produce grounded findings with cited artifact ids and search quality gaps.
                      status:
                        literal: pending
                      priority:
                        literal: high
          output: plan_status
          timeout_seconds: 10
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: search

    - id: search
      when: phase == "search"
      actions:
        - kind: tool_call
          tool: web.search
          input:
            object:
              query:
                ref: search_query
              query_variants:
                array:
                  - template: "{{search_query}} official docs"
                  - template: "{{search_query}} GitHub issues"
                  - template: "{{search_query}} examples"
              required_terms:
                ref: required_terms
              max_results:
                literal: 6
              max_results_per_query:
                literal: 5
              max_per_domain:
                literal: 1
          output: search_results
          timeout_seconds: 120
          retry:
            max_attempts: 2
        - kind: set
          values:
            phase: list_files

    - id: list_files
      when: phase == "list_files"
      actions:
        - kind: tool_call
          tool: repo.files
          input:
            object:
              query:
                ref: repo_query
          output: repo_files
          timeout_seconds: 10
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: inspect_symbols

    - id: inspect_symbols
      when: phase == "inspect_symbols"
      actions:
        - kind: tool_call
          tool: repo.symbols
          input:
            object:
              query:
                ref: repo_query
              max_symbols:
                literal: 80
          output: repo_symbols
          timeout_seconds: 10
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: inspect_references

    - id: inspect_references
      when: phase == "inspect_references"
      actions:
        - kind: tool_call
          tool: repo.references
          input:
            object:
              symbol:
                ref: repo_query
              max_matches:
                literal: 80
              max_files:
                literal: 6
              context_lines:
                literal: 4
          output: repo_references
          timeout_seconds: 10
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: search_repo

    - id: search_repo
      when: phase == "search_repo"
      actions:
        - kind: tool_call
          tool: repo.search
          input:
            object:
              query:
                ref: repo_query
          output: repo_search
          timeout_seconds: 10
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: read_context

    - id: read_context
      when: phase == "read_context"
      actions:
        - kind: tool_call
          tool: repo.context
          input:
            object:
              query:
                ref: repo_query
              max_files:
                literal: 6
              context_lines:
                literal: 8
          output: repo_context
          timeout_seconds: 10
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: read_file

    - id: read_file
      when: phase == "read_file"
      actions:
        - kind: tool_call
          tool: file.read
          input:
            object:
              path:
                ref: target_file
              line_numbers:
                literal: true
          output: file_context
          timeout_seconds: 10
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: read_related_files

    - id: read_related_files
      when: phase == "read_related_files"
      actions:
        - kind: tool_call
          tool: file.read_many
          input:
            object:
              files:
                ref: related_files
          output: related_file_context
          timeout_seconds: 10
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: read_diff

    - id: read_diff
      when: phase == "read_diff"
      actions:
        - kind: tool_call
          tool: git.diff
          input:
            object:
              path:
                ref: target_file
              staged:
                literal: false
          output: diff_context
          timeout_seconds: 10
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: read_status

    - id: read_status
      when: phase == "read_status"
      actions:
        - kind: tool_call
          tool: git.status
          input:
            literal: {}
          output: workspace_status
          timeout_seconds: 10
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: run_tests

    - id: run_tests
      when: phase == "run_tests"
      actions:
        - kind: tool_call
          tool: test.run
          input:
            object:
              command:
                literal: air_tools
          output: test_results
          timeout_seconds: 120
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: read_todos

    - id: read_todos
      when: phase == "read_todos"
      actions:
        - kind: tool_call
          tool: todo.read
          input:
            literal: {}
          output: todo_snapshot
          timeout_seconds: 10
          retry:
            max_attempts: 1
        - kind: set
          values:
            evidence:
              object:
                task:
                  ref: task
                target_file:
                  ref: target_file
                search_results:
                  ref: search_results
                repo_files:
                  ref: repo_files
                repo_search:
                  ref: repo_search
                repo_symbols:
                  ref: repo_symbols
                repo_references:
                  ref: repo_references
                repo_context:
                  ref: repo_context
                file_context:
                  ref: file_context
                related_file_context:
                  ref: related_file_context
                diff_context:
                  ref: diff_context
                workspace_status:
                  ref: workspace_status
                test_results:
                  ref: test_results
                plan_status:
                  ref: plan_status
                todo_snapshot:
                  ref: todo_snapshot
            phase: done

    - id: done
      when: phase == "done"
      actions:
        - kind: return
          output: evidence

policy:
  max_tool_calls: 13
  timeout_seconds: 300

observability:
  traces: true
