agent:
  name: code-edit-loop-agent
  version: 0.2.0
  description: "Minimal OpenCode-style code edit loop with line-numbered reads and optional LSP facts."

inputs:
  task: string

outputs:
  edit:
    type: object
    required: [initial_success, final_success, patch_applied, changed_files, workspace_changed_files, preexisting_changed_files, workspace_diff, rationale]
    properties:
      initial_success: boolean
      final_success: boolean
      patch_applied: boolean
      changed_files:
        type: array
        items: string
      workspace_changed_files:
        type: array
        items: string
      preexisting_changed_files:
        type: array
        items:
          type: object
          required: [path]
          properties:
            path: string
      workspace_diff: object
      rationale: string

requires:
  capabilities: [file.read, file.write, code.read, code.test]

policy:
  require_approval: [file.write]

state:
  phase:
    type: enum
    enum: [init, choose, act, post_act, summarize, done]
  observations:
    type: array
    items: object
  verification_status:
    type: enum
    enum: [unknown, passed, failed]
  patch_applied:
    type: boolean
  decision:
    type: object
    required: [complete, tool_calls]
    properties:
      complete: boolean
      tool_calls:
        type: array
        items:
          type: object
          required: [tool, input]
          properties:
            tool: string
            input: object
  observation:
    type: array
    items: object
  final_diff_result:
    type: array
    items: object
  edit_summary:
    type: object
    additional_properties: false
    required: [rationale]
    properties:
      rationale: string
  edit:
    type: object
    required: [initial_success, final_success, patch_applied, changed_files, workspace_changed_files, preexisting_changed_files, workspace_diff, rationale]
    properties:
      initial_success: boolean
      final_success: boolean
      patch_applied: boolean
      changed_files:
        type: array
        items: string
      workspace_changed_files:
        type: array
        items: string
      preexisting_changed_files:
        type: array
        items:
          type: object
          required: [path]
          properties:
            path: string
      workspace_diff: object
      rationale: string

tools:
  - name: glob
    capability: code.read
    timeout_ms: 10000
  - name: read
    capability: file.read
    timeout_ms: 10000
  - name: grep
    capability: file.read
    timeout_ms: 10000
  - name: lsp
    capability: code.read
    timeout_ms: 120000
  - name: edit
    capability: file.write
    timeout_ms: 10000
  - name: bash
    capability: code.test
    timeout_ms: 120000
  - name: todowrite
    capability: code.read
    timeout_ms: 10000

workflow:
  kind: state_machine
  initial: init
  max_steps: 80
  terminal: [done]
  rules:
    - id: init
      when: phase == "init"
      actions:
        - kind: approval
          approval_for: [file.write]
        - kind: set
          values:
            observations: []
            verification_status: unknown
            patch_applied: false
            phase: choose

    - id: summarize-at-step-limit
      when: phase == "choose" && _air.is_last_action_step == true
      actions:
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: step_budget_reached
              result:
                object:
                  runtime:
                    ref: _air
                  verification_status:
                    ref: verification_status
        - kind: set
          values:
            phase: summarize

    - id: choose
      when: phase == "choose"
      actions:
        - kind: model_call
          model: code_edit_decider
          input:
            object:
              task:
                ref: task
              observations:
                take_last_within_bytes:
                  ref: observations
                max_items: 8
                max_bytes: 90000
              allowed_tools:
                literal: [glob, read, grep, lsp, edit, bash, todowrite]
          output: decision
          timeout_seconds: 180
          retry:
            max_attempts: 4
        - kind: set
          values:
            phase: act

    - id: act
      when: phase == "act" && decision.complete == false
      actions:
        - kind: tool_batch_dispatch
          input:
            path: decision.tool_calls
          output: observation
          max_calls: 16
          timeout_seconds: 120
          on_error: observe
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: tool_result
              assistant:
                ref: decision
              requested:
                ref: decision.tool_calls
              result:
                ref: observation
        - kind: set
          values:
            phase: post_act

    - id: edit-applied
      when: phase == "post_act" && observation[0].tool == "edit" && observation[0].status == "ok" && observation[0].output.applied == true
      actions:
        - kind: set
          values:
            patch_applied: true
            phase: choose

    - id: bash-passed-after-patch
      when: phase == "post_act" && patch_applied == true && observation[0].tool == "bash" && observation[0].status == "ok" && observation[0].output.success == true && observation[0].output.verification == true
      actions:
        - kind: set
          values:
            verification_status: passed
            phase: summarize

    - id: bash-passed-before-patch
      when: phase == "post_act" && patch_applied != true && observation[0].tool == "bash" && observation[0].status == "ok" && observation[0].output.success == true && observation[0].output.verification == true
      actions:
        - kind: set
          values:
            verification_status: passed
            phase: choose

    - id: bash-failed
      when: phase == "post_act" && observation[0].tool == "bash" && observation[0].status == "ok" && observation[0].output.success == false && observation[0].output.verification == true
      actions:
        - kind: set
          values:
            verification_status: failed
            phase: choose

    - id: complete-needs-verification
      when: phase == "act" && decision.complete == true && verification_status != "passed"
      actions:
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: verification_required
              result:
                literal: Run an appropriate bash verification command before finishing.
        - kind: set
          values:
            phase: choose

    - id: complete-verified
      when: phase == "act" && decision.complete == true && verification_status == "passed"
      actions:
        - kind: set
          values:
            phase: summarize

    - id: continue-after-act
      when: phase == "post_act"
      actions:
        - kind: set
          values:
            phase: choose

    - id: summarize
      when: phase == "summarize"
      actions:
        - kind: tool_batch_dispatch
          input:
            array:
              - object:
                  tool:
                    literal: bash
                  input:
                    literal:
                      command: git diff --
                      description: Show workspace diff
              - object:
                  tool:
                    literal: bash
                  input:
                    literal:
                      command: git diff --name-only --
                      description: List changed files
          output: final_diff_result
          max_calls: 2
          timeout_seconds: 120
          on_error: observe
        - kind: model_call
          model: code_edit_summarizer
          input:
            object:
              task:
                ref: task
              observations:
                take_last_within_bytes:
                  ref: observations
                max_items: 6
                max_bytes: 20000
              final_diff_result:
                ref: final_diff_result
          output: edit_summary
          timeout_seconds: 180
          retry:
            max_attempts: 2
        - kind: set
          values:
            edit:
              object:
                initial_success:
                  literal: false
                final_success:
                  equals:
                    - ref: verification_status
                    - literal: passed
                patch_applied:
                  ref: patch_applied
                changed_files:
                  split_lines:
                    ref: final_diff_result[1].output.log
                workspace_changed_files:
                  split_lines:
                    ref: final_diff_result[1].output.log
                preexisting_changed_files:
                  literal: []
                workspace_diff:
                  object:
                    provider:
                      literal: bash
                    command:
                      ref: final_diff_result[0].output.input_command
                    success:
                      ref: final_diff_result[0].output.success
                    diff:
                      ref: final_diff_result[0].output.log
                    bytes:
                      ref: final_diff_result[0].output.bytes
                    truncated:
                      ref: final_diff_result[0].output.truncated
                rationale:
                  ref: edit_summary.rationale
            phase: done

    - id: done
      when: phase == "done"
      actions:
        - kind: return
          output: edit
