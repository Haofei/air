agent:
  name: code-edit-loop-agent
  version: 0.1.0
  description: "Bounded opencode-style code edit loop: model chooses declared tool calls, AIR executes them under policy, and every observation is traced."

inputs:
  task: string
  query: string
  target_path: string
  target_search_pattern: string
  related_files:
    type: array
    items: string
  write_paths:
    type: array
    items: string
  test_command: string
  force_patch: boolean

outputs:
  edit:
    type: object
    required: [initial_success, final_success, patch_applied, changed_files, workspace_changed_files, preexisting_changed_files, workspace_diff, rationale]
    properties:
      initial_success: boolean
      final_success: boolean
      patch_applied: boolean
      changed_files:
        type: array
        items: string
      workspace_changed_files:
        type: array
        items: string
      preexisting_changed_files:
        type: array
        items:
          type: object
          required: [path]
          properties:
            path: string
      workspace_diff: object
      rationale: string

requires:
  capabilities: [task.progress, file.read, file.write, code.read, code.test]

state:
  phase:
    type: enum
    enum: [init, preflight, choose, act, post_act, post_verify, summarize, done, failed]
  observations:
    type: array
    items: object
  verification_status:
    type: enum
    enum: [unknown, passed, failed]
  decision:
    type: object
    required: [complete, tool_calls, rationale]
    properties:
      complete: boolean
      tool_calls:
        type: array
        max_items: 4
        items:
          type: object
          properties:
            tool: string
            input: object
            name: string
            args: object
            arguments: object
      rationale: string
  observation:
    type: array
    items:
      type: object
  auto_verify_result:
    type: array
    items:
      type: object
  final_diff_result:
    type: array
    items:
      type: object
  initial_target_context:
    type: array
    items:
      type: object
  edit:
    type: object
    required: [initial_success, final_success, patch_applied, changed_files, workspace_changed_files, preexisting_changed_files, workspace_diff, rationale]
    properties:
      initial_success: boolean
      final_success: boolean
      patch_applied: boolean
      changed_files:
        type: array
        items: string
      workspace_changed_files:
        type: array
        items: string
      preexisting_changed_files:
        type: array
        items:
          type: object
          required: [path]
          properties:
            path: string
      workspace_diff: object
      rationale: string

tools:
  - name: todo.write
    capability: task.progress
    timeout_ms: 10000
  - name: todo.read
    capability: task.progress
    timeout_ms: 10000
  - name: repo.files
    capability: code.read
    timeout_ms: 10000
  - name: repo.search
    capability: code.read
    timeout_ms: 10000
  - name: repo.context
    capability: code.read
    timeout_ms: 10000
  - name: repo.symbols
    capability: code.read
    timeout_ms: 10000
  - name: repo.references
    capability: code.read
    timeout_ms: 10000
  - name: file.read
    capability: file.read
    timeout_ms: 10000
  - name: file.read_many
    capability: file.read
    timeout_ms: 10000
  - name: file.search
    capability: file.read
    timeout_ms: 10000
  - name: file.ops
    capability: file.write
    timeout_ms: 10000
  - name: file.patch
    capability: file.write
    timeout_ms: 10000
  - name: diagnostic.context
    capability: code.read
    timeout_ms: 10000
  - name: git.status
    capability: code.read
    timeout_ms: 10000
  - name: git.diff
    capability: code.read
    timeout_ms: 10000
  - name: test.run
    capability: code.test
    timeout_ms: 120000

workflow:
  kind: state_machine
  initial: init
  max_steps: 28
  terminal: [done, failed]
  rules:
    - id: init
      when: phase == "init"
      actions:
        - kind: approval
          approval_for: [file.write]
        - kind: set
          values:
            observations: []
            verification_status: unknown
            phase: preflight

    - id: preflight-target-search
      when: phase == "preflight" && target_path != "" && target_search_pattern != ""
      actions:
        - kind: tool_batch_dispatch
          input:
            array:
              - object:
                  tool:
                    literal: file.search
                  input:
                    object:
                      path:
                        ref: target_path
                      pattern:
                        ref: target_search_pattern
                      context_lines:
                        literal: 8
                      max_matches:
                        literal: 20
          output: initial_target_context
          max_calls: 1
          timeout_seconds: 120
          on_error: observe
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: initial_target_search
              rationale:
                literal: Deterministically search target_path before the first model decision so large files start from narrow, task-relevant context.
              requested:
                array:
                  - object:
                      tool:
                        literal: file.search
                      input:
                        object:
                          path:
                            ref: target_path
                          pattern:
                            ref: target_search_pattern
              result:
                ref: initial_target_context
        - kind: set
          values:
            phase: choose

    - id: preflight-target-read
      when: phase == "preflight" && target_path != "" && target_search_pattern == ""
      actions:
        - kind: tool_batch_dispatch
          input:
            array:
              - object:
                  tool:
                    literal: file.read
                  input:
                    object:
                      path:
                        ref: target_path
                      line_numbers:
                        literal: true
                      max_bytes:
                        literal: 32768
          output: initial_target_context
          max_calls: 1
          timeout_seconds: 120
          on_error: observe
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: initial_target_read
              rationale:
                literal: Deterministically read target_path before the first model decision so the edit loop starts from exact repository context.
              requested:
                array:
                  - object:
                      tool:
                        literal: file.read
                      input:
                        object:
                          path:
                            ref: target_path
              result:
                ref: initial_target_context
        - kind: set
          values:
            phase: choose

    - id: preflight-targetless
      when: phase == "preflight" && target_path == ""
      actions:
        - kind: set
          values:
            phase: choose

    - id: choose
      when: phase == "choose"
      actions:
        - kind: model_call
          model: code_edit_decider
          input:
            object:
              task:
                ref: task
              query:
                ref: query
              target_path:
                ref: target_path
              target_search_pattern:
                ref: target_search_pattern
              related_files:
                ref: related_files
              write_paths:
                ref: write_paths
              test_command:
                ref: test_command
              force_patch:
                ref: force_patch
              observations:
                ref: observations
              verification_status:
                ref: verification_status
              allowed_tools:
                array:
                  - literal: todo.write
                  - literal: todo.read
                  - literal: repo.files
                  - literal: repo.search
                  - literal: repo.context
                  - literal: repo.symbols
                  - literal: repo.references
                  - literal: file.read
                  - literal: file.read_many
                  - literal: file.search
                  - literal: file.ops
                  - literal: file.patch
                  - literal: diagnostic.context
                  - literal: git.status
                  - literal: git.diff
                  - literal: test.run
              tool_schemas:
                literal:
                  todo.write:
                    required: {items: "array of short todo items"}
                    optional: {merge: "boolean"}
                  todo.read:
                    required: {}
                    optional: {}
                  repo.files:
                    required: {}
                    optional:
                      query: "substring filter"
                      pattern: "query alias, or glob/path pattern when it contains /, *, ?, or ["
                      glob: "path glob such as examples/code-agent/**"
                      max_files: "bounded result limit"
                      include_all: "boolean"
                  repo.search:
                    required: {query: "search text; pattern is accepted as an alias"}
                    optional:
                      mode: "fixed, regex, or smart"
                      file_glob: "path glob alias"
                      path: "repo-relative scope"
                      max_matches: "bounded result limit"
                  repo.context:
                    required: {query: "search text"}
                    optional:
                      mode: "fixed, regex, or smart"
                      path: "repo-relative scope"
                      context_lines: "bounded context lines"
                      max_matches: "bounded result limit"
                  repo.symbols:
                    required: {}
                    optional:
                      query: "symbol/name filter"
                      path: "repo-relative scope"
                      max_symbols: "bounded result limit"
                  repo.references:
                    required: {symbol: "exact identifier"}
                    optional:
                      path: "repo-relative scope"
                      context_lines: "bounded context lines"
                      max_matches: "bounded result limit"
                  file.read:
                    required: {path: "repo-relative file path"}
                    optional:
                      start_line: "1-based start line"
                      end_line: "1-based end line"
                      lines: "single line or start-end range"
                      line_numbers: "boolean"
                      max_bytes: "bounded byte limit"
                  file.read_many:
                    required: {files: "array of paths or objects with path"}
                    optional:
                      max_bytes_per_file: "bounded byte limit"
                      line_numbers: "boolean"
                  file.search:
                    required:
                      path: "repo-relative file or directory"
                      pattern: "regular expression; query is accepted as an alias"
                    optional:
                      context_lines: "bounded context lines"
                      max_matches: "bounded result limit"
                  file.ops:
                    required:
                      operations: "array; each item must be one of: {kind:'edit', path, old_string, new_string}; {kind:'replace_lines', path, start_line, end_line, new_string}; {kind:'write', path, content}"
                    optional:
                      path: "default repo-relative path for all operations"
                      kind: "default operation kind"
                      edits: "operations alias using the same operation shapes"
                      ops: "operations alias using the same operation shapes"
                      dry_run: "boolean"
                      allowed_paths: "automatically injected from write_paths; do not override"
                      max_changed_lines: "bounded changed-line limit; can only lower configured cap"
                  file.patch:
                    required: {patch: "unified diff"}
                    optional:
                      dry_run: "boolean"
                      allowed_paths: "automatically injected from write_paths; do not override"
                      max_changed_lines: "bounded changed-line limit; can only lower configured cap"
                  diagnostic.context:
                    required: {}
                    optional:
                      diagnostics: "array of diagnostic objects"
                      path: "repo-relative scope"
                  git.status:
                    required: {}
                    optional: {}
                  git.diff:
                    required: {}
                    optional:
                      paths: "array of repo-relative paths"
                      include_untracked: "boolean"
                  test.run:
                    required: {command: "the supplied allowlisted test_command"}
                    optional:
                      package: "top-level package parameter for configured cargo package tests"
                      test_filter: "top-level test filter parameter for configured cargo filtered tests"
                      args: "accepted alias object for parameters, but prefer top-level fields"
              tool_policy:
                literal:
                  plan: "Use todo.write/read to track multi-step edits, especially when a task touches several files or requires repeated verification."
                  discover: "Use repo.files for glob-style path discovery, repo.search/file.search for text search, repo.symbols for definitions, and repo.references for call sites before broad edits."
                  paths: "Copy repository paths exactly byte-for-byte from target_path, write_paths, or artifact metadata. Include full extensions such as .json; never abbreviate, truncate, or rewrite path suffixes."
                  read_first: "Call file.read, file.search, repo.context, or diagnostic.context before file.ops or file.patch edits."
                  small_steps: "Choose one to four tool calls per turn. Batch independent read/search/todo calls when useful. Do not request whole large files."
                  edits: "Use file.ops with kind=edit old_string/new_string for anchored insertions or wording changes, especially in docs. Use kind=replace_lines only when line numbers came from the latest read and new_string preserves every line that should remain. Do not use old_string/replace or new_content/new_lines fields. Use file.patch for unified diffs when force_patch is true or a patch is clearer. If a turn includes file.ops or file.patch, keep that batch to one write-focused call."
                  tests: "Use test.run with the supplied allowlisted test_command only. A test.run tool event can have status=ok while output.success=false; treat output.success=false as a failed verification and fix diagnostics before any completion."
                  verify: "Before complete=true, normally choose test.run and git.diff so the final summary can prove the outcome."
                  finish: "Return complete=true with tool_calls=[] only after the edit/no-op decision is verified."
          output: decision
          timeout_seconds: 90
          retry:
            max_attempts: 2
        - kind: set
          values:
            phase: act

    - id: act
      when: phase == "act" && decision.complete == false
      actions:
        - kind: tool_batch_dispatch
          input:
            path: decision.tool_calls
          write_scope:
            ref: write_paths
          output: observation
          max_calls: 4
          timeout_seconds: 120
          on_error: observe
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: tool_batch_dispatch
              rationale:
                path: decision.rationale
              requested:
                path: decision.tool_calls
              result:
                ref: observation
        - kind: set
          values:
            phase: post_act

    - id: auto-verify-file-ops
      when: phase == "post_act" && observation[0].tool == "file.ops" && observation[0].status == "ok" && observation[0].output.applied == true
      actions:
        - kind: tool_batch_dispatch
          input:
            array:
              - object:
                  tool:
                    literal: test.run
                  input:
                    object:
                      command:
                        ref: test_command
          output: auto_verify_result
          max_calls: 1
          timeout_seconds: 120
          on_error: observe
        - kind: set
          values:
            phase: post_verify

    - id: auto-verify-file-patch
      when: phase == "post_act" && observation[0].tool == "file.patch" && observation[0].status == "ok" && observation[0].output.applied == true
      actions:
        - kind: tool_batch_dispatch
          input:
            array:
              - object:
                  tool:
                    literal: test.run
                  input:
                    object:
                      command:
                        ref: test_command
          output: auto_verify_result
          max_calls: 1
          timeout_seconds: 120
          on_error: observe
        - kind: set
          values:
            phase: post_verify

    - id: record-auto-verify-failed-tool
      when: phase == "post_verify" && auto_verify_result[0].status == "error"
      actions:
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: auto_verify_failed
              rationale:
                literal: Automatically ran validation after a workspace edit; the validation tool returned an error and must be fixed before completion.
              requested:
                array:
                  - object:
                      tool:
                        literal: test.run
                      input:
                        object:
                          command:
                            ref: test_command
              result:
                ref: auto_verify_result
        - kind: set
          values:
            verification_status: failed
            phase: choose

    - id: record-auto-verify-failed-output
      when: phase == "post_verify" && auto_verify_result[0].output.success == false
      actions:
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: auto_verify_failed
              rationale:
                literal: Automatically ran validation after a workspace edit; output.success=false, so diagnostics must be fixed before completion.
              requested:
                array:
                  - object:
                      tool:
                        literal: test.run
                      input:
                        object:
                          command:
                            ref: test_command
              result:
                ref: auto_verify_result
        - kind: set
          values:
            verification_status: failed
            phase: choose

    - id: record-auto-verify-passed
      when: phase == "post_verify" && auto_verify_result[0].output.success == true
      actions:
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: auto_verify_passed
              rationale:
                literal: Automatically ran the allowlisted validation after the workspace edit and it passed.
              requested:
                array:
                  - object:
                      tool:
                        literal: test.run
                      input:
                        object:
                          command:
                            ref: test_command
              result:
                ref: auto_verify_result
        - kind: tool_batch_dispatch
          input:
            array:
              - object:
                  tool:
                    literal: git.diff
                  input:
                    literal: {}
          output: final_diff_result
          max_calls: 1
          timeout_seconds: 120
          on_error: observe
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: final_diff_observed
              rationale:
                literal: Automatically captured the workspace diff after validation passed so the summary can cite the audited patch.
              requested:
                array:
                  - object:
                      tool:
                        literal: git.diff
                      input:
                        literal: {}
              result:
                ref: final_diff_result
        - kind: set
          values:
            verification_status: passed
            phase: summarize

    - id: record-manual-test-failed-output
      when: phase == "post_act" && observation[0].tool == "test.run" && observation[0].status == "ok" && observation[0].output.success == false
      actions:
        - kind: set
          values:
            verification_status: failed
            phase: choose

    - id: record-manual-test-passed
      when: phase == "post_act" && observation[0].tool == "test.run" && observation[0].status == "ok" && observation[0].output.success == true
      actions:
        - kind: set
          values:
            verification_status: passed
            phase: choose

    - id: record-manual-test-tool-failed
      when: phase == "post_act" && observation[0].tool == "test.run" && observation[0].status == "error"
      actions:
        - kind: set
          values:
            verification_status: failed
            phase: choose

    - id: record-file-read-path-error-hint
      when: phase == "post_act" && observation[0].tool == "file.read" && observation[0].status == "error" && target_path != ""
      actions:
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: path_error_hint
              rationale:
                literal: A file.read call failed. Reuse the exact target_path or rediscover the path with repo.files before retrying; do not repeat the same failing path.
              requested:
                ref: decision.tool_calls
              result:
                object:
                  target_path:
                    ref: target_path
                  failed_tool:
                    ref: observation[0].tool
                  failed_input:
                    ref: observation[0].input
        - kind: set
          values:
            phase: choose

    - id: record-file-ops-write-path-error-hint
      when: phase == "post_act" && observation[0].tool == "file.ops" && observation[0].status == "error"
      actions:
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: write_path_error_hint
              rationale:
                literal: A write tool call failed path policy. Retry with paths copied exactly from write_paths; include the full extension and do not repeat the same rejected path.
              requested:
                ref: decision.tool_calls
              result:
                object:
                  write_paths:
                    ref: write_paths
                  failed_tool:
                    ref: observation[0].tool
                  failed_input:
                    ref: observation[0].input
        - kind: set
          values:
            phase: choose

    - id: record-file-patch-write-path-error-hint
      when: phase == "post_act" && observation[0].tool == "file.patch" && observation[0].status == "error"
      actions:
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: write_path_error_hint
              rationale:
                literal: A patch tool call failed path policy. Retry with patch paths copied exactly from write_paths; include the full extension and do not repeat the same rejected path.
              requested:
                ref: decision.tool_calls
              result:
                object:
                  write_paths:
                    ref: write_paths
                  failed_tool:
                    ref: observation[0].tool
                  failed_input:
                    ref: observation[0].input
        - kind: set
          values:
            phase: choose

    - id: record-file-ops-validation-failed
      when: phase == "post_act" && observation[0].tool == "file.ops" && observation[0].status == "ok" && observation[0].output.applied == false
      actions:
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: edit_validation_failed
              rationale:
                literal: A file.ops edit failed validation before applying. Read the diagnostics, re-read the exact affected lines if needed, and do not repeat the same invalid operation.
              requested:
                ref: decision.tool_calls
              result:
                ref: observation
        - kind: set
          values:
            phase: choose

    - id: record-file-patch-validation-failed
      when: phase == "post_act" && observation[0].tool == "file.patch" && observation[0].status == "ok" && observation[0].output.applied == false
      actions:
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: edit_validation_failed
              rationale:
                literal: A file.patch edit failed validation before applying. Read the diagnostics, re-read the exact affected lines if needed, and do not repeat the same invalid patch.
              requested:
                ref: decision.tool_calls
              result:
                ref: observation
        - kind: set
          values:
            phase: choose

    - id: continue-after-act
      when: phase == "post_act"
      actions:
        - kind: set
          values:
            phase: choose

    - id: block-complete-without-passed-verification
      when: phase == "act" && decision.complete == true && verification_status != "passed"
      actions:
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: completion_blocked
              rationale:
                literal: Completion was blocked because verification_status is not passed. Run the allowlisted test or fix failing diagnostics before finishing.
              requested:
                array: []
              result:
                object:
                  verification_status:
                    ref: verification_status
        - kind: set
          values:
            phase: choose

    - id: summarize
      when: phase == "summarize" || phase == "act" && decision.complete == true && verification_status == "passed"
      actions:
        - kind: model_call
          model: code_edit_summarizer
          input:
            object:
              task:
                ref: task
              target_path:
                ref: target_path
              write_paths:
                ref: write_paths
              test_command:
                ref: test_command
              force_patch:
                ref: force_patch
              observations:
                ref: observations
              final_decision:
                ref: decision
          output: edit
          timeout_seconds: 90
          retry:
            max_attempts: 2
        - kind: set
          values:
            phase: done

    - id: done
      when: phase == "done"
      actions:
        - kind: return
          output: edit

policy:
  max_model_calls: 8
  max_tool_calls: 20
  max_repeated_tool_calls: 4
  require_approval: [file.write]
