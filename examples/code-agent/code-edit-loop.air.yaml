agent:
  name: code-edit-loop-agent
  version: 0.1.0
  description: "Bounded opencode-style code edit loop: model chooses declared tool calls, AIR executes them under policy, and every observation is traced."

inputs:
  task: string
  query: string
  target_path: string
  target_search_pattern: string
  target_symbol_query: string
  related_files:
    type: array
    items: string
  write_paths:
    type: array
    items: string
  acceptance_assertions:
    type: array
    items: object

outputs:
  edit:
    type: object
    required: [initial_success, final_success, patch_applied, changed_files, workspace_changed_files, preexisting_changed_files, workspace_diff, rationale]
    properties:
      initial_success: boolean
      final_success: boolean
      patch_applied: boolean
      changed_files:
        type: array
        items: string
      workspace_changed_files:
        type: array
        items: string
      preexisting_changed_files:
        type: array
        items:
          type: object
          required: [path]
          properties:
            path: string
      workspace_diff: object
      rationale: string

requires:
  capabilities: [task.progress, file.read, file.write, code.read, code.test]

state:
  phase:
    type: enum
    enum: [init, preflight, preflight_symbol_read, preflight_candidate, choose, act, post_act, post_format, post_verify, post_accept, summarize, done, failed]
  observations:
    type: array
    items: object
  edit_evidence:
    type: array
    items: object
  verification_status:
    type: enum
    enum: [unknown, passed, failed]
  decision:
    type: object
    required: [complete, tool_calls, rationale]
    properties:
      complete: boolean
      tool_calls:
        type: array
        items:
          type: object
          required: [tool, input]
          properties:
            tool: string
            input: object
      rationale: string
  observation:
    type: array
    items:
      type: object
  auto_verify_result:
    type: array
    items:
      type: object
  auto_format_result:
    type: array
    items:
      type: object
  auto_verify_diagnostic_context:
    type: array
    items:
      type: object
  auto_verify_full_log_context:
    type: array
    items:
      type: object
  manual_test_full_log_context:
    type: array
    items:
      type: object
  edit_validation_context:
    type: array
    items:
      type: object
  write_error_context:
    type: array
    items:
      type: object
  exploration_warning_sent: boolean
  final_diff_result:
    type: array
    items:
      type: object
  edit_summary:
    type: object
    additional_properties: false
    required: [initial_success, final_success, patch_applied, rationale]
    properties:
      initial_success: boolean
      final_success: boolean
      patch_applied: boolean
      rationale: string
  acceptance_assert_result:
    type: array
    items:
      type: object
  initial_target_context:
    type: array
    items:
      type: object
  initial_target_read_context:
    type: array
    items:
      type: object
  initial_candidate_validation:
    type: array
    items:
      type: object
  edit:
    type: object
    required: [initial_success, final_success, patch_applied, changed_files, workspace_changed_files, preexisting_changed_files, workspace_diff, rationale]
    properties:
      initial_success: boolean
      final_success: boolean
      patch_applied: boolean
      changed_files:
        type: array
        items: string
      workspace_changed_files:
        type: array
        items: string
      preexisting_changed_files:
        type: array
        items:
          type: object
          required: [path]
          properties:
            path: string
      workspace_diff: object
      rationale: string

tools:
  - name: todo.write
    capability: task.progress
    timeout_ms: 10000
  - name: todo.read
    capability: task.progress
    timeout_ms: 10000
  - name: glob
    capability: code.read
    timeout_ms: 10000
  - name: repo.symbols
    capability: code.read
    timeout_ms: 10000
  - name: lsp.references
    capability: code.read
    timeout_ms: 30000
  - name: lsp.diagnostics
    capability: code.read
    timeout_ms: 30000
  - name: read
    capability: file.read
    timeout_ms: 10000
  - name: read_many
    capability: file.read
    timeout_ms: 10000
  - name: grep
    capability: file.read
    timeout_ms: 10000
  - name: edit
    capability: file.write
    timeout_ms: 10000
  - name: diagnostic.context
    capability: code.read
    timeout_ms: 10000
  - name: code.assert
    capability: code.read
    timeout_ms: 10000
  - name: candidate.validate
    capability: code.read
    timeout_ms: 10000
  - name: git.status
    capability: code.read
    timeout_ms: 10000
  - name: git.diff
    capability: code.read
    timeout_ms: 10000
  - name: format.run
    capability: code.test
    timeout_ms: 120000
  - name: test.run
    capability: code.test
    timeout_ms: 120000

workflow:
  kind: state_machine
  initial: init
  max_steps: 160
  terminal: [done, failed]
  rules:
    - id: init
      when: phase == "init"
      actions:
        - kind: approval
          approval_for: [file.write]
        - kind: set
          values:
            observations: []
            edit_evidence: []
            exploration_warning_sent: false
            verification_status: unknown
            phase: preflight

    - id: preflight-target-symbols
      when: phase == "preflight" && target_path != "" && target_symbol_query != ""
      actions:
        - kind: tool_batch_dispatch
          input:
            array:
              - object:
                  tool:
                    literal: repo.symbols
                  input:
                    object:
                      path:
                        ref: target_path
                      query:
                        ref: target_symbol_query
                      max_symbols:
                        literal: 16
          output: initial_target_context
          max_calls: 1
          timeout_seconds: 120
          on_error: observe
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: initial_target_symbols
              rationale:
                literal: Deterministically locate target symbols before the first model decision so targeted edits start from concrete symbol ranges instead of broad text search.
              requested:
                array:
                  - object:
                      tool:
                        literal: repo.symbols
                      input:
                        object:
                          path:
                            ref: target_path
                          query:
                            ref: target_symbol_query
              result:
                object:
                  evidence:
                    literal: initial_target_context
                  target_path:
                    ref: target_path
                  target_symbol_query:
                    ref: target_symbol_query
        - kind: append
          target: edit_evidence
          value:
            object:
              action:
                literal: initial_target_symbols_evidence
              rationale:
                literal: Preserved preflight symbol ranges before the exact target range read.
              requested:
                array:
                  - object:
                      tool:
                        literal: repo.symbols
                      input:
                        object:
                          path:
                            ref: target_path
                          query:
                            ref: target_symbol_query
              result:
                ref: initial_target_context
        - kind: set
          values:
            phase: preflight_symbol_read

    - id: preflight-target-symbol-read
      when: phase == "preflight_symbol_read" && initial_target_context[0].output.symbols != []
      actions:
        - kind: tool_batch_dispatch
          input:
            array:
              - object:
                  tool:
                    literal: read
                  input:
                    object:
                      path:
                        ref: initial_target_context[0].output.symbols[0].path
                      start_line:
                        ref: initial_target_context[0].output.symbols[0].line
                      end_line:
                        ref: initial_target_context[0].output.symbols[0].end_line
                      line_numbers:
                        literal: true
                      max_bytes:
                        literal: 32768
          output: initial_target_read_context
          max_calls: 1
          timeout_seconds: 120
          on_error: observe
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: initial_target_symbol_range_read
              rationale:
                literal: Deterministically read the exact target symbol range after repo.symbols so the first model decision sees focused code instead of a whole file.
              requested:
                array:
                  - object:
                      tool:
                        literal: read
                      input:
                        object:
                          path:
                            ref: initial_target_context[0].output.symbols[0].path
                          start_line:
                            ref: initial_target_context[0].output.symbols[0].line
                          end_line:
                            ref: initial_target_context[0].output.symbols[0].end_line
              result:
                object:
                  symbols:
                    ref: initial_target_context
                  symbol_context:
                    ref: initial_target_read_context
        - kind: append
          target: edit_evidence
          value:
            object:
              action:
                literal: initial_target_symbol_range_evidence
              rationale:
                literal: Preserved the exact target symbol range as stable edit evidence before the first model decision.
              requested:
                array:
                  - object:
                      tool:
                        literal: repo.symbols
                      input:
                        object:
                          path:
                            ref: target_path
                          query:
                            ref: target_symbol_query
                  - object:
                      tool:
                        literal: read
                      input:
                        object:
                          path:
                            ref: initial_target_context[0].output.symbols[0].path
                          start_line:
                            ref: initial_target_context[0].output.symbols[0].line
                          end_line:
                            ref: initial_target_context[0].output.symbols[0].end_line
              result:
                array:
                  - object:
                      tool:
                        literal: repo.symbols
                      status:
                        literal: ok
                      output:
                        ref: initial_target_context[0].output
                  - object:
                      tool:
                        literal: read
                      status:
                        literal: ok
                      output:
                        ref: initial_target_read_context[0].output
        - kind: set
          values:
            phase: preflight_candidate

    - id: preflight-target-symbol-read-skip
      when: phase == "preflight_symbol_read"
      actions:
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: initial_target_symbol_range_missing
              rationale:
                literal: repo.symbols did not return a concrete symbol range, so AIR proceeds with the symbol search observation and lets the model choose the next narrow read/search step.
              result:
                ref: initial_target_context
        - kind: set
          values:
            phase: preflight_candidate

    - id: preflight-target-search
      when: phase == "preflight" && target_path != "" && target_symbol_query == "" && target_search_pattern != ""
      actions:
        - kind: tool_batch_dispatch
          input:
            array:
              - object:
                  tool:
                    literal: grep
                  input:
                    object:
                      path:
                        ref: target_path
                      pattern:
                        ref: target_search_pattern
                      context_lines:
                        literal: 2
                      max_matches:
                        literal: 8
              - object:
                  tool:
                    literal: read
                  input:
                    object:
                      path:
                        ref: target_path
                      line_numbers:
                        literal: true
                      max_bytes:
                        literal: 32768
          output: initial_target_context
          max_calls: 2
          timeout_seconds: 120
          on_error: observe
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: initial_target_search
              rationale:
                literal: Deterministically search target_path before the first model decision with bounded context so large files start from narrow, task-relevant evidence.
              requested:
                array:
                  - object:
                      tool:
                        literal: grep
                      input:
                        object:
                          path:
                            ref: target_path
                          pattern:
                            ref: target_search_pattern
                  - object:
                      tool:
                        literal: read
                      input:
                        object:
                          path:
                            ref: target_path
              result:
                object:
                  evidence:
                    literal: initial_target_context
                  target_path:
                    ref: target_path
                  target_search_pattern:
                    ref: target_search_pattern
        - kind: append
          target: edit_evidence
          value:
            object:
              action:
                literal: initial_target_search_evidence
              rationale:
                literal: Preserved preflight grep matches and the bounded target file read as stable edit evidence before the first model decision.
              requested:
                array:
                  - object:
                      tool:
                        literal: grep
                      input:
                        object:
                          path:
                            ref: target_path
                          pattern:
                            ref: target_search_pattern
                  - object:
                      tool:
                        literal: read
                      input:
                        object:
                          path:
                            ref: target_path
              result:
                ref: initial_target_context
        - kind: set
          values:
            phase: preflight_candidate

    - id: preflight-target-read
      when: phase == "preflight" && target_path != "" && target_symbol_query == "" && target_search_pattern == ""
      actions:
        - kind: tool_batch_dispatch
          input:
            array:
              - object:
                  tool:
                    literal: read
                  input:
                    object:
                      path:
                        ref: target_path
                      line_numbers:
                        literal: true
                      max_bytes:
                        literal: 32768
          output: initial_target_context
          max_calls: 1
          timeout_seconds: 120
          on_error: observe
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: initial_target_read
              rationale:
                literal: Deterministically read target_path before the first model decision so the edit loop starts from exact repository context.
              requested:
                array:
                  - object:
                      tool:
                        literal: read
                      input:
                        object:
                          path:
                            ref: target_path
              result:
                object:
                  evidence:
                    literal: initial_target_context
                  target_path:
                    ref: target_path
        - kind: append
          target: edit_evidence
          value:
            object:
              action:
                literal: initial_target_read_evidence
              rationale:
                literal: Preserved the bounded target file read as stable edit evidence before the first model decision.
              requested:
                array:
                  - object:
                      tool:
                        literal: read
                      input:
                        object:
                          path:
                            ref: target_path
              result:
                ref: initial_target_context
        - kind: set
          values:
            phase: preflight_candidate

    - id: preflight-candidate-validate
      when: phase == "preflight_candidate" && target_path != ""
      actions:
        - kind: tool_batch_dispatch
          input:
            array:
              - object:
                  tool:
                    literal: candidate.validate
                  input:
                    object:
                      candidate:
                        object:
                          target_path:
                            ref: target_path
                          related_files:
                            ref: related_files
          output: initial_candidate_validation
          max_calls: 1
          timeout_seconds: 120
          on_error: observe
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: initial_candidate_validation
              rationale:
                literal: Deterministically validate the target path before the first model edit decision.
              requested:
                array:
                  - object:
                      tool:
                        literal: candidate.validate
                      input:
                        object:
                          candidate:
                            object:
                              target_path:
                                ref: target_path
                              related_files:
                                ref: related_files
              result:
                ref: initial_candidate_validation
        - kind: set
          values:
            phase: choose

    - id: preflight-candidate-skip
      when: phase == "preflight_candidate"
      actions:
        - kind: set
          values:
            phase: choose

    - id: preflight-targetless
      when: phase == "preflight" && target_path == ""
      actions:
        - kind: set
          values:
            phase: choose

    - id: summarize-at-step-limit
      when: phase == "choose" && _air.is_last_action_step == true
      actions:
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: step_budget_reached
              rationale:
                literal: The AIR state-machine step budget is nearly exhausted. Stop tool use and produce an audited summary with completed work, remaining work, and verification state.
              requested:
                array: []
              result:
                object:
                  runtime:
                    ref: _air
                  verification_status:
                    ref: verification_status
        - kind: model_call
          model: code_edit_summarizer
          input:
            object:
              task:
                ref: task
              target_path:
                ref: target_path
              write_paths:
                ref: write_paths
              observations:
                take_last_within_bytes:
                  ref: observations
                max_items: 3
                max_bytes: 40000
              final_decision:
                literal:
                  complete: false
                  rationale: Step budget reached before verified completion.
              runtime:
                ref: _air
          output: edit_summary
          timeout_seconds: 180
          retry:
            max_attempts: 2
        - kind: set
          values:
            edit:
              object:
                initial_success:
                  ref: edit_summary.initial_success
                final_success:
                  ref: edit_summary.final_success
                patch_applied:
                  ref: edit_summary.patch_applied
                changed_files:
                  array: []
                workspace_changed_files:
                  array: []
                preexisting_changed_files:
                  array: []
                workspace_diff:
                  object:
                    diff:
                      literal: ""
                    bytes:
                      literal: 0
                    truncated:
                      literal: false
                    artifacts:
                      array: []
                    changed_files:
                      array: []
                    workspace_changed_files:
                      array: []
                    preexisting_changed_files:
                      array: []
                rationale:
                  ref: edit_summary.rationale
            phase: done

    - id: record-opencode-doom-loop-warning
      when: phase == "choose" && exploration_warning_sent == false && _air.model_calls >= 6 && verification_status != "passed"
      actions:
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: opencode_doom_loop_warning
              rationale:
                literal: "OpenCode-style loop feedback: the agent has spent several model turns on exploration without verified completion. This is not a write-only gate; continue reading only for a new, immediately necessary fact, otherwise use todo.write for a concrete checklist or apply the next smallest edit and let diagnostics guide the following turn."
              requested:
                array: []
              result:
                object:
                  runtime:
                    ref: _air
                  allowed_next_tools:
                    array:
                      - literal: todo.write
                      - literal: read
                      - literal: grep
                      - literal: repo.symbols
                      - literal: lsp.references
                      - literal: edit
                      - literal: test.run
        - kind: set
          values:
            exploration_warning_sent: true
            phase: choose

    - id: choose
      when: phase == "choose"
      actions:
        - kind: model_call
          model: code_edit_decider
          input:
            object:
              task:
                ref: task
              query:
                ref: query
              target_path:
                ref: target_path
              target_search_pattern:
                ref: target_search_pattern
              target_symbol_query:
                ref: target_symbol_query
              related_files:
                ref: related_files
              write_paths:
                ref: write_paths
              observations:
                take_last_within_bytes:
                  ref: observations
                max_items: 4
                max_bytes: 24000
              edit_evidence:
                take_last_within_bytes:
                  ref: edit_evidence
                max_items: 6
                max_bytes: 30000
              verification_status:
                ref: verification_status
              runtime:
                ref: _air
              allowed_tools:
                array:
                  - literal: todo.write
                  - literal: todo.read
                  - literal: glob
                  - literal: repo.symbols
                  - literal: lsp.references
                  - literal: lsp.diagnostics
                  - literal: read
                  - literal: read_many
                  - literal: grep
                  - literal: edit
                  - literal: diagnostic.context
                  - literal: code.assert
                  - literal: candidate.validate
                  - literal: git.status
                  - literal: git.diff
                  - literal: test.run
              tool_schemas:
                literal:
                  todo.write:
                    required: {todos: "array of todo objects shaped {id, content, status, priority}"}
                    optional: {merge: "boolean"}
                  todo.read:
                    required: {}
                    optional: {}
                  glob:
                    required:
                      pattern: "glob/path pattern such as examples/code-agent/**/*.js"
                    optional:
                      query: "substring filter"
                      max_files: "bounded result limit"
                      include_all: "boolean"
                  repo.symbols:
                    required: {}
                    optional:
                      query: "symbol/name filter"
                      names: "array of exact symbol names; use this to fetch several function ranges in one call"
                      path: "repo-relative scope"
                      max_symbols: "bounded result limit"
                  lsp.references:
                    required:
                      path: "repo-relative source file containing the symbol or position"
                    optional:
                      symbol: "exact identifier when semantic references are needed"
                      line: "1-based line when symbol is not enough"
                      character: "0-based UTF-8 character offset"
                      include_declaration: "boolean; default true"
                      max_results: "bounded result limit"
                  lsp.diagnostics:
                    required: {}
                    optional:
                      path: "optional repo-relative source file filter"
                      max_diagnostics: "bounded diagnostic limit"
                  read:
                    required: {filePath: "repo-relative file path"}
                    optional:
                      path: "alias for filePath"
                      offset: "zero-based line offset"
                      limit: "maximum lines to read"
                      start_line: "1-based start line"
                      end_line: "1-based end line"
                      lines: "single line or start-end range"
                      line_numbers: "boolean"
                      max_bytes: "bounded byte limit"
                  read_many:
                    required: {files: "array of paths or objects with path"}
                    optional:
                      max_bytes_per_file: "bounded byte limit"
                      line_numbers: "boolean"
                  grep:
                    required:
                      pattern: "regular expression; query is accepted as an alias"
                    optional:
                      path: "repo-relative file or directory; defaults to repo root"
                      include: "optional file include hint"
                      context_lines: "bounded context lines"
                      contextLines: "alias for context_lines"
                      max_matches: "bounded result limit"
                      maxMatches: "alias for max_matches"
                  edit:
                    required:
                      filePath: "repo-relative file path"
                      oldString: "exact text to replace; include enough context to be unique"
                      newString: "replacement text"
                    optional:
                      replaceAll: "replace every occurrence only when all matches should change"
                  diagnostic.context:
                    required: {}
                    optional:
                      diagnostics: "array of diagnostic objects"
                      path: "repo-relative scope"
                  code.assert:
                    required:
                      assertions: "array of postconditions; kinds: symbol_present, symbol_absent, file_contains, file_not_contains, command_passes"
                    optional:
                      checks: "alias for assertions"
                  candidate.validate:
                    required:
                      candidate: "{target_path, related_files?}; checks paths before committing to an edit route"
                    optional: {}
                  git.status:
                    required: {}
                    optional: {}
                  git.diff:
                    required: {}
                    optional:
                      paths: "array of repo-relative paths"
                      include_untracked: "boolean"
                  test.run:
                    required: {}
                    optional: {}
              tool_policy:
                literal:
                  plan: "Use todo.write/read when the task clearly spans multiple files or repeated verification cycles, even if target_path is set. Skip todo tools only for trivial single-file edits."
                  discover: "Use glob for path discovery, grep for text search, repo.symbols for cheap definitions and symbol start/end lines, and lsp.references for semantic references when available."
                  paths: "Copy repository paths exactly byte-for-byte from target_path, write_paths, or artifact metadata. Include full extensions such as .json; never abbreviate, truncate, or rewrite path suffixes."
                  read_first: "Call read, grep, or diagnostic.context before edits."
                  small_steps: "Choose the tool calls needed for the next concrete step, and batch independent legal calls when they share the same evidence context. Do not request whole large files. Use repo.symbols once to get start/end lines when names are known, then read exact ranges instead of rediscovering boundaries repeatedly. If target_symbol_query is set or preflight already returned target ranges, the next turn must either write or read at most one additional immediately-needed range; do not expand into helper archaeology."
                  edits: "Use repo.symbols/lsp.references to locate exact ranges when helpful, then call edit with filePath, oldString, and newString. Include enough oldString context to make the replacement unique. Multiple independent edit calls are allowed in the same turn when each one has already been grounded by prior read/search/symbol evidence and each call stays inside write_paths. Do not repeat reads of the same ranges instead of making an allowed edit."
                  tests: "Use test.run for the configured project validation. A test.run tool event can have status=ok while output.success=false; treat output.success=false as a failed verification and fix diagnostics before any completion. If output.truncated=true, use output.full_log_path with grep or a narrow read range instead of trying to inspect the whole log."
                  verify: "Before complete=true, normally choose code.assert for useful structural postconditions, plus test.run and git.diff so the final summary can prove the outcome."
                  finish: "Return complete=true with tool_calls=[] only after the edit/no-op decision is verified."
          output: decision
          timeout_seconds: 180
          retry:
            max_attempts: 4
        - kind: set
          values:
            phase: act

    - id: act
      when: phase == "act" && decision.complete == false
      actions:
        - kind: tool_batch_dispatch
          input:
            path: decision.tool_calls
          write_scope:
            ref: write_paths
          output: observation
          max_calls: 200
          timeout_seconds: 120
          on_error: observe
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: tool_batch_dispatch
              rationale:
                path: decision.rationale
              requested:
                path: decision.tool_calls
              result:
                ref: observation
        - kind: set
          values:
            phase: post_act

    - id: auto-verify-edit
      when: phase == "post_act" && observation[0].tool == "edit" && observation[0].status == "ok" && observation[0].output.applied == true
      actions:
        - kind: tool_batch_dispatch
          input:
            array:
              - object:
                  tool:
                    literal: format.run
                  input:
                    literal: {}
          output: auto_format_result
          max_calls: 1
          timeout_seconds: 120
          on_error: observe
        - kind: set
          values:
            phase: post_format

    - id: auto-verify-after-format
      when: phase == "post_format" && auto_format_result[0].status == "ok" && auto_format_result[0].output.success == true
      actions:
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: auto_format_passed
              rationale:
                literal: Automatically ran formatter after a workspace edit before validation.
              requested:
                array:
                  - object:
                      tool:
                        literal: format.run
                      input:
                        literal: {}
              result:
                ref: auto_format_result
        - kind: tool_batch_dispatch
          input:
            array:
              - object:
                  tool:
                    literal: test.run
                  input:
                    literal: {}
          output: auto_verify_result
          max_calls: 1
          timeout_seconds: 120
          on_error: observe
        - kind: set
          values:
            phase: post_verify

    - id: record-auto-format-failed
      when: phase == "post_format"
      actions:
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: auto_format_failed
              rationale:
                literal: Automatically ran formatter after a workspace edit; formatting failed and must be fixed before validation can run.
              requested:
                array:
                  - object:
                      tool:
                        literal: format.run
                      input:
                        literal: {}
              result:
                ref: auto_format_result
        - kind: set
          values:
            verification_status: failed
            phase: choose

    - id: record-auto-verify-failed-tool
      when: phase == "post_verify" && auto_verify_result[0].status == "error"
      actions:
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: auto_verify_failed
              rationale:
                literal: Automatically ran validation after a workspace edit; the validation tool returned an error and must be fixed before completion.
              requested:
                array:
                  - object:
                      tool:
                        literal: test.run
                      input:
                        literal: {}
              result:
                ref: auto_verify_result
        - kind: set
          values:
            verification_status: failed
            phase: choose

    - id: record-auto-verify-failed-output-truncated
      when: phase == "post_verify" && auto_verify_result[0].output.success == false && auto_verify_result[0].output.truncated == true
      actions:
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: auto_verify_failed
              rationale:
                literal: Automatically ran validation after a workspace edit; output.success=false, so diagnostics must be fixed before completion.
              requested:
                array:
                  - object:
                      tool:
                        literal: test.run
                      input:
                        literal: {}
              result:
                ref: auto_verify_result
        - kind: tool_batch_dispatch
          input:
            array:
              - object:
                  tool:
                    literal: diagnostic.context
                  input:
                    object:
                      diagnostics:
                        ref: auto_verify_result[0].output.diagnostics
                      context_lines:
                        literal: 6
              - object:
                  tool:
                    literal: grep
                  input:
                    object:
                      path:
                        ref: auto_verify_result[0].output.full_log_path
                      pattern:
                        literal: "(?i)(error|fail|failed|failure|panic|exception|assert|expected|actual)"
                      context_lines:
                        literal: 3
                      max_matches:
                        literal: 20
          output: auto_verify_full_log_context
          max_calls: 2
          timeout_seconds: 120
          on_error: observe
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: auto_verify_full_log_context
              rationale:
                literal: The validation log was truncated, so AIR searched the persisted full_log_path before the next correction decision. Use this log context together with diagnostics instead of re-running only to recover hidden output.
              requested:
                array:
                  - object:
                      tool:
                        literal: diagnostic.context
                      input:
                        object:
                          diagnostics:
                            ref: auto_verify_result[0].output.diagnostics
                          context_lines:
                            literal: 6
                  - object:
                      tool:
                        literal: grep
                      input:
                        object:
                          path:
                            ref: auto_verify_result[0].output.full_log_path
                          pattern:
                            literal: "(?i)(error|fail|failed|failure|panic|exception|assert|expected|actual)"
                          context_lines:
                            literal: 3
                          max_matches:
                            literal: 20
              result:
                ref: auto_verify_full_log_context
        - kind: set
          values:
            verification_status: failed
            phase: choose

    - id: record-auto-verify-failed-output
      when: phase == "post_verify" && auto_verify_result[0].output.success == false && auto_verify_result[0].output.truncated != true
      actions:
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: auto_verify_failed
              rationale:
                literal: Automatically ran validation after a workspace edit; output.success=false, so diagnostics must be fixed before completion.
              requested:
                array:
                  - object:
                      tool:
                        literal: test.run
                      input:
                        literal: {}
              result:
                ref: auto_verify_result
        - kind: tool_batch_dispatch
          input:
            array:
              - object:
                  tool:
                    literal: diagnostic.context
                  input:
                    object:
                      diagnostics:
                        ref: auto_verify_result[0].output.diagnostics
                      context_lines:
                        literal: 6
          output: auto_verify_diagnostic_context
          max_calls: 1
          timeout_seconds: 120
          on_error: observe
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: auto_verify_diagnostic_context
              rationale:
                literal: Automatically collected source context around validation diagnostics before the next correction decision so fixes can target the failing scope instead of broad searching.
              requested:
                array:
                  - object:
                      tool:
                        literal: diagnostic.context
                      input:
                        object:
                          diagnostics:
                            ref: auto_verify_result[0].output.diagnostics
                          context_lines:
                            literal: 6
              result:
                ref: auto_verify_diagnostic_context
        - kind: set
          values:
            verification_status: failed
            phase: choose

    - id: record-auto-verify-passed-with-assertions
      when: phase == "post_verify" && auto_verify_result[0].output.success == true && acceptance_assertions != []
      actions:
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: auto_verify_passed
              rationale:
                literal: Automatically ran the configured validation after the workspace edit and it passed.
              requested:
                array:
                  - object:
                      tool:
                        literal: test.run
                      input:
                        literal: {}
              result:
                ref: auto_verify_result
        - kind: tool_batch_dispatch
          input:
            array:
              - object:
                  tool:
                    literal: code.assert
                  input:
                    object:
                      assertions:
                        ref: acceptance_assertions
          output: acceptance_assert_result
          max_calls: 1
          timeout_seconds: 120
          on_error: observe
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: acceptance_assertions_observed
              rationale:
                literal: Automatically checked structural postconditions after validation passed so a structural edit cannot complete solely because tests passed.
              requested:
                array:
                  - object:
                      tool:
                        literal: code.assert
                      input:
                        object:
                          assertions:
                            ref: acceptance_assertions
              result:
                ref: acceptance_assert_result
        - kind: set
          values:
            phase: post_accept

    - id: record-acceptance-assertions-failed
      when: phase == "post_accept" && acceptance_assert_result[0].output.passed == false
      actions:
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: acceptance_assertions_failed
              rationale:
                literal: Structural postconditions failed even though tests passed; fix the edit before completion.
              requested:
                array:
                  - object:
                      tool:
                        literal: code.assert
                      input:
                        object:
                          assertions:
                            ref: acceptance_assertions
              result:
                ref: acceptance_assert_result
        - kind: set
          values:
            verification_status: failed
            phase: choose

    - id: record-acceptance-assertions-passed
      when: phase == "post_accept" && acceptance_assert_result[0].output.passed == true
      actions:
        - kind: tool_batch_dispatch
          input:
            array:
              - object:
                  tool:
                    literal: git.diff
                  input:
                    object:
                      paths:
                        ref: write_paths
          output: final_diff_result
          max_calls: 1
          timeout_seconds: 120
          on_error: observe
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: final_diff_observed
              rationale:
                literal: Automatically captured the workspace diff after validation passed so the summary can cite the audited patch.
              requested:
                array:
                  - object:
                      tool:
                        literal: git.diff
                      input:
                        object:
                          paths:
                            ref: write_paths
              result:
                ref: final_diff_result
        - kind: set
          values:
            verification_status: passed
            phase: summarize

    - id: record-auto-verify-passed
      when: phase == "post_verify" && auto_verify_result[0].output.success == true && acceptance_assertions == []
      actions:
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: auto_verify_passed
              rationale:
                literal: Automatically ran the configured validation after the workspace edit and it passed.
              requested:
                array:
                  - object:
                      tool:
                        literal: test.run
                      input:
                        literal: {}
              result:
                ref: auto_verify_result
        - kind: tool_batch_dispatch
          input:
            array:
              - object:
                  tool:
                    literal: git.diff
                  input:
                    object:
                      paths:
                        ref: write_paths
          output: final_diff_result
          max_calls: 1
          timeout_seconds: 120
          on_error: observe
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: final_diff_observed
              rationale:
                literal: Automatically captured the workspace diff after validation passed so the summary can cite the audited patch.
              requested:
                array:
                  - object:
                      tool:
                        literal: git.diff
                      input:
                        object:
                          paths:
                            ref: write_paths
              result:
                ref: final_diff_result
        - kind: set
          values:
            verification_status: passed
            phase: summarize

    - id: record-manual-test-failed-output-truncated
      when: phase == "post_act" && observation[0].tool == "test.run" && observation[0].status == "ok" && observation[0].output.success == false && observation[0].output.truncated == true
      actions:
        - kind: tool_batch_dispatch
          input:
            array:
              - object:
                  tool:
                    literal: diagnostic.context
                  input:
                    object:
                      diagnostics:
                        ref: observation[0].output.diagnostics
                      context_lines:
                        literal: 6
              - object:
                  tool:
                    literal: grep
                  input:
                    object:
                      path:
                        ref: observation[0].output.full_log_path
                      pattern:
                        literal: "(?i)(error|fail|failed|failure|panic|exception|assert|expected|actual)"
                      context_lines:
                        literal: 3
                      max_matches:
                        literal: 20
          output: manual_test_full_log_context
          max_calls: 2
          timeout_seconds: 120
          on_error: observe
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: manual_test_full_log_context
              rationale:
                literal: A manual validation run failed with truncated output, so AIR searched the persisted full_log_path and collected diagnostic context before the next correction decision.
              requested:
                array:
                  - object:
                      tool:
                        literal: diagnostic.context
                      input:
                        object:
                          diagnostics:
                            ref: observation[0].output.diagnostics
                          context_lines:
                            literal: 6
                  - object:
                      tool:
                        literal: grep
                      input:
                        object:
                          path:
                            ref: observation[0].output.full_log_path
                          pattern:
                            literal: "(?i)(error|fail|failed|failure|panic|exception|assert|expected|actual)"
                          context_lines:
                            literal: 3
                          max_matches:
                            literal: 20
              result:
                ref: manual_test_full_log_context
        - kind: set
          values:
            verification_status: failed
            phase: choose

    - id: record-manual-test-failed-output
      when: phase == "post_act" && observation[0].tool == "test.run" && observation[0].status == "ok" && observation[0].output.success == false && observation[0].output.truncated != true
      actions:
        - kind: set
          values:
            verification_status: failed
            phase: choose

    - id: record-manual-test-passed
      when: phase == "post_act" && observation[0].tool == "test.run" && observation[0].status == "ok" && observation[0].output.success == true
      actions:
        - kind: set
          values:
            verification_status: passed
            phase: choose

    - id: record-manual-test-tool-failed
      when: phase == "post_act" && observation[0].tool == "test.run" && observation[0].status == "error"
      actions:
        - kind: set
          values:
            verification_status: failed
            phase: choose

    - id: record-doom-loop-policy-error
      when: phase == "post_act" && observation[0].error_code == "doom_loop"
      actions:
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: opencode_doom_loop_permission
              rationale:
                literal: "OpenCode-style doom_loop feedback: AIR blocked a repeated identical tool call. Reuse existing observations or choose a different next action; do not retry the same tool input."
              requested:
                ref: decision.tool_calls
              result:
                object:
                  failed_tool:
                    ref: observation[0].tool
                  failed_input:
                    ref: observation[0].input
                  error_code:
                    path: observation[0].error_code
                  permission:
                    path: observation[0].permission
                  message:
                    path: observation[0].message
        - kind: set
          values:
            phase: choose

    - id: record-file-read-path-error-hint
      when: phase == "post_act" && observation[0].tool == "read" && observation[0].status == "error" && target_path != ""
      actions:
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: path_error_hint
              rationale:
                literal: A read call failed. Reuse the exact target_path or rediscover the path with glob before retrying; do not repeat the same failing path.
              requested:
                ref: decision.tool_calls
              result:
                object:
                  target_path:
                    ref: target_path
                  failed_tool:
                    ref: observation[0].tool
                  failed_input:
                    ref: observation[0].input
        - kind: set
          values:
            phase: choose

    - id: record-file-read-evidence
      when: phase == "post_act" && observation[0].tool == "read" && observation[0].status == "ok"
      actions:
        - kind: append
          target: edit_evidence
          value:
            object:
              action:
                literal: file_read_evidence
              rationale:
                literal: Preserved a successful read result as stable edit evidence so later edit decisions keep the exact line-numbered source context even when general observations are compacted.
              requested:
                ref: decision.tool_calls
              result:
                ref: observation
        - kind: set
          values:
            phase: choose

    - id: record-file-read-many-evidence
      when: phase == "post_act" && observation[0].tool == "read_many" && observation[0].status == "ok"
      actions:
        - kind: append
          target: edit_evidence
          value:
            object:
              action:
                literal: file_read_many_evidence
              rationale:
                literal: Preserved a successful read_many result as stable edit evidence so later edit decisions keep source context even when general observations are compacted.
              requested:
                ref: decision.tool_calls
              result:
                ref: observation
        - kind: set
          values:
            phase: choose

    - id: record-code-context-evidence
      when: phase == "post_act" && observation[0].status == "ok" && observation[0].tool == "repo.symbols" || phase == "post_act" && observation[0].status == "ok" && observation[0].tool == "grep" || phase == "post_act" && observation[0].status == "ok" && observation[0].tool == "glob" || phase == "post_act" && observation[0].status == "ok" && observation[0].tool == "lsp.references"
      actions:
        - kind: append
          target: edit_evidence
          value:
            object:
              action:
                literal: code_context_evidence
              rationale:
                literal: Preserved successful symbol/search/context evidence so later edit decisions keep the useful code locations instead of rediscovering them after observations compact.
              requested:
                ref: decision.tool_calls
              result:
                ref: observation
        - kind: set
          values:
            phase: choose

    - id: record-edit-write-path-error-hint
      when: phase == "post_act" && observation[0].tool == "edit" && observation[0].status == "error"
      actions:
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: write_path_error_hint
              rationale:
                literal: A write tool call failed AIR write policy. If the error is about path policy, retry with paths copied exactly from write_paths. If it is about max_changed_lines or size, split the change into smaller edit calls.
              requested:
                ref: decision.tool_calls
              result:
                object:
                  write_paths:
                    ref: write_paths
                  failed_tool:
                    ref: observation[0].tool
                  failed_input:
                    ref: observation[0].input
                  failed_error:
                    ref: observation[0].error
        - kind: tool_batch_dispatch
          input:
            array:
              - object:
                  tool:
                    literal: read
                  input:
                    object:
                      path:
                        ref: observation[0].input.filePath
                      max_bytes:
                        literal: 60000
                      line_numbers:
                        literal: true
          output: write_error_context
          max_calls: 1
          allowed_tools:
            - read
          timeout_seconds: 120
          on_error: observe
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: write_error_context
              rationale:
                literal: AIR re-read the failed write path after a write-policy error so the next edit decision has a fresh snapshot instead of looping on stale-read rejection.
              requested:
                array:
                  - object:
                      tool:
                        literal: read
                      input:
                        object:
                          path:
                            ref: observation[0].input.filePath
              result:
                ref: write_error_context
        - kind: set
          values:
            phase: choose

    - id: record-edit-validation-failed
      when: phase == "post_act" && observation[0].tool == "edit" && observation[0].status == "ok" && observation[0].output.applied == false
      actions:
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: edit_validation_failed
              rationale:
                literal: An edit failed validation before applying. Read the diagnostics, re-read the exact affected lines if needed, and do not repeat the same invalid oldString.
              requested:
                ref: decision.tool_calls
              result:
                ref: observation
        - kind: tool_batch_dispatch
          input:
            array:
              - object:
                  tool:
                    literal: diagnostic.context
                  input:
                    object:
                      diagnostics:
                        ref: observation[0].output.diagnostics
                      context_lines:
                        literal: 6
          output: edit_validation_context
          max_calls: 1
          timeout_seconds: 120
          on_error: observe
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: edit_validation_context
              rationale:
                literal: An edit failed validation, so AIR automatically collected source context around the diagnostic path before the next edit decision.
              requested:
                array:
                  - object:
                      tool:
                        literal: diagnostic.context
                      input:
                        object:
                          diagnostics:
                            ref: observation[0].output.diagnostics
                          context_lines:
                            literal: 6
              result:
                ref: edit_validation_context
        - kind: set
          values:
            phase: choose

    - id: record-batch-dispatch-error
      when: phase == "post_act" && observation[0].tool == "<batch>" && observation[0].status == "error"
      actions:
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: batch_dispatch_error
              rationale:
                literal: A tool batch was rejected before individual tools ran. Fix the invalid tool name, input shape, repeated-call issue, write scope, or max_calls issue before retrying.
              requested:
                ref: decision.tool_calls
              result:
                object:
                  failed_error:
                    ref: observation[0].error
                  failed_input:
                    ref: observation[0].input
        - kind: set
          values:
            phase: choose

    - id: continue-after-act
      when: phase == "post_act"
      actions:
        - kind: set
          values:
            phase: choose

    - id: block-complete-without-passed-verification
      when: phase == "act" && decision.complete == true && verification_status != "passed"
      actions:
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: completion_blocked
              rationale:
                literal: Completion was blocked because verification_status is not passed. Run the configured validation or fix failing diagnostics before finishing.
              requested:
                array: []
              result:
                object:
                  verification_status:
                    ref: verification_status
        - kind: set
          values:
            phase: choose

    - id: summarize
      when: phase == "summarize" || phase == "act" && decision.complete == true && verification_status == "passed"
      actions:
        - kind: model_call
          model: code_edit_summarizer
          input:
            object:
              task:
                ref: task
              target_path:
                ref: target_path
              target_symbol_query:
                ref: target_symbol_query
              write_paths:
                ref: write_paths
              observations:
                take_last_within_bytes:
                  ref: observations
                max_items: 8
                max_bytes: 30000
              final_diff_result:
                ref: final_diff_result
              final_decision:
                ref: decision
          output: edit_summary
          timeout_seconds: 180
          retry:
            max_attempts: 2
        - kind: set
          values:
            edit:
              object:
                initial_success:
                  ref: edit_summary.initial_success
                final_success:
                  ref: edit_summary.final_success
                patch_applied:
                  ref: edit_summary.patch_applied
                changed_files:
                  ref: final_diff_result[0].output.changed_files
                workspace_changed_files:
                  ref: final_diff_result[0].output.workspace_changed_files
                preexisting_changed_files:
                  ref: final_diff_result[0].output.preexisting_changed_files
                workspace_diff:
                  ref: final_diff_result[0].output
                rationale:
                  ref: edit_summary.rationale
            phase: done

    - id: done
      when: phase == "done"
      actions:
        - kind: return
          output: edit

policy:
  max_model_calls: 40
  max_tool_calls: 200
  max_repeated_tool_calls: 3
  require_approval: [file.write]
