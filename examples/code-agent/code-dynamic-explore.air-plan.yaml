plan:
  name: code-dynamic-explore
  version: 0.1.0

requires:
  capabilities: [file.read, code.read]

nodes:
  - id: explore
    module: code.dynamic_explore@0.1.0

entry: explore

connect:
  - from: $input.task
    to: explore.task
  - from: $input.query
    to: explore.query
  - from: $input.target_path
    to: explore.target_path

outputs:
  exploration: explore.exploration

decisions:
  - id: use-bounded-plan-act-observe-code-explore
    rationale: "Use a bounded AIR state machine where the model can choose among declared read-only tools while AIR enforces tool capabilities, budgets, and trace."
    selected: [code.dynamic_explore@0.1.0]
