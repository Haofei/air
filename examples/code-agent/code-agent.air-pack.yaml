agent:
  name: air-code-agent
  version: 0.2.0
  description: "Pack manifest for AIR's minimal coding-agent loop."

default_profile: edit.air-profile.yaml
intent: "Run a minimal read/search/edit loop with formatting, tests, and diff reporting."
completion:
  any:
    - equals:
        path: /edit/final_success
        value: true
