agent:
  name: air-code-agent
  version: 0.2.0
  description: "Pack manifest for AIR's bounded coding-agent recipes."

routing:
  auto:
    - recipe: edit
      when:
        all_present: [target, test]
    - recipe: review
      when:
        any_present: [search_query, repo_query, required_terms]
    - recipe: explore
      fallback: true

recipes:
  - id: auto
    default_profile: explore.air-profile.yaml
    intent: "Fallback read-only exploration profile used before CLI recipe inference."
    input:
      required: [task]
      optional: [target, write, test, query, related, search_query, repo_query, required_terms, force_patch]
    completion:
      any:
        - exists: /exploration
  - id: explore
    default_profile: explore.air-profile.yaml
    intent: "Read-only repository exploration."
    input:
      required: [task]
      optional: [query, target]
    completion:
      any:
        - exists: /exploration
  - id: review
    default_profile: review.air-profile.yaml
    intent: "Grounded code review with repository and external evidence."
    input:
      required: [task, target]
      optional: [query, related, search_query, repo_query, required_terms]
    completion:
      any:
        - equals:
            path: /review/search_quality/sufficient
            value: true
        - all:
            - missing: /review/search_quality/sufficient
            - exists: /review
  - id: edit
    default_profile: edit.air-profile.yaml
    intent: "Run the unified bounded code edit loop over an allowlisted test; target may be known or discovered before writing."
    input:
      required: [task, test]
      optional: [query, target, write, related, force_patch, target_search_pattern, target_symbol_query]
    completion:
      any:
        - equals:
            path: /edit/final_success
            value: true
