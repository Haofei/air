agent:
  name: air-code-agent
  version: 0.2.0
  description: "Pack manifest for AIR's bounded coding-agent loop."

recipes:
  - id: edit
    default_profile: edit.air-profile.yaml
    intent: "Run the unified bounded code loop with model-selected discovery, review, edit, format, and verification."
    input:
      required: [task]
    completion:
      any:
        - equals:
            path: /edit/final_success
            value: true
