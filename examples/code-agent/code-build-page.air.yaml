agent:
  name: code-build-page-agent
  version: 0.1.0
  description: "Bounded coding builder: generate one static HTML page, write it inside an allowed directory, run a configured smoke test, and render browser audit screenshots."

inputs:
  task: string
  output_path: string
  brand: string
  product: string
  constraints:
    type: array
    items: string

outputs:
  build:
    type: object
    required: [path, bytes, created, overwritten, test_success, audit_success, revised, smoke_log, audit_diagnostics, screenshots, notes]
    properties:
      path: string
      bytes: integer
      created: boolean
      overwritten: boolean
      test_success: boolean
      audit_success: boolean
      revised: boolean
      smoke_log: string
      audit_diagnostics:
        type: array
        items: object
      screenshots:
        type: array
        items: string
      notes:
        type: array
        items: string

requires:
  capabilities: [file.write, code.test, browser.audit]

state:
  phase:
    type: enum
    enum: [init, generate, write, test, audit, route, revise, write_retry, test_retry, audit_retry, done, failed]
  page:
    type: object
    required: [content]
    properties:
      content: string
  page_retry:
    type: object
    required: [content]
    properties:
      content: string
  write_result:
    type: object
    required: [path, bytes, created, overwritten, artifacts]
    properties:
      path: string
      bytes: integer
      created: boolean
      overwritten: boolean
      artifacts:
        type: array
        items: object
  write_result_retry:
    type: object
    required: [path, bytes, created, overwritten, artifacts]
    properties:
      path: string
      bytes: integer
      created: boolean
      overwritten: boolean
      artifacts:
        type: array
        items: object
  test_results:
    type: object
    required: [command, success, log, artifacts]
    properties:
      command: string
      success: boolean
      status: integer
      log: string
      bytes: integer
      truncated: boolean
      artifacts:
        type: array
        items: object
  test_results_retry:
    type: object
    required: [command, success, log, artifacts]
    properties:
      command: string
      success: boolean
      status: integer
      log: string
      bytes: integer
      truncated: boolean
      artifacts:
        type: array
        items: object
  audit_result:
    type: object
    required: [success, viewport_count, screenshot_paths, viewports, diagnostics, artifacts]
    properties:
      success: boolean
      viewport_count: integer
      screenshot_paths:
        type: array
        items: string
      viewports:
        type: array
        items: object
      diagnostics:
        type: array
        items: object
      artifacts:
        type: array
        items: object
  audit_result_retry:
    type: object
    required: [success, viewport_count, screenshot_paths, viewports, diagnostics, artifacts]
    properties:
      success: boolean
      viewport_count: integer
      screenshot_paths:
        type: array
        items: string
      viewports:
        type: array
        items: object
      diagnostics:
        type: array
        items: object
      artifacts:
        type: array
        items: object
  build:
    type: object
    required: [path, bytes, created, overwritten, test_success, audit_success, revised, smoke_log, audit_diagnostics, screenshots, notes]
    properties:
      path: string
      bytes: integer
      created: boolean
      overwritten: boolean
      test_success: boolean
      audit_success: boolean
      revised: boolean
      smoke_log: string
      audit_diagnostics:
        type: array
        items: object
      screenshots:
        type: array
        items: string
      notes:
        type: array
        items: string

tools:
  - name: file.write
    capability: file.write
    timeout_ms: 10000
  - name: test.run
    capability: code.test
    timeout_ms: 30000
  - name: browser.audit
    capability: browser.audit
    timeout_ms: 30000

workflow:
  kind: state_machine
  initial: init
  max_steps: 12
  terminal: [done, failed]
  rules:
    - id: init
      when: phase == "init"
      actions:
        - kind: set
          values:
            phase: generate

    - id: generate
      when: phase == "generate"
      actions:
        - kind: model_call
          model: page_builder
          input:
            object:
              task:
                ref: task
              output_path:
                ref: output_path
              brand:
                ref: brand
              product:
                ref: product
              constraints:
                ref: constraints
          output: page
          timeout_seconds: 240
          retry:
            max_attempts: 2
        - kind: set
          values:
            phase: write

    - id: write
      when: phase == "write"
      actions:
        - kind: tool_call
          tool: file.write
          input:
            object:
              path:
                ref: output_path
              content:
                ref: page.content
          output: write_result
          timeout_seconds: 10
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: test

    - id: test
      when: phase == "test"
      actions:
        - kind: tool_call
          tool: test.run
          input:
            object:
              command:
                literal: apple_landing_smoke
          output: test_results
          timeout_seconds: 30
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: audit

    - id: audit
      when: phase == "audit"
      actions:
        - kind: tool_call
          tool: browser.audit
          input:
            object:
              path:
                ref: write_result.path
          output: audit_result
          timeout_seconds: 30
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: route

    - id: route-success
      when: phase == "route" && test_results.success == true && audit_result.success == true
      actions:
        - kind: set
          values:
            build:
              object:
                path:
                  ref: write_result.path
                bytes:
                  ref: write_result.bytes
                created:
                  ref: write_result.created
                overwritten:
                  ref: write_result.overwritten
                test_success:
                  ref: test_results.success
                audit_success:
                  ref: audit_result.success
                revised:
                  literal: false
                smoke_log:
                  ref: test_results.log
                audit_diagnostics:
                  ref: audit_result.diagnostics
                screenshots:
                  ref: audit_result.screenshot_paths
                notes:
                  array:
                    - literal: "Generated as raw HTML content and written through constrained file.write."
                    - literal: "Smoke test checked doctype, canvas, product name, media query, closing HTML, and minimum length."
                    - literal: "Browser audit rendered desktop and mobile viewports and checked overflow, console errors, page errors, overlap heuristics, and screenshots."
            phase: done

    - id: route-revise
      when: phase == "route" && test_results.success == false || phase == "route" && audit_result.success == false
      actions:
        - kind: model_call
          model: page_builder
          input:
            object:
              task:
                ref: task
              output_path:
                ref: output_path
              brand:
                ref: brand
              product:
                ref: product
              constraints:
                ref: constraints
              previous_content:
                ref: page.content
              smoke_test:
                ref: test_results
              browser_audit:
                ref: audit_result
              revision_request:
                literal: "Revise the same single-file HTML to fix the smoke-test or browser-audit failures. Keep the output as raw HTML only."
          output: page_retry
          timeout_seconds: 240
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: write_retry

    - id: write-retry
      when: phase == "write_retry"
      actions:
        - kind: tool_call
          tool: file.write
          input:
            object:
              path:
                ref: output_path
              content:
                ref: page_retry.content
          output: write_result_retry
          timeout_seconds: 10
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: test_retry

    - id: test-retry
      when: phase == "test_retry"
      actions:
        - kind: tool_call
          tool: test.run
          input:
            object:
              command:
                literal: apple_landing_smoke
          output: test_results_retry
          timeout_seconds: 30
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: audit_retry

    - id: audit-retry
      when: phase == "audit_retry"
      actions:
        - kind: tool_call
          tool: browser.audit
          input:
            object:
              path:
                ref: write_result_retry.path
          output: audit_result_retry
          timeout_seconds: 30
          retry:
            max_attempts: 1
        - kind: set
          values:
            build:
              object:
                path:
                  ref: write_result_retry.path
                bytes:
                  ref: write_result_retry.bytes
                created:
                  ref: write_result_retry.created
                overwritten:
                  ref: write_result_retry.overwritten
                test_success:
                  ref: test_results_retry.success
                audit_success:
                  ref: audit_result_retry.success
                revised:
                  literal: true
                smoke_log:
                  ref: test_results_retry.log
                audit_diagnostics:
                  ref: audit_result_retry.diagnostics
                screenshots:
                  ref: audit_result_retry.screenshot_paths
                notes:
                  array:
                    - literal: "Generated as raw HTML content and written through constrained file.write."
                    - literal: "Smoke test checked doctype, canvas, product name, media query, closing HTML, and minimum length."
                    - literal: "Browser audit rendered desktop and mobile viewports and checked overflow, console errors, page errors, overlap heuristics, and screenshots."
                    - literal: "First pass failed, so the model received the smoke-test and browser-audit diagnostics and produced one bounded revision."
            phase: done

    - id: done
      when: phase == "done"
      actions:
        - kind: return
          output: build

policy:
  max_model_calls: 2
  max_tool_calls: 6
  timeout_seconds: 360

observability:
  traces: true
