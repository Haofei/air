agent:
  name: code-explore-agent
  version: 0.1.0
  description: "Read-only code exploration subagent for open-ended repository questions."

inputs:
  task: string
  query: string
  target_path: string

outputs:
  exploration:
    type: object
    required: [summary, relevant_files, findings, source_ids, next_steps]
    properties:
      summary: string
      relevant_files:
        type: array
        items:
          type: object
          required: [path, reason]
          properties:
            path: string
            reason: string
      findings:
        type: array
        items:
          type: object
          required: [title, evidence, source_ids]
          properties:
            title: string
            evidence: string
            source_ids:
              type: array
              items: string
      source_ids:
        type: array
        items: string
      next_steps:
        type: array
        items: string

requires:
  capabilities: [task.progress, network.search, file.read, code.read]

state:
  phase:
    type: enum
    enum: [init, plan, web_search, list_files, search_repo, read_context, inspect_symbols, read_target, read_todos, analyze, done, failed]
  plan_status: object
  todo_snapshot: object
  web_results: object
  repo_files: object
  repo_search: object
  repo_context: object
  repo_symbols: object
  target_context: object
  exploration:
    type: object
    required: [summary, relevant_files, findings, source_ids, next_steps]
    properties:
      summary: string
      relevant_files:
        type: array
        items:
          type: object
          required: [path, reason]
          properties:
            path: string
            reason: string
      findings:
        type: array
        items:
          type: object
          required: [title, evidence, source_ids]
          properties:
            title: string
            evidence: string
            source_ids:
              type: array
              items: string
      source_ids:
        type: array
        items: string
      next_steps:
        type: array
        items: string

tools:
  - name: todo.write
    capability: task.progress
    timeout_ms: 10000
  - name: todo.read
    capability: task.progress
    timeout_ms: 10000
  - name: web.search
    capability: network.search
    timeout_ms: 120000
  - name: repo.files
    capability: code.read
    timeout_ms: 10000
  - name: repo.search
    capability: code.read
    timeout_ms: 10000
  - name: repo.context
    capability: code.read
    timeout_ms: 10000
  - name: repo.symbols
    capability: code.read
    timeout_ms: 10000
  - name: file.read
    capability: file.read
    timeout_ms: 10000

workflow:
  kind: state_machine
  initial: init
  max_steps: 13
  terminal: [done, failed]
  rules:
    - id: init
      when: phase == "init"
      actions:
        - kind: set
          values:
            phase: plan

    - id: plan
      when: phase == "plan"
      actions:
        - kind: tool_call
          tool: todo.write
          input:
            object:
              todos:
                array:
                  - object:
                      id:
                        literal: explore-context
                      content:
                        literal: Gather repository and external context for the requested code question.
                      status:
                        literal: in_progress
                      priority:
                        literal: high
                  - object:
                      id:
                        literal: synthesize-answer
                      content:
                        literal: Summarize findings with exact source ids and next steps.
                      status:
                        literal: pending
                      priority:
                        literal: medium
          output: plan_status
          timeout_seconds: 10
        - kind: set
          values:
            phase: web_search

    - id: web-search
      when: phase == "web_search"
      actions:
        - kind: tool_call
          tool: web.search
          input:
            object:
              query:
                ref: query
              required_terms:
                array:
                  - ref: query
              max_results:
                literal: 4
          output: web_results
          timeout_seconds: 120
        - kind: set
          values:
            phase: list_files

    - id: list-files
      when: phase == "list_files"
      actions:
        - kind: tool_call
          tool: repo.files
          input:
            object:
              query:
                ref: query
              max_files:
                literal: 40
          output: repo_files
          timeout_seconds: 10
        - kind: set
          values:
            phase: search_repo

    - id: search-repo
      when: phase == "search_repo"
      actions:
        - kind: tool_call
          tool: repo.search
          input:
            object:
              query:
                ref: query
              mode:
                literal: fixed
              max_matches:
                literal: 40
          output: repo_search
          timeout_seconds: 10
        - kind: set
          values:
            phase: read_context

    - id: read-context
      when: phase == "read_context"
      actions:
        - kind: tool_call
          tool: repo.context
          input:
            object:
              query:
                ref: query
              mode:
                literal: fixed
              max_matches:
                literal: 40
              max_files:
                literal: 6
              context_lines:
                literal: 6
          output: repo_context
          timeout_seconds: 10
        - kind: set
          values:
            phase: inspect_symbols

    - id: inspect-symbols
      when: phase == "inspect_symbols"
      actions:
        - kind: tool_call
          tool: repo.symbols
          input:
            object:
              query:
                ref: query
              max_symbols:
                literal: 80
          output: repo_symbols
          timeout_seconds: 10
        - kind: set
          values:
            phase: read_target

    - id: read-target
      when: phase == "read_target"
      actions:
        - kind: tool_call
          tool: file.read
          input:
            object:
              path:
                ref: target_path
              numbered:
                literal: true
              max_bytes:
                literal: 40000
          output: target_context
          timeout_seconds: 10
        - kind: set
          values:
            phase: read_todos

    - id: read-todos
      when: phase == "read_todos"
      actions:
        - kind: tool_call
          tool: todo.read
          input:
            literal: {}
          output: todo_snapshot
          timeout_seconds: 10
        - kind: set
          values:
            phase: analyze

    - id: analyze
      when: phase == "analyze"
      actions:
        - kind: model_call
          model: code_explorer
          input:
            object:
              task:
                ref: task
              query:
                ref: query
              target_path:
                ref: target_path
              web_results:
                ref: web_results
              repo_files:
                ref: repo_files
              repo_search:
                ref: repo_search
              repo_context:
                ref: repo_context
              repo_symbols:
                ref: repo_symbols
              target_context:
                ref: target_context
              todo_snapshot:
                ref: todo_snapshot
          output: exploration
          timeout_seconds: 120
          retry:
            max_attempts: 2
        - kind: set
          values:
            phase: done

    - id: done
      when: phase == "done"
      actions:
        - kind: return
          output: exploration

policy:
  timeout_seconds: 240
  max_model_calls: 2
  max_tool_calls: 8

observability:
  traces: true
