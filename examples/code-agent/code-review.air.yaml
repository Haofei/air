agent:
  name: code-review-agent
  version: 0.1.0
  description: "Bounded coding agent: retrieve external references, inspect repository context, run verification, then produce grounded review guidance."

inputs:
  task: string
  search_query: string
  repo_query: string
  required_terms:
    type: array
    items: string
  target_file: string

outputs:
  review:
    type: object
    required: [summary, findings, source_ids, search_quality, next_steps]
    properties:
      summary: string
      findings:
        type: array
        items:
          type: object
          required: [severity, title, evidence, source_ids, recommendation]
          properties:
            severity:
              type: enum
              enum: [info, low, medium, high, critical]
            title: string
            evidence: string
            source_ids:
              type: array
              items: string
            recommendation: string
      source_ids:
        type: array
        items: string
      search_quality:
        type: object
        required: [sufficient, gaps]
        properties:
          sufficient: boolean
          gaps:
            type: array
            items: string
      next_steps:
        type: array
        items: string

requires:
  capabilities: [task.progress, network.search, file.read, code.read, code.test]

state:
  phase:
    type: enum
    enum: [init, plan, search, list_files, inspect_symbols, search_repo, read_context, read_file, read_diff, read_status, run_tests, analyze, done, failed]
  plan_status:
    type: object
    required: [todos, total, open_count, artifacts]
    properties:
      todos:
        type: array
        items: object
      total: integer
      open_count: integer
      pending_count: integer
      in_progress_count: integer
      completed_count: integer
      cancelled_count: integer
      artifacts:
        type: array
        items: object
  search_results:
    type: object
    required: [query, documents]
    properties:
      query: string
      documents:
        type: array
        items:
          type: object
          required: [id, title, content]
          properties:
            id: string
            title: string
            content: string
      artifacts:
        type: array
        items: object
      diagnostics: object
  repo_files:
    type: object
    required: [repo, files, artifacts]
    properties:
      repo: string
      query: string
      files:
        type: array
        items: string
      truncated: boolean
      artifacts:
        type: array
        items: object
  repo_search:
    type: object
    required: [repo, query, matches, artifacts]
    properties:
      repo: string
      query: string
      matches:
        type: array
        items: object
      truncated: boolean
      artifacts:
        type: array
        items: object
  repo_symbols:
    type: object
    required: [repo, symbols, artifacts]
    properties:
      repo: string
      query: string
      symbols:
        type: array
        items: object
      bytes: integer
      truncated: boolean
      artifacts:
        type: array
        items: object
  repo_context:
    type: object
    required: [repo, query, matches, snippets, artifacts]
    properties:
      repo: string
      query: string
      matches:
        type: array
        items: object
      snippets:
        type: array
        items: object
      bytes: integer
      truncated: boolean
      artifacts:
        type: array
        items: object
  file_context:
    type: object
    required: [path, content, artifacts]
    properties:
      path: string
      content: string
      bytes: integer
      truncated: boolean
      artifacts:
        type: array
        items: object
  diff_context:
    type: object
    required: [repo, diff, artifacts]
    properties:
      repo: string
      diff: string
      bytes: integer
      truncated: boolean
      artifacts:
        type: array
        items: object
  workspace_status:
    type: object
    required: [repo, clean, entries, file_count, artifacts]
    properties:
      repo: string
      clean: boolean
      entries:
        type: array
        items: object
      file_count: integer
      truncated: boolean
      artifacts:
        type: array
        items: object
  test_results:
    type: object
    required: [command, success, log, artifacts]
    properties:
      command: string
      success: boolean
      status: integer
      log: string
      bytes: integer
      truncated: boolean
      artifacts:
        type: array
        items: object
  review:
    type: object
    required: [summary, findings, source_ids, search_quality, next_steps]
    properties:
      summary: string
      findings:
        type: array
        items:
          type: object
          required: [severity, title, evidence, source_ids, recommendation]
          properties:
            severity:
              type: enum
              enum: [info, low, medium, high, critical]
            title: string
            evidence: string
            source_ids:
              type: array
              items: string
            recommendation: string
      source_ids:
        type: array
        items: string
      search_quality:
        type: object
        required: [sufficient, gaps]
        properties:
          sufficient: boolean
          gaps:
            type: array
            items: string
      next_steps:
        type: array
        items: string

tools:
  - name: todo.write
    capability: task.progress
    timeout_ms: 10000
  - name: web.search
    capability: network.search
    timeout_ms: 120000
  - name: file.read
    capability: file.read
    timeout_ms: 10000
  - name: repo.files
    capability: code.read
    timeout_ms: 10000
  - name: repo.search
    capability: code.read
    timeout_ms: 10000
  - name: repo.symbols
    capability: code.read
    timeout_ms: 10000
  - name: repo.context
    capability: code.read
    timeout_ms: 10000
  - name: git.diff
    capability: code.read
    timeout_ms: 10000
  - name: git.status
    capability: code.read
    timeout_ms: 10000
  - name: test.run
    capability: code.test
    timeout_ms: 120000

workflow:
  kind: state_machine
  initial: init
  max_steps: 13
  terminal: [done, failed]
  rules:
    - id: init
      when: phase == "init"
      actions:
        - kind: set
          values:
            phase: plan

    - id: plan
      when: phase == "plan"
      actions:
        - kind: tool_call
          tool: todo.write
          input:
            object:
              todos:
                array:
                  - object:
                      id:
                        literal: gather-evidence
                      content:
                        literal: Gather external references, repository matches, target file context, diff, status, and verification output.
                      status:
                        literal: in_progress
                      priority:
                        literal: high
                  - object:
                      id:
                        literal: analyze-risks
                      content:
                        literal: Produce grounded findings with cited artifact ids and search quality gaps.
                      status:
                        literal: pending
                      priority:
                        literal: high
                  - object:
                      id:
                        literal: recommend-next-steps
                      content:
                        literal: Return concise next steps based on evidence and test results.
                      status:
                        literal: pending
                      priority:
                        literal: medium
          output: plan_status
          timeout_seconds: 10
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: search

    - id: search
      when: phase == "search"
      actions:
        - kind: tool_call
          tool: web.search
          input:
            object:
              query:
                ref: search_query
              query_variants:
                array:
                  - template: "{{search_query}} official docs"
                  - template: "{{search_query}} GitHub issues"
                  - template: "{{search_query}} examples"
              required_terms:
                ref: required_terms
              max_results:
                literal: 6
              max_results_per_query:
                literal: 5
              max_per_domain:
                literal: 1
          output: search_results
          timeout_seconds: 120
          retry:
            max_attempts: 2
        - kind: set
          values:
            phase: list_files

    - id: list_files
      when: phase == "list_files"
      actions:
        - kind: tool_call
          tool: repo.files
          input:
            object:
              query:
                ref: repo_query
          output: repo_files
          timeout_seconds: 10
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: inspect_symbols

    - id: inspect_symbols
      when: phase == "inspect_symbols"
      actions:
        - kind: tool_call
          tool: repo.symbols
          input:
            object:
              query:
                ref: repo_query
              max_symbols:
                literal: 80
          output: repo_symbols
          timeout_seconds: 10
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: search_repo

    - id: search_repo
      when: phase == "search_repo"
      actions:
        - kind: tool_call
          tool: repo.search
          input:
            object:
              query:
                ref: repo_query
          output: repo_search
          timeout_seconds: 10
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: read_context

    - id: read_context
      when: phase == "read_context"
      actions:
        - kind: tool_call
          tool: repo.context
          input:
            object:
              query:
                ref: repo_query
              max_files:
                literal: 6
              context_lines:
                literal: 8
          output: repo_context
          timeout_seconds: 10
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: read_file

    - id: read_file
      when: phase == "read_file"
      actions:
        - kind: tool_call
          tool: file.read
          input:
            object:
              path:
                ref: target_file
              line_numbers:
                literal: true
          output: file_context
          timeout_seconds: 10
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: read_diff

    - id: read_diff
      when: phase == "read_diff"
      actions:
        - kind: tool_call
          tool: git.diff
          input:
            object:
              path:
                ref: target_file
              staged:
                literal: false
          output: diff_context
          timeout_seconds: 10
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: read_status

    - id: read_status
      when: phase == "read_status"
      actions:
        - kind: tool_call
          tool: git.status
          input:
            literal: {}
          output: workspace_status
          timeout_seconds: 10
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: run_tests

    - id: run_tests
      when: phase == "run_tests"
      actions:
        - kind: tool_call
          tool: test.run
          input:
            object:
              command:
                literal: air_tools
          output: test_results
          timeout_seconds: 120
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: analyze

    - id: analyze
      when: phase == "analyze"
      actions:
        - kind: model_call
          model: code_reviewer
          input:
            object:
              task:
                ref: task
              target_file:
                ref: target_file
              search_results:
                ref: search_results
              repo_files:
                ref: repo_files
              repo_search:
                ref: repo_search
              repo_symbols:
                ref: repo_symbols
              repo_context:
                ref: repo_context
              file_context:
                ref: file_context
              diff_context:
                ref: diff_context
              workspace_status:
                ref: workspace_status
              test_results:
                ref: test_results
              plan_status:
                ref: plan_status
          output: review
          timeout_seconds: 120
          retry:
            max_attempts: 2
        - kind: set
          values:
            phase: done

    - id: done
      when: phase == "done"
      actions:
        - kind: return
          output: review

policy:
  max_tool_calls: 12
  timeout_seconds: 300

observability:
  traces: true
