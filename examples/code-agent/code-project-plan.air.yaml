agent:
  name: code-project-plan-agent
  version: 0.1.0
  description: "Read-only project planning agent that turns a coding goal into a grounded task graph."

inputs:
  task: string
  query: string

outputs:
  project_plan:
    type: object
    required: [summary, scope, milestones, tasks, files, acceptance, risks, source_ids, next_steps]
    properties:
      summary: string
      scope:
        type: object
        required: [goal, non_goals, assumptions]
        properties:
          goal: string
          non_goals:
            type: array
            items: string
          assumptions:
            type: array
            items: string
      milestones:
        type: array
        items:
          type: object
          required: [id, title, objective, task_ids]
          properties:
            id: string
            title: string
            objective: string
            task_ids:
              type: array
              items: string
      tasks:
        type: array
        min_items: 1
        items:
          type: object
          required: [id, title, description, kind, depends_on, files, acceptance]
          properties:
            id: string
            title: string
            description: string
            kind: string
            depends_on:
              type: array
              items: string
            files:
              type: array
              items: string
            acceptance:
              type: array
              items: string
      files:
        type: array
        items:
          type: object
          required: [path, purpose, change_type]
          properties:
            path: string
            purpose: string
            change_type: string
      acceptance:
        type: array
        items:
          type: object
          required: [id, command, expected]
          properties:
            id: string
            command: string
            expected: string
      risks:
        type: array
        items:
          type: object
          required: [risk, mitigation]
          properties:
            risk: string
            mitigation: string
      source_ids:
        type: array
        items: string
      next_steps:
        type: array
        items: string

requires:
  capabilities: [task.progress, network.search, code.read]

state:
  phase:
    type: enum
    enum: [init, track, web_search, list_files, search_repo, read_context, read_todos, plan, done, failed]
  plan_status: object
  web_results: object
  repo_files: object
  repo_search: object
  repo_context: object
  todo_snapshot: object
  project_plan:
    type: object
    required: [summary, scope, milestones, tasks, files, acceptance, risks, source_ids, next_steps]
    properties:
      summary: string
      scope:
        type: object
        required: [goal, non_goals, assumptions]
        properties:
          goal: string
          non_goals:
            type: array
            items: string
          assumptions:
            type: array
            items: string
      milestones:
        type: array
        items:
          type: object
          required: [id, title, objective, task_ids]
          properties:
            id: string
            title: string
            objective: string
            task_ids:
              type: array
              items: string
      tasks:
        type: array
        min_items: 1
        items:
          type: object
          required: [id, title, description, kind, depends_on, files, acceptance]
          properties:
            id: string
            title: string
            description: string
            kind: string
            depends_on:
              type: array
              items: string
            files:
              type: array
              items: string
            acceptance:
              type: array
              items: string
      files:
        type: array
        items:
          type: object
          required: [path, purpose, change_type]
          properties:
            path: string
            purpose: string
            change_type: string
      acceptance:
        type: array
        items:
          type: object
          required: [id, command, expected]
          properties:
            id: string
            command: string
            expected: string
      risks:
        type: array
        items:
          type: object
          required: [risk, mitigation]
          properties:
            risk: string
            mitigation: string
      source_ids:
        type: array
        items: string
      next_steps:
        type: array
        items: string

tools:
  - name: todo.write
    capability: task.progress
    timeout_ms: 10000
  - name: todo.read
    capability: task.progress
    timeout_ms: 10000
  - name: web.search
    capability: network.search
    timeout_ms: 120000
  - name: repo.files
    capability: code.read
    timeout_ms: 10000
  - name: repo.search
    capability: code.read
    timeout_ms: 10000
  - name: repo.context
    capability: code.read
    timeout_ms: 10000

workflow:
  kind: state_machine
  initial: init
  max_steps: 10
  terminal: [done, failed]
  rules:
    - id: init
      when: phase == "init"
      actions:
        - kind: set
          values:
            phase: track

    - id: track
      when: phase == "track"
      actions:
        - kind: tool_call
          tool: todo.write
          input:
            object:
              todos:
                array:
                  - object:
                      id:
                        literal: scope-project
                      content:
                        literal: Define the project goal, non-goals, and assumptions.
                      status:
                        literal: in_progress
                      priority:
                        literal: high
                  - object:
                      id:
                        literal: gather-evidence
                      content:
                        literal: Gather repository and external evidence before planning tasks.
                      status:
                        literal: pending
                      priority:
                        literal: high
                  - object:
                      id:
                        literal: produce-task-graph
                      content:
                        literal: Produce milestones, dependencies, files, and acceptance checks.
                      status:
                        literal: pending
                      priority:
                        literal: medium
          output: plan_status
          timeout_seconds: 10
        - kind: set
          values:
            phase: web_search

    - id: web-search
      when: phase == "web_search"
      actions:
        - kind: tool_call
          tool: web.search
          input:
            object:
              query:
                ref: query
              required_terms:
                array:
                  - ref: query
              max_results:
                literal: 4
          output: web_results
          timeout_seconds: 120
        - kind: set
          values:
            phase: list_files

    - id: list-files
      when: phase == "list_files"
      actions:
        - kind: tool_call
          tool: repo.files
          input:
            object:
              query:
                ref: query
              max_files:
                literal: 60
          output: repo_files
          timeout_seconds: 10
        - kind: set
          values:
            phase: search_repo

    - id: search-repo
      when: phase == "search_repo"
      actions:
        - kind: tool_call
          tool: repo.search
          input:
            object:
              query:
                ref: query
              mode:
                literal: fixed
              max_matches:
                literal: 80
          output: repo_search
          timeout_seconds: 10
        - kind: set
          values:
            phase: read_context

    - id: read-context
      when: phase == "read_context"
      actions:
        - kind: tool_call
          tool: repo.context
          input:
            object:
              query:
                ref: query
              mode:
                literal: fixed
              max_matches:
                literal: 80
              max_files:
                literal: 8
              context_lines:
                literal: 8
          output: repo_context
          timeout_seconds: 10
        - kind: set
          values:
            phase: read_todos

    - id: read-todos
      when: phase == "read_todos"
      actions:
        - kind: tool_call
          tool: todo.read
          input:
            literal: {}
          output: todo_snapshot
          timeout_seconds: 10
        - kind: set
          values:
            phase: plan

    - id: plan
      when: phase == "plan"
      actions:
        - kind: model_call
          model: project_planner
          input:
            object:
              task:
                ref: task
              query:
                ref: query
              web_results:
                ref: web_results
              repo_files:
                ref: repo_files
              repo_search:
                ref: repo_search
              repo_context:
                ref: repo_context
              todo_snapshot:
                ref: todo_snapshot
          output: project_plan
          timeout_seconds: 120
          retry:
            max_attempts: 2
        - kind: set
          values:
            phase: done

    - id: done
      when: phase == "done"
      actions:
        - kind: return
          output: project_plan

policy:
  timeout_seconds: 240
  max_model_calls: 2
  max_tool_calls: 6

observability:
  traces: true
