plan:
  name: review-agent
  version: 0.1.0
description: "Read-only review-agent loop."

requires:
  capabilities: [file.read, code.read, gitlab.read, gitlab.graphql.read]

nodes:
  - id: review
    module: review.agent@0.1.0

entry: review

connect:
  - from: $input.task
    to: review.task
outputs:
  review: review.review

decisions:
  - id: choose-review-agent
    rationale: "Run the AIR read-only review executor."
    selected: [review]
