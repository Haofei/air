agent:
  name: review-agent-loop
  version: 0.1.0
  description: "Read-only review loop for diffs, PRs, MRs, and changed files."

inputs:
  task: string

outputs:
  review:
    type: object
    properties:
      review_completed: boolean
      final_success: boolean
      changed_files:
        type: array
        items: string
      assistant: object
      findings:
        type: array
        items: object
      rationale: string

requires:
  capabilities: [file.read, code.read, gitlab.read, gitlab.graphql.read]

policy:
  max_model_calls: 40
  max_tool_calls: 250

state:
  phase:
    type: enum
    enum: [init, choose, act, summarize, done]
  observations:
    type: array
    items: object
  available_skills:
    type: object
    properties:
      kind: string
      skills:
        type: array
        items: object
  decision:
    type: object
    required: [complete, tool_calls]
    properties:
      complete: boolean
      tool_calls:
        type: array
        items:
          type: object
          required: [tool, input]
          properties:
            tool: string
            input: object
  observation:
    type: array
    items: object
  review:
    type: object
    properties:
      review_completed: boolean
      final_success: boolean
      changed_files:
        type: array
        items: string
      assistant: object
      findings:
        type: array
        items: object
      rationale: string

tools:
  - name: question
    capability: code.read
    timeout_ms: 300000
  - name: grep
    capability: file.read
    timeout_ms: 300000
  - name: glob
    capability: code.read
    timeout_ms: 300000
  - name: read_range
    capability: file.read
    timeout_ms: 300000
  - name: read_contains
    capability: file.read
    timeout_ms: 300000
  - name: webfetch
    capability: code.read
    timeout_ms: 1800000
  - name: skill
    capability: code.read
    timeout_ms: 300000
  - name: gitlab
    capability: gitlab.read
    timeout_ms: 300000
  - name: gitlab_mr
    capability: gitlab.read
    timeout_ms: 300000
  - name: gitlab_mr_files
    capability: gitlab.read
    timeout_ms: 300000
  - name: gitlab_mr_diffs
    capability: gitlab.read
    timeout_ms: 300000
  - name: gitlab_graphql
    capability: gitlab.graphql.read
    timeout_ms: 300000

workflow:
  kind: state_machine
  initial: init
  max_steps: 160
  rules:
    - id: init
      when: phase == "init"
      actions:
        - kind: tool_call
          tool: skill
          input:
            object:
              route_task:
                ref: task
              top_k:
                literal: 3
          output: available_skills
          timeout_seconds: 300
        - kind: set
          values:
            observations: []
            phase: choose

    - id: summarize-at-step-limit
      when: phase == "choose" && _air.is_last_action_step == true
      actions:
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: step_budget_reached
              result:
                object:
                  runtime:
                    ref: _air
        - kind: set
          values:
            phase: summarize

    - id: choose
      when: phase == "choose"
      actions:
        - kind: model_call
          model: code_edit_decider
          input:
            object:
              task:
                ref: task
              review_mode:
                literal: "Read-only review: use evidence tools only; do not edit files, run tests, or post remote comments."
              observations:
                take_last_within_bytes:
                  ref: observations
                max_bytes: 600000
              available_skills:
                ref: available_skills
              allowed_tools:
                literal: [question, grep, glob, read_contains, read_range, webfetch, skill, gitlab_mr, gitlab_mr_files, gitlab_mr_diffs]
          output: decision
          timeout_seconds: 1800
          retry:
            max_attempts: 4
        - kind: set
          values:
            phase: act

    - id: act
      when: phase == "act" && decision.complete == false
      actions:
        - kind: tool_batch_dispatch
          input:
            path: decision.tool_calls
          output: observation
          max_calls: 64
          allowed_tools: [question, grep, glob, read_contains, read_range, webfetch, skill, gitlab_mr, gitlab_mr_files, gitlab_mr_diffs]
          timeout_seconds: 1800
          on_error: observe
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: tool_result
              assistant:
                ref: decision
              requested:
                ref: decision.tool_calls
              result:
                ref: observation
        - kind: set
          values:
            phase: choose

    - id: complete
      when: phase == "act" && decision.complete == true
      actions:
        - kind: set
          values:
            phase: summarize

    - id: summarize
      when: phase == "summarize"
      actions:
        - kind: set
          values:
            review:
              object:
                review_completed:
                  literal: true
                final_success:
                  literal: true
                changed_files:
                  literal: []
                assistant:
                  ref: decision
                findings:
                  literal: []
                rationale:
                  literal: Review completed by AIR review-agent; see assistant content and trace evidence for findings.
            phase: done

    - id: done
      when: phase == "done"
      actions:
        - kind: return
          output: review
