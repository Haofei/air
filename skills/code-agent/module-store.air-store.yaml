store:
  name: code-agent-store
  version: 0.1.0

imports:
  - ../../modules/std/module-store.air-store.yaml

modules:
  code.edit@0.1.0:
    path: skills/code-agent/code-edit-loop.air.yaml
    kind: composite
    visibility: public
    description: "Minimal opencode-style code-agent skill using question/bash/search/context/edit/task/webfetch/todo/skill tools."
    tags: [coding, edit, tool_loop, test]
    covers: [code_exploration, code_edit, bounded_tool_loop, retest]
    priority: 80
  code.explore@0.1.0:
    path: skills/code-agent/code-explore-loop.air.yaml
    kind: primitive
    visibility: internal
    description: "Non-mutating opencode-style subagent loop for isolated codebase exploration."
    tags: [coding, explore, subagent, read_only]
    covers: [code_exploration, bounded_tool_loop]
    priority: 60
  project.scout@0.1.0:
    path: skills/code-agent/project-scout-loop.air.yaml
    kind: primitive
    visibility: internal
    description: "Internal manifest scout."
    tags: [project_manifest]
    covers: [project_manifest]
    priority: 0
