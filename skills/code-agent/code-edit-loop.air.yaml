agent:
  name: code-edit-loop-agent
  version: 0.2.0
  description: "Minimal OpenCode-style code edit loop with line-numbered bounded spans, search, edit, bash, and todo tracking."

inputs:
  task: string

outputs:
  edit:
    type: object
    required: [initial_success, final_success, patch_applied, changed_files, workspace_changed_files, preexisting_changed_files, workspace_diff, rationale]
    properties:
      initial_success: boolean
      final_success: boolean
      patch_applied: boolean
      changed_files:
        type: array
        items: string
      workspace_changed_files:
        type: array
        items: string
      preexisting_changed_files:
        type: array
        items:
          type: object
          required: [path]
          properties:
            path: string
      workspace_diff: object
      rationale: string

requires:
  capabilities: [file.read, file.write, code.read, code.test]

policy:
  require_approval: [file.write]
  max_model_calls: 80
  max_tool_calls: 500

state:
  phase:
    type: enum
    enum: [init, choose, verify, act, verify_act, post_act, summarize, done]
  observations:
    type: array
    items: object
  verification_status:
    type: enum
    enum: [unknown, passed, failed]
  decision:
    type: object
    required: [complete, tool_calls]
    properties:
      complete: boolean
      tool_calls:
        type: array
        items:
          type: object
          required: [tool, input]
          properties:
            tool: string
            input: object
  observation:
    type: array
    items: object
  observation_summary:
    type: object
    properties:
      any_workspace_change: boolean
      any_verification_passed: boolean
      any_verification_failed: boolean
      verification_status_update:
        type: enum
        enum: [unchanged, unknown, passed, failed]
  final_diff_result:
    type: array
    items: object
  edit:
    type: object
    required: [initial_success, final_success, patch_applied, changed_files, workspace_changed_files, preexisting_changed_files, workspace_diff, rationale]
    properties:
      initial_success: boolean
      final_success: boolean
      patch_applied: boolean
      changed_files:
        type: array
        items: string
      workspace_changed_files:
        type: array
        items: string
      preexisting_changed_files:
        type: array
        items:
          type: object
          required: [path]
          properties:
            path: string
      workspace_diff: object
      rationale: string

tools:
  - name: question
    capability: code.read
    timeout_ms: 10000
  - name: bash
    capability: code.test
    timeout_ms: 120000
  - name: grep
    capability: file.read
    timeout_ms: 10000
  - name: glob
    capability: code.read
    timeout_ms: 10000
  - name: lsp
    capability: code.read
    timeout_ms: 30000
  - name: task
    capability: code.read
    timeout_ms: 600000
  - name: read
    capability: file.read
    timeout_ms: 10000
  - name: edit
    capability: file.write
    timeout_ms: 10000
  - name: write
    capability: file.write
    timeout_ms: 10000
  - name: apply_patch
    capability: file.write
    timeout_ms: 10000
  - name: webfetch
    capability: code.read
    timeout_ms: 120000
  - name: todowrite
    capability: code.read
    timeout_ms: 10000
  - name: todoread
    capability: code.read
    timeout_ms: 10000
  - name: skill
    capability: code.read
    timeout_ms: 10000

workflow:
  kind: state_machine
  initial: init
  max_steps: 220
  rules:
    - id: init
      when: phase == "init"
      actions:
        - kind: approval
          approval_for: [file.write]
        - kind: set
          values:
            observations: []
            observation_summary:
              verification_status_update: unchanged
              any_workspace_change: false
              any_verification_passed: false
              any_verification_failed: false
            verification_status: unknown
            phase: choose

    - id: summarize-at-step-limit
      when: phase == "choose" && _air.is_last_action_step == true
      actions:
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: step_budget_reached
              result:
                object:
                  runtime:
                    ref: _air
                  verification_status:
                    ref: verification_status
        - kind: set
          values:
            phase: summarize

    - id: choose
      when: phase == "choose"
      actions:
        - kind: model_call
          model: code_edit_decider
          input:
            object:
              task:
                ref: task
              observations:
                take_last_within_bytes:
                  ref: observations
                max_bytes: 600000
              allowed_tools:
                literal: [question, bash, grep, glob, lsp, task, read, edit, write, apply_patch, webfetch, todowrite, todoread, skill]
          output: decision
          timeout_seconds: 180
          retry:
            max_attempts: 4
        - kind: set
          values:
            phase: act

    - id: verify
      when: phase == "verify"
      actions:
        - kind: model_call
          model: code_edit_decider
          input:
            object:
              task:
                ref: task
              observations:
                take_last_within_bytes:
                  ref: observations
                max_bytes: 600000
              allowed_tools:
                literal: [bash]
          output: decision
          timeout_seconds: 180
          retry:
            max_attempts: 4
        - kind: set
          values:
            phase: verify_act

    - id: act
      when: phase == "act" && decision.complete == false
      actions:
        - kind: tool_batch_dispatch
          input:
            path: decision.tool_calls
          output: observation
          max_calls: 64
          timeout_seconds: 600
          on_error: observe
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: tool_result
              assistant:
                ref: decision
              requested:
                ref: decision.tool_calls
              result:
                ref: observation
        - kind: set
          values:
            phase: post_act

    - id: verify-act
      when: phase == "verify_act" && decision.complete == false
      actions:
        - kind: tool_batch_dispatch
          input:
            path: decision.tool_calls
          output: observation
          max_calls: 64
          allowed_tools: [bash]
          timeout_seconds: 600
          on_error: observe
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: tool_result
              assistant:
                ref: decision
              requested:
                ref: decision.tool_calls
              result:
                ref: observation
        - kind: set
          values:
            phase: post_act

    - id: verification-passed
      when: phase == "post_act" && observation_summary.verification_status_update == "passed"
      actions:
        - kind: set
          values:
            verification_status: passed
            phase: choose

    - id: verification-failed
      when: phase == "post_act" && observation_summary.verification_status_update == "failed"
      actions:
        - kind: set
          values:
            verification_status: failed
            phase: choose

    - id: verification-reset-after-write
      when: phase == "post_act" && observation_summary.verification_status_update == "unknown"
      actions:
        - kind: set
          values:
            verification_status: unknown
            phase: choose

    - id: complete-needs-verification
      when: phase == "act" && decision.complete == true && verification_status != "passed"
      actions:
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: verification_required
              result:
                literal: Run an appropriate bash verification command before finishing.
        - kind: set
          values:
            phase: verify

    - id: verify-complete-needs-command
      when: phase == "verify_act" && decision.complete == true
      actions:
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: verification_required
              result:
                literal: Run an appropriate bash verification command before finishing.
        - kind: set
          values:
            phase: verify

    - id: complete-verified
      when: phase == "act" && decision.complete == true && verification_status == "passed"
      actions:
        - kind: set
          values:
            phase: summarize

    - id: continue-after-act
      when: phase == "post_act"
      actions:
        - kind: set
          values:
            phase: choose

    - id: summarize
      when: phase == "summarize"
      actions:
        - kind: tool_batch_dispatch
          input:
            array:
              - object:
                  tool:
                    literal: bash
                  input:
                    literal:
                      command: git diff -- && git ls-files --others --exclude-standard | while IFS= read -r file; do git diff --no-index -- /dev/null "$file" || true; done
                      description: Show workspace diff including untracked files
              - object:
                  tool:
                    literal: bash
                  input:
                    literal:
                      command: '{ git diff --name-only --; git ls-files --others --exclude-standard; } | sort -u'
                      description: List changed files including untracked files
          output: final_diff_result
          max_calls: 2
          timeout_seconds: 120
          on_error: observe
        - kind: set
          values:
            edit:
              object:
                initial_success:
                  literal: false
                final_success:
                  equals:
                    - array:
                        - ref: verification_status
                        - not:
                            is_empty:
                              split_lines:
                                ref: final_diff_result[1].output.log
                    - literal: [passed, true]
                patch_applied:
                  not:
                    is_empty:
                      split_lines:
                        ref: final_diff_result[1].output.log
                changed_files:
                  split_lines:
                    ref: final_diff_result[1].output.log
                workspace_changed_files:
                  split_lines:
                    ref: final_diff_result[1].output.log
                preexisting_changed_files:
                  literal: []
                workspace_diff:
                  object:
                    provider:
                      literal: bash
                    command:
                      ref: final_diff_result[0].output.input_command
                    success:
                      ref: final_diff_result[0].output.success
                    diff:
                      ref: final_diff_result[0].output.log
                    bytes:
                      ref: final_diff_result[0].output.bytes
                    truncated:
                      ref: final_diff_result[0].output.truncated
                rationale:
                  literal: Completed by AIR code agent; see workspace_diff and changed_files for the audited change.
            phase: done

    - id: done
      when: phase == "done"
      actions:
        - kind: return
          output: edit
