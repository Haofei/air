agent:
  name: code-edit-loop-agent
  version: 0.2.0
  description: "Minimal OpenCode-style code edit loop with line-numbered bounded spans, search, edit, bash, and todo tracking."

inputs:
  task: string
  verification_command: string

outputs:
  edit: &edit_output_schema
    type: object
    required: [initial_success, final_success, patch_applied, changed_files, workspace_changed_files, preexisting_changed_files, workspace_diff, rationale]
    properties:
      initial_success: boolean
      final_success: boolean
      patch_applied: boolean
      changed_files:
        type: array
        items: string
      workspace_changed_files:
        type: array
        items: string
      preexisting_changed_files:
        type: array
        items:
          type: object
          required: [path]
          properties:
            path: string
      workspace_diff: object
      rationale: string

requires:
  capabilities: [file.read, file.write, code.read, code.test]

policy:
  require_approval: [file.write]
  max_model_calls: 80
  max_tool_calls: 500

state:
  phase:
    type: enum
    enum: [init, choose, verify, act, verify_act, post_act, summarize, done]
  observations:
    type: array
    items: object
  verification_status:
    type: enum
    enum: [unknown, passed, failed]
  verification_required:
    type: boolean
  decision:
    type: object
    required: [complete, tool_calls]
    properties:
      complete: boolean
      tool_calls:
        type: array
        items:
          type: object
          required: [tool, input]
          properties:
            tool: string
            input: object
  observation:
    type: array
    items: object
  observation_summary:
    type: object
    properties:
      any_workspace_change: boolean
      any_verification_passed: boolean
      any_verification_failed: boolean
      verification_status_update:
        type: enum
        enum: [unchanged, unknown, passed, failed]
  available_skills:
    type: object
    properties:
      kind: string
      skills:
        type: array
        items: object
  final_diff_result:
    type: array
    items: object
  preexisting_diff_result:
    type: array
    items: object
  edit: *edit_output_schema

tools:
  - name: question
    capability: code.read
    timeout_ms: 300000
  - name: bash
    capability: code.test
    timeout_ms: 1800000
  - name: grep
    capability: file.read
    timeout_ms: 300000
  - name: glob
    capability: code.read
    timeout_ms: 300000
  - name: lsp
    capability: code.read
    timeout_ms: 1800000
  - name: task
    capability: code.read
    timeout_ms: 1800000
  - name: read_range
    capability: file.read
    timeout_ms: 300000
  - name: read_contains
    capability: file.read
    timeout_ms: 300000
  - name: edit
    capability: file.write
    timeout_ms: 300000
  - name: webfetch
    capability: code.read
    timeout_ms: 1800000
  - name: todowrite
    capability: code.read
    timeout_ms: 300000
  - name: todoread
    capability: code.read
    timeout_ms: 300000
  - name: skill
    capability: code.read
    timeout_ms: 300000

workflow:
  kind: state_machine
  initial: init
  max_steps: 220
  rules:
    - id: init
      when: phase == "init"
      actions:
        - kind: approval
          approval_for: [file.write]
        - kind: tool_batch_dispatch
          input:
            array:
              - object:
                  tool:
                    literal: bash
                  input:
                    literal:
                      command: |
                        if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
                          { git diff --name-only -- .; git ls-files --others --exclude-standard -- .; } | sort -u
                        else
                          find . -type f -not -path './.git/*' -not -path './.air/*' -not -path './target/*' -exec shasum -a 256 {} \; | sed 's#  \./#  #' | sort
                        fi
                      description: Capture pre-existing workspace changes before editing
          output: preexisting_diff_result
          max_calls: 1
          allowed_tools: [bash]
          timeout_seconds: 1800
          on_error: observe
        - kind: tool_call
          tool: skill
          input:
            object:
              route_task:
                ref: task
              top_k:
                literal: 3
          output: available_skills
          timeout_seconds: 300
        - kind: set
          values:
            observations: []
            observation_summary:
              verification_status_update: unchanged
              any_workspace_change: false
              any_verification_passed: false
              any_verification_failed: false
            verification_status: unknown
            verification_required: false
            phase: choose

    - id: summarize-at-step-limit
      when: phase != "init" && phase != "post_act" && phase != "summarize" && phase != "done" && _air.is_last_action_step == true
      actions:
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: step_budget_reached
              result:
                object:
                  runtime:
                    ref: _air
                  verification_status:
                    ref: verification_status
        - kind: set
          values:
            phase: summarize

    - id: choose
      when: phase == "choose"
      actions:
        - kind: model_call
          model: code_edit_decider
          input:
            object:
              task:
                ref: task
              observations:
                take_last_within_bytes:
                  ref: observations
                max_bytes: 600000
              available_skills:
                ref: available_skills
              allowed_tools:
                literal: [question, bash, grep, glob, lsp, task, read_contains, read_range, edit, webfetch, todowrite, todoread, skill]
          output: decision
          timeout_seconds: 1800
          retry:
            max_attempts: 4
        - kind: set
          values:
            phase: act

    - id: verify-command
      when: phase == "verify" && verification_command != ""
      actions:
        - kind: tool_batch_dispatch
          input:
            array:
              - object:
                  tool:
                    literal: bash
                  input:
                    object:
                      command:
                        ref: verification_command
                      description:
                        literal: Run deterministic verification command
          output: observation
          max_calls: 1
          allowed_tools: [bash]
          timeout_seconds: 1800
          on_error: observe
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: tool_result
              assistant:
                object:
                  complete:
                    literal: false
                  tool_calls:
                    array:
                      - object:
                          tool:
                            literal: bash
                          input:
                            object:
                              command:
                                ref: verification_command
                              description:
                                literal: Run deterministic verification command
              requested:
                array:
                  - object:
                      tool:
                        literal: bash
                      input:
                        object:
                          command:
                            ref: verification_command
                          description:
                            literal: Run deterministic verification command
              result:
                ref: observation
        - kind: set
          values:
            phase: post_act

    - id: verify
      when: phase == "verify" && verification_command == ""
      actions:
        - kind: model_call
          model: code_edit_decider
          input:
            object:
              task:
                ref: task
              observations:
                take_last_within_bytes:
                  ref: observations
                max_bytes: 600000
              allowed_tools:
                literal: [bash]
              verification_gate:
                literal:
                  required: true
                  instruction: "Run exactly one real verification command such as cargo test, cargo check, cargo clippy, npm test, pytest, or another test/check/lint command. Do not inspect files, grep, print source, or run exploratory commands in verify phase."
          output: decision
          timeout_seconds: 1800
          retry:
            max_attempts: 4
        - kind: set
          values:
            phase: verify_act

    - id: act
      when: phase == "act" && decision.complete == false
      actions:
        - kind: tool_batch_dispatch
          input:
            path: decision.tool_calls
          output: observation
          max_calls: 64
          allowed_tools: [question, bash, grep, glob, lsp, task, read_contains, read_range, edit, webfetch, todowrite, todoread, skill]
          timeout_seconds: 1800
          on_error: observe
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: tool_result
              assistant:
                ref: decision
              requested:
                ref: decision.tool_calls
              result:
                ref: observation
        - kind: set
          values:
            phase: post_act

    - id: act-missing-complete-decision
      when: phase == "act" && decision.complete == null
      actions:
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: malformed_decision
              result:
                literal: The prior decision was missing complete/tool_calls. Return valid structured output before tool execution.
        - kind: set
          values:
            phase: choose

    - id: act-missing-tool-calls-decision
      when: phase == "act" && decision.tool_calls == null
      actions:
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: malformed_decision
              result:
                literal: The prior decision was missing tool_calls. Return valid structured output before tool execution.
        - kind: set
          values:
            phase: choose

    - id: verify-act
      when: phase == "verify_act" && decision.complete == false
      actions:
        - kind: tool_batch_dispatch
          input:
            path: decision.tool_calls
          output: observation
          max_calls: 64
          allowed_tools: [bash]
          timeout_seconds: 1800
          on_error: observe
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: tool_result
              assistant:
                ref: decision
              requested:
                ref: decision.tool_calls
              result:
                ref: observation
        - kind: set
          values:
            phase: post_act

    - id: verify-act-missing-complete-decision
      when: phase == "verify_act" && decision.complete == null
      actions:
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: malformed_decision
              result:
                literal: The verification decision was missing complete/tool_calls. Return exactly one bash verification command.
        - kind: set
          values:
            phase: verify

    - id: verify-act-missing-tool-calls-decision
      when: phase == "verify_act" && decision.tool_calls == null
      actions:
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: malformed_decision
              result:
                literal: The verification decision was missing tool_calls. Return exactly one bash verification command.
        - kind: set
          values:
            phase: verify

    - id: verification-passed
      when: phase == "post_act" && observation_summary.verification_status_update == "passed"
      actions:
        - kind: set
          values:
            verification_status: passed
            verification_required: false
            phase: choose

    - id: verification-failed-again
      when: phase == "post_act" && verification_status == "failed" && observation_summary.verification_status_update == "failed"
      actions:
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: verification_failed_cap
              result:
                literal: Verification failed again after a prior failed verification; summarize with the failing command/output instead of looping.
        - kind: set
          values:
            verification_status: failed
            verification_required: false
            phase: summarize

    - id: verification-failed
      when: phase == "post_act" && observation_summary.verification_status_update == "failed"
      actions:
        - kind: set
          values:
            verification_status: failed
            verification_required: false
            phase: choose

    - id: verification-reset-after-write
      when: phase == "post_act" && observation_summary.verification_status_update == "unknown"
      actions:
        - kind: set
          values:
            verification_status: unknown
            verification_required: false
            phase: choose

    - id: complete-needs-verification
      when: phase == "act" && decision.complete == true && verification_status != "passed"
      actions:
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: verification_required
              result:
                literal: Run an appropriate bash verification command before finishing.
        - kind: set
          values:
            verification_required: true
            phase: verify

    - id: verify-complete-needs-command
      when: phase == "verify_act" && decision.complete == true
      actions:
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: verification_required
              result:
                literal: Run an appropriate bash verification command before finishing.
        - kind: set
          values:
            verification_required: true
            phase: verify

    - id: verify-command-required
      when: phase == "post_act" && verification_required == true && observation_summary.verification_status_update == "unchanged"
      actions:
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: verification_required
              result:
                literal: Verify phase only accepts real test/check/lint commands. Exploratory bash commands are not verification.
        - kind: set
          values:
            verification_required: false
            phase: summarize

    - id: verify-command-mutated-workspace
      when: phase == "post_act" && verification_required == true && observation_summary.verification_status_update == "unknown"
      actions:
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: verification_required
              result:
                literal: Verify phase cannot satisfy the gate with workspace-mutating commands. Run a non-mutating test/check/lint command.
        - kind: set
          values:
            verification_required: false
            phase: summarize

    - id: complete-verified
      when: phase == "act" && decision.complete == true && verification_status == "passed"
      actions:
        - kind: set
          values:
            phase: summarize

    - id: summarize-post-act-at-step-limit
      when: phase == "post_act" && _air.is_last_action_step == true
      actions:
        - kind: append
          target: observations
          value:
            object:
              action:
                literal: step_budget_reached
              result:
                object:
                  runtime:
                    ref: _air
                  verification_status:
                    ref: verification_status
        - kind: set
          values:
            phase: summarize

    - id: continue-after-act
      when: phase == "post_act"
      actions:
        - kind: set
          values:
            phase: choose

    - id: summarize
      when: phase == "summarize"
      actions:
        - kind: tool_batch_dispatch
          input:
            array:
              - object:
                  tool:
                    literal: bash
                  input:
                    literal:
                      command: |
                        if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
                          git diff -- . && git ls-files --others --exclude-standard -- . | while IFS= read -r file; do git diff --no-index -- /dev/null "$file" || true; done
                        else
                          printf 'AIR non-git workspace: git diff unavailable; workspace delta is computed by AIR artifact snapshot when available.\n'
                        fi
                      description: Show workspace diff including untracked files
              - object:
                  tool:
                    literal: bash
                  input:
                    literal:
                      command: |
                        if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
                          { git diff --name-only -- .; git ls-files --others --exclude-standard -- .; } | sort -u
                        else
                          find . -type f -not -path './.git/*' -not -path './.air/*' -not -path './target/*' -exec shasum -a 256 {} \; | sed 's#  \./#  #' | sort
                        fi
                      description: List changed files including untracked files
          output: final_diff_result
          max_calls: 2
          allowed_tools: [bash]
          timeout_seconds: 1800
          on_error: observe
        - kind: set
          values:
            edit:
              object:
                initial_success:
                  literal: false
                final_success:
                  equals:
                    - array:
                        - ref: verification_status
                        - not:
                            is_empty:
                              line_difference:
                                - split_lines:
                                    ref: final_diff_result[1].output.log
                                - split_lines:
                                    ref: preexisting_diff_result[0].output.log
                    - literal: [passed, true]
                patch_applied:
                  not:
                    is_empty:
                      line_difference:
                        - split_lines:
                            ref: final_diff_result[1].output.log
                        - split_lines:
                            ref: preexisting_diff_result[0].output.log
                changed_files:
                  line_difference:
                    - split_lines:
                        ref: final_diff_result[1].output.log
                    - split_lines:
                        ref: preexisting_diff_result[0].output.log
                workspace_changed_files:
                  line_difference:
                    - split_lines:
                        ref: final_diff_result[1].output.log
                    - split_lines:
                        ref: preexisting_diff_result[0].output.log
                preexisting_changed_files:
                  path_objects:
                    split_lines:
                      ref: preexisting_diff_result[0].output.log
                workspace_diff:
                  object:
                    provider:
                      literal: bash
                    command:
                      ref: final_diff_result[0].output.input_command
                    success:
                      ref: final_diff_result[0].output.success
                    diff:
                      ref: final_diff_result[0].output.log
                    bytes:
                      ref: final_diff_result[0].output.bytes
                    truncated:
                      ref: final_diff_result[0].output.truncated
                rationale:
                  literal: Completed by AIR code agent; see workspace_diff and changed_files for the audited change.
            phase: done

    - id: done
      when: phase == "done"
      actions:
        - kind: return
          output: edit
