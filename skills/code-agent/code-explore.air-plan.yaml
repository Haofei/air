plan:
  name: code-explore
  version: 0.1.0
description: "Non-mutating coding subagent exploration loop."

requires:
  capabilities: [file.read, code.read]

nodes:
  - id: explore
    module: code.explore@0.1.0

entry: explore

connect:
  - from: $input.task
    to: explore.task
outputs:
  result: explore.result

decisions:
  - id: choose-code-explore-loop
    rationale: "Run the non-mutating AIR exploration loop."
    selected: [explore]
