schema: air.skill.v1
id: code-agent
mode: executor
version: 0.1.0
description: General AIR coding agent skill with bounded span inspection, edits, verification, trace, and replay.

source:
  type: local

instructions:
  files:
    - SKILL.md
    - README.md

capabilities:
  allow:
    - file.read
    - file.write
    - code.read
    - code.test
  deny:
    - secrets.read
    - shell.unrestricted

tools:
  config: tools.json

workflow:
  profile: edit.air-profile.yaml

routing:
  summary: General-purpose coding agent for editing, refactoring, testing, and reviewing code.
  triggers:
    - code
    - edit
    - refactor
    - fix
    - test
    - implement
  repo_markers:
    - Cargo.toml
    - package.json

verification:
  require_after_write: true
  require_patch: true
