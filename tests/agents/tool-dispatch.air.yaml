agent:
  name: tool-dispatch-agent
  version: 0.1.0

inputs:
  text: string

outputs:
  result:
    type: object
    required: [query, call]
    properties:
      query: string
      call: integer

state:
  phase:
    type: enum
    enum: [init, choose, dispatch, done]
  choice:
    type: object
    required: [tool, input]
    properties:
      tool: string
      input: object
  result:
    type: object
    required: [query, call]
    properties:
      query: string
      call: integer

tools:
  - name: docs.search
    capability: retrieval.local
    timeout_ms: 1000

requires:
  capabilities: [retrieval.local]

workflow:
  kind: state_machine
  initial: init
  max_steps: 6
  terminal: [done]
  rules:
    - id: init
      when: phase == "init"
      actions:
        - kind: set
          values:
            phase: choose
    - id: choose
      when: phase == "choose"
      actions:
        - kind: model_call
          model: dispatcher
          input:
            object:
              text:
                ref: text
          output: choice
          timeout_seconds: 5
        - kind: set
          values:
            phase: dispatch
    - id: dispatch
      when: phase == "dispatch"
      actions:
        - kind: tool_dispatch
          input:
            ref: choice
          output: result
          timeout_seconds: 5
        - kind: set
          values:
            phase: done
    - id: done
      when: phase == "done"
      actions:
        - kind: return
          output: result

policy:
  max_model_calls: 1
  max_tool_calls: 1
