agent:
  name: incident-classify-agent
  version: 0.1.0
  description: "Classify incident severity and customer visibility for a support case."

inputs:
  region:
    type: enum
    enum: [us, eu, apac]
  report:
    type: object
    required: [summary, recommended_action, owner, approved]
    properties:
      summary: string
      recommended_action: string
      owner:
        type: enum
        enum: [billing_support, technical_support, customer_success, sales_ops]
      approved: boolean

outputs:
  incident:
    type: object
    required: [severity, region, customer_visible]
    properties:
      severity:
        type: enum
        enum: [sev0, sev1, sev2, sev3]
      region:
        type: enum
        enum: [us, eu, apac]
      customer_visible: boolean

state:
  phase:
    type: enum
    enum: [init, classify, done, failed]
  incident:
    type: object
    required: [severity, region, customer_visible]
    properties:
      severity:
        type: enum
        enum: [sev0, sev1, sev2, sev3]
      region:
        type: enum
        enum: [us, eu, apac]
      customer_visible: boolean

workflow:
  kind: state_machine
  initial: init
  max_steps: 5
  terminal: [done, failed]
  rules:
    - id: init
      when: phase == "init"
      actions:
        - kind: set
          values:
            phase: classify
    - id: classify
      when: phase == "classify"
      actions:
        - kind: model_call
          model: incident_classifier
          input:
            object:
              region:
                ref: region
              report:
                ref: report
          output: incident
          timeout_seconds: 30
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: done
    - id: done
      when: phase == "done"
      actions:
        - kind: return
          output: incident
