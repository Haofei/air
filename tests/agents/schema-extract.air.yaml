agent:
  name: extract-agent
  version: 0.1.0

inputs:
  text: string

outputs:
  extracted:
    type: object
    required: [customer_issue, product_area, sentiment, urgency_signals]
    properties:
      customer_issue: string
      product_area:
        type: enum
        enum: [billing, account, technical, sales, other]
      sentiment:
        type: enum
        enum: [positive, neutral, negative]
      urgency_signals:
        type: array
        items: string

state:
  phase:
    type: enum
    enum: [init, extract, done, failed]
  extracted:
    type: object
    required: [customer_issue, product_area, sentiment, urgency_signals]
    properties:
      customer_issue: string
      product_area:
        type: enum
        enum: [billing, account, technical, sales, other]
      sentiment:
        type: enum
        enum: [positive, neutral, negative]
      urgency_signals:
        type: array
        items: string

workflow:
  kind: state_machine
  initial: init
  max_steps: 5
  rules:
    - id: init
      when: phase == "init"
      actions:
        - kind: set
          values:
            phase: extract
    - id: extract
      when: phase == "extract"
      actions:
        - kind: model_call
          model: extractor
          input:
            fields:
              text: text
          output: extracted
          timeout_seconds: 30
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: done
    - id: done
      when: phase == "done"
      actions:
        - kind: return
          output: extracted
