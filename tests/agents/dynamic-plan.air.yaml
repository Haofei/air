agent:
  name: dynamic-plan-agent
  version: 0.1.0
  description: "Emit a bounded topic array for dynamic fan-out smoke tests."

outputs:
  topics:
    type: array
    min_items: 2
    max_items: 2
    items: string

state:
  phase:
    type: enum
    enum: [init, done, failed]
  topics:
    type: array
    min_items: 2
    max_items: 2
    items: string

workflow:
  kind: state_machine
  initial: init
  max_steps: 3
  terminal: [done, failed]
  rules:
    - id: init
      when: phase == "init"
      actions:
        - kind: set
          values:
            topics: ["alpha", "beta"]
            phase: done
    - id: done
      when: phase == "done"
      actions:
        - kind: return
          output: topics
