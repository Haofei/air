agent:
  name: finance-impact-agent
  version: 0.1.0
  description: "Estimate refund and billing operations impact for a support case."

inputs:
  invoice_count: integer
  report:
    type: object
    required: [summary, recommended_action, owner, approved]
    properties:
      summary: string
      recommended_action: string
      owner:
        type: enum
        enum: [billing_support, technical_support, customer_success, sales_ops]
      approved: boolean

outputs:
  finance:
    type: object
    required: [refund_required, estimated_credit, finance_priority]
    properties:
      refund_required: boolean
      estimated_credit: number
      finance_priority:
        type: enum
        enum: [normal, urgent]

state:
  phase:
    type: enum
    enum: [init, estimate, done, failed]
  finance:
    type: object
    required: [refund_required, estimated_credit, finance_priority]
    properties:
      refund_required: boolean
      estimated_credit: number
      finance_priority:
        type: enum
        enum: [normal, urgent]

workflow:
  kind: state_machine
  initial: init
  max_steps: 5
  rules:
    - id: init
      when: phase == "init"
      actions:
        - kind: set
          values:
            phase: estimate
    - id: estimate
      when: phase == "estimate"
      actions:
        - kind: model_call
          model: finance_estimator
          input:
            object:
              invoice_count:
                ref: invoice_count
              report:
                ref: report
          output: finance
          timeout_seconds: 30
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: done
    - id: done
      when: phase == "done"
      actions:
        - kind: return
          output: finance
