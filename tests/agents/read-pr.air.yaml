agent:
  name: read-pr-agent
  version: 0.1.0

inputs:
  repo: string
  pr_number: integer

outputs:
  pr_payload: object

state:
  phase:
    type: enum
    enum: [init, read, done, failed]
  pr_payload: object

requires:
  capabilities:
    - github.read

tools:
  - name: github.read_pr
    capability: github.read
    timeout_ms: 30000

workflow:
  kind: state_machine
  initial: init
  max_steps: 5
  rules:
    - id: init
      when: phase == "init"
      actions:
        - kind: set
          values:
            phase: read
    - id: read
      when: phase == "read"
      actions:
        - kind: tool_call
          tool: github.read_pr
          input: repo
          output: pr_payload
          timeout_seconds: 30
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: done
    - id: done
      when: phase == "done"
      actions:
        - kind: return
          output: pr_payload

observability:
  traces: true
