agent:
  name: semantic-adapter-agent
  version: 0.1.0

inputs:
  raw:
    type: object
  target_schema:
    type: object

outputs:
  request:
    type: object
    required: [research_brief, topic, topic_count, owner, notes]
    properties:
      research_brief: string
      topic: string
      topic_count: integer
      owner: string
      notes:
        type: array
        items: string

state:
  phase:
    type: enum
    enum: [adapt, done, failed]
  request:
    type: object
    required: [research_brief, topic, topic_count, owner, notes]
    properties:
      research_brief: string
      topic: string
      topic_count: integer
      owner: string
      notes:
        type: array
        items: string

workflow:
  kind: state_machine
  initial: adapt
  max_steps: 4
  rules:
    - id: adapt
      when: phase == "adapt"
      actions:
        - kind: model_call
          model: semantic_adapter
          input:
            object:
              raw:
                ref: raw
              target_schema:
                ref: target_schema
          output: request
          timeout_seconds: 30
          retry:
            max_attempts: 2
        - kind: set
          values:
            phase: done
    - id: done
      when: phase == "done"
      actions:
        - kind: return
          output: request
