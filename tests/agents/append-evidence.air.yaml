agent:
  name: append-evidence-agent
  version: 0.1.0

inputs:
  item: string

outputs:
  evidence:
    type: array
    items: string

state:
  phase:
    type: enum
    enum: [init, add, done]
  evidence:
    type: array
    items: string

workflow:
  kind: state_machine
  initial: init
  max_steps: 5
  rules:
    - id: init
      when: phase == "init"
      actions:
        - kind: set
          values:
            phase: add
    - id: add
      when: phase == "add"
      actions:
        - kind: append
          target: evidence
          value:
            ref: item
        - kind: append
          target: evidence
          value:
            literal: "static evidence"
        - kind: set
          values:
            phase: done
    - id: done
      when: phase == "done"
      actions:
        - kind: return
          output: evidence
