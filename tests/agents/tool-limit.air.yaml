agent:
  name: tool-limit-agent
  version: 0.1.0

inputs:
  text: string

outputs:
  result: object

state:
  phase:
    type: enum
    enum: [init, first, second, done, failed]
  first_result: object
  second_result: object
  result: object

tools:
  - name: docs.search
    capability: retrieval.local
    timeout_ms: 1000

requires:
  capabilities: [retrieval.local]

workflow:
  kind: state_machine
  initial: init
  max_steps: 8
  terminal: [done, failed]
  rules:
    - id: init
      when: phase == "init"
      actions:
        - kind: set
          values:
            phase: first
    - id: first
      when: phase == "first"
      actions:
        - kind: tool_call
          tool: docs.search
          input:
            object:
              query:
                ref: text
          output: first_result
          timeout_seconds: 5
        - kind: set
          values:
            phase: second
    - id: second
      when: phase == "second"
      actions:
        - kind: tool_call
          tool: docs.search
          input:
            object:
              query:
                literal: second
          output: second_result
          timeout_seconds: 5
        - kind: set
          values:
            phase: done
    - id: done
      when: phase == "done"
      actions:
        - kind: return
          output: result

policy:
  max_tool_calls: 1
