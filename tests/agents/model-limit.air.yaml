agent:
  name: model-limit-agent
  version: 0.1.0

inputs:
  text: string

outputs:
  result: object

state:
  phase:
    type: enum
    enum: [init, first, second, done, failed]
  first_result: object
  second_result: object
  result: object

workflow:
  kind: state_machine
  initial: init
  max_steps: 8
  rules:
    - id: init
      when: phase == "init"
      actions:
        - kind: set
          values:
            phase: first
    - id: first
      when: phase == "first"
      actions:
        - kind: model_call
          model: limit_model
          input:
            object:
              text:
                ref: text
          output: first_result
          timeout_seconds: 30
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: second
    - id: second
      when: phase == "second"
      actions:
        - kind: model_call
          model: limit_model
          input:
            object:
              text:
                literal: second
          output: second_result
          timeout_seconds: 30
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: done
    - id: done
      when: phase == "done"
      actions:
        - kind: return
          output: result

policy:
  max_model_calls: 1
