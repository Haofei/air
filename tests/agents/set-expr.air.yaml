agent:
  name: set-expr-agent
  version: 0.1.0

inputs:
  text: string
  extracted:
    type: object
    required: [customer_issue, product_area]
    properties:
      customer_issue: string
      product_area: string

outputs:
  build:
    type: object
    required: [message, tags]
    properties:
      message: string
      tags:
        type: array
        items: string

state:
  phase:
    type: enum
    enum: [init, done, failed]
  build:
    type: object
    required: [message, tags]
    properties:
      message: string
      tags:
        type: array
        items: string

workflow:
  kind: state_machine
  initial: init
  max_steps: 3
  rules:
    - id: init
      when: phase == "init"
      actions:
        - kind: set
          values:
            build:
              object:
                message:
                  template: "{{extracted.customer_issue}} / {{text}}"
                tags:
                  array:
                    - literal: customer
                    - path: extracted.product_area
            phase: done
    - id: done
      when: phase == "done"
      actions:
        - kind: return
          output: build
