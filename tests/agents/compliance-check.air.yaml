agent:
  name: compliance-check-agent
  version: 0.1.0
  description: "Check whether a customer support case requires policy or legal review."

inputs:
  text: string
  report:
    type: object
    required: [summary, recommended_action, owner, approved]
    properties:
      summary: string
      recommended_action: string
      owner:
        type: enum
        enum: [billing_support, technical_support, customer_success, sales_ops]
      approved: boolean

outputs:
  compliance:
    type: object
    required: [requires_legal_review, policy_refs, reason]
    properties:
      requires_legal_review: boolean
      policy_refs:
        type: array
        items: string
      reason: string

state:
  phase:
    type: enum
    enum: [init, check, done, failed]
  compliance:
    type: object
    required: [requires_legal_review, policy_refs, reason]
    properties:
      requires_legal_review: boolean
      policy_refs:
        type: array
        items: string
      reason: string

workflow:
  kind: state_machine
  initial: init
  max_steps: 5
  terminal: [done, failed]
  rules:
    - id: init
      when: phase == "init"
      actions:
        - kind: set
          values:
            phase: check
    - id: check
      when: phase == "check"
      actions:
        - kind: model_call
          model: compliance_checker
          input:
            object:
              text:
                ref: text
              report:
                ref: report
          output: compliance
          timeout_seconds: 30
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: done
    - id: done
      when: phase == "done"
      actions:
        - kind: return
          output: compliance
