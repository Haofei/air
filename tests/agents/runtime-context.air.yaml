agent:
  name: runtime-context
  version: 0.1.0

outputs:
  answer:
    type: object

state:
  phase:
    type: enum
    enum: [init, done]
  answer:
    type: object

workflow:
  kind: state_machine
  initial: init
  max_steps: 1
  rules:
    - id: finish-on-last-step
      when: phase == "init" && _air.is_last_step == true
      actions:
        - kind: set
          values:
            answer:
              object:
                step_number:
                  ref: _air.step_number
                remaining_steps:
                  ref: _air.remaining_steps
                is_last_action_step:
                  ref: _air.is_last_action_step
            phase: done
    - id: done
      when: phase == "done"
      actions:
        - kind: return
          output: answer
