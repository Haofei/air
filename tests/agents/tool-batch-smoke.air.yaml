agent:
  name: tool-batch-smoke-agent
  version: 0.1.0

inputs:
  choices:
    type: array
    items:
      type: object
      required: [tool, input]
      properties:
        tool: string
        input: object

outputs:
  observations:
    type: array
    items:
      type: object
      required: [tool, input, output]
      properties:
        tool: string
        input: object
        output: object

state:
  phase:
    type: enum
    enum: [dispatch, done]
  observations:
    type: array
    items:
      type: object
      required: [tool, input, output]
      properties:
        tool: string
        input: object
        output: object

tools:
  - name: docs.search
    capability: retrieval.local
    timeout_ms: 1000

requires:
  capabilities: [retrieval.local]

workflow:
  kind: state_machine
  initial: dispatch
  max_steps: 3
  rules:
    - id: dispatch
      when: phase == "dispatch"
      actions:
        - kind: tool_batch_dispatch
          input:
            ref: choices
          output: observations
          max_calls: 2
          timeout_seconds: 5
        - kind: set
          values:
            phase: done
    - id: done
      when: phase == "done"
      actions:
        - kind: return
          output: observations

policy:
  max_tool_calls: 2
  max_repeated_tool_calls: 1
