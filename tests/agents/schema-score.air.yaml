agent:
  name: score-agent
  version: 0.1.0

inputs:
  text: string
  extracted:
    type: object
    required: [customer_issue, product_area, sentiment, urgency_signals]
    properties:
      customer_issue: string
      product_area:
        type: enum
        enum: [billing, account, technical, sales, other]
      sentiment:
        type: enum
        enum: [positive, neutral, negative]
      urgency_signals:
        type: array
        items: string

outputs:
  score:
    type: object
    required: [issue_summary, risk_score, priority, reason]
    properties:
      issue_summary: string
      risk_score: number
      priority:
        type: enum
        enum: [low, medium, high, critical]
      reason: string

state:
  phase:
    type: enum
    enum: [init, score, done, failed]
  score:
    type: object
    required: [issue_summary, risk_score, priority, reason]
    properties:
      issue_summary: string
      risk_score: number
      priority:
        type: enum
        enum: [low, medium, high, critical]
      reason: string

workflow:
  kind: state_machine
  initial: init
  max_steps: 5
  rules:
    - id: init
      when: phase == "init"
      actions:
        - kind: set
          values:
            phase: score
    - id: score
      when: phase == "score"
      actions:
        - kind: model_call
          model: scorer
          input:
            fields:
              text: text
              extracted: extracted
          output: score
          timeout_seconds: 30
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: done
    - id: done
      when: phase == "done"
      actions:
        - kind: return
          output: score
