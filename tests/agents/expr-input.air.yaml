agent:
  name: expr-input-agent
  version: 0.1.0

inputs:
  text: string
  extracted:
    type: object
    required: [customer_issue, product_area]
    properties:
      customer_issue: string
      product_area: string
  notes:
    type: array
    items: string

outputs:
  response: object

state:
  phase:
    type: enum
    enum: [init, call, done, failed]
  response: object

workflow:
  kind: state_machine
  initial: init
  max_steps: 5
  rules:
    - id: init
      when: phase == "init"
      actions:
        - kind: set
          values:
            phase: call
    - id: call
      when: phase == "call"
      actions:
        - kind: model_call
          model: expr_model
          input:
            object:
              text:
                ref: text
              issue:
                path: extracted.customer_issue
              kind:
                literal: triage
              tags:
                array:
                  - literal: customer
                  - path: extracted.product_area
              message:
                template: "{{extracted.customer_issue}} / {{text}}"
              short_message:
                truncate:
                  template: "{{extracted.customer_issue}} / {{text}}"
                max_chars: 13
              recent_notes:
                take_last:
                  ref: notes
                max_items: 2
              recent_notes_budgeted:
                take_last_within_bytes:
                  ref: notes
                max_bytes: 16
              changed_files:
                split_lines:
                  literal: "crates/air-tools/src/lib.rs\nskills/code-agent/code-edit-loop.air.yaml\n\n"
          output: response
          timeout_seconds: 30
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: done
    - id: done
      when: phase == "done"
      actions:
        - kind: return
          output: response
