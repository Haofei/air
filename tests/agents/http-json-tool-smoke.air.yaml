agent:
  name: http-json-tool-smoke-agent
  version: 0.1.0

inputs:
  query: string

outputs:
  result:
    type: object
    required: [query, documents]
    properties:
      query: string
      documents:
        type: array
        items:
          type: object

state:
  phase:
    type: enum
    enum: [search, done, failed]
  result:
    type: object
    required: [query, documents]
    properties:
      query: string
      documents:
        type: array
        items:
          type: object

requires:
  capabilities: [network.search]

tools:
  - name: web.search
    capability: network.search
    timeout_ms: 2000

workflow:
  kind: state_machine
  initial: search
  max_steps: 4
  rules:
    - id: search
      when: phase == "search"
      actions:
        - kind: tool_call
          tool: web.search
          input:
            object:
              query:
                ref: query
          output: result
          timeout_seconds: 5
        - kind: set
          values:
            phase: done
    - id: done
      when: phase == "done"
      actions:
        - kind: return
          output: result

policy:
  max_tool_calls: 1
