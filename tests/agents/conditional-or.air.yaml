agent:
  name: conditional-or-agent
  version: 0.1.0

inputs:
  question: string

outputs:
  result:
    type: object
    required: [route]
    properties:
      route: string

state:
  phase:
    type: enum
    enum: [init, route, done, failed]
  approved: boolean
  result:
    type: object
    required: [route]
    properties:
      route: string

workflow:
  kind: state_machine
  initial: init
  max_steps: 5
  rules:
    - id: init
      when: phase == "init"
      actions:
        - kind: set
          values:
            approved: false
            phase: route
    - id: route
      when: phase == "route" && approved == true || phase == "route" && approved == false
      actions:
        - kind: set
          values:
            result:
              route: disjunction
            phase: done
    - id: done
      when: phase == "done"
      actions:
        - kind: return
          output: result
