agent:
  name: tool-capability-smoke-agent
  version: 0.1.0

inputs:
  text: string

outputs:
  result:
    type: object
    required: [query, documents]
    properties:
      query: string
      documents:
        type: array
        items:
          type: object

state:
  phase:
    type: enum
    enum: [search, done, failed]
  result:
    type: object
    required: [query, documents]
    properties:
      query: string
      documents:
        type: array
        items:
          type: object

requires:
  capabilities: [retrieval.local]

tools:
  - name: docs.search
    capability: retrieval.local
    timeout_ms: 1000

workflow:
  kind: state_machine
  initial: search
  max_steps: 4
  terminal: [done, failed]
  rules:
    - id: search
      when: phase == "search"
      actions:
        - kind: tool_call
          tool: docs.search
          input:
            object:
              query:
                ref: text
          output: result
          timeout_seconds: 5
        - kind: set
          values:
            phase: done
    - id: done
      when: phase == "done"
      actions:
        - kind: return
          output: result

policy:
  max_tool_calls: 1
