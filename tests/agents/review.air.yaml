agent:
  name: review-agent
  version: 0.1.0

inputs:
  pr_payload: object

outputs:
  review: object

state:
  phase:
    type: enum
    enum: [init, review, done, failed]
  review: object

workflow:
  kind: state_machine
  initial: init
  max_steps: 5
  terminal: [done, failed]
  rules:
    - id: init
      when: phase == "init"
      actions:
        - kind: set
          values:
            phase: review
    - id: review
      when: phase == "review"
      actions:
        - kind: model_call
          model: reviewer
          input: pr_payload
          output: review
          timeout_seconds: 60
          retry:
            max_attempts: 1
        - kind: set
          values:
            phase: done
    - id: done
      when: phase == "done"
      actions:
        - kind: return
          output: review

observability:
  traces: true
