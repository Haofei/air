agent:
  name: invalid-cycle
  version: 0.1.0

outputs:
  done: string

requires:
  capabilities:
    - production.deploy

tools:
  - name: deploy.production
    capability: production.deploy

workflow:
  kind: dag
  entry: first
  nodes:
    - id: first
      kind: tool_call
      tool: deploy.production
      timeout_seconds: 30
      retry:
        max_attempts: 1
    - id: second
      kind: approval
      approval_for:
        - production.deploy
  edges:
    - from: first
      to: second
    - from: second
      to: first

policy:
  require_approval:
    - production.deploy
