plan:
  name: complex-customer-escalation
  version: 0.1.0

nodes:
  - id: triage
    module: customer.triage@0.1.0
  - id: compliance
    module: customer.compliance_check@0.1.0
  - id: retention
    module: customer.retention_plan@0.1.0
  - id: finance
    module: customer.finance_impact@0.1.0
  - id: incident
    module: customer.incident_classify@0.1.0
  - id: executive
    module: customer.executive_case_summary@0.1.0

entry: triage

edges:
  - from: triage
    to: compliance
  - from: triage
    to: retention
  - from: triage
    to: finance
  - from: triage
    to: incident
  - from: triage
    to: executive
  - from: compliance
    to: executive
  - from: retention
    to: executive
  - from: finance
    to: executive
  - from: incident
    to: executive

connect:
  - from: $input.text
    to: triage.text
  - from: $input.text
    to: compliance.text
  - from: triage.report
    to: compliance.report
  - from: $input.account_tier
    to: retention.account_tier
  - from: triage.report
    to: retention.report
  - from: $input.invoice_count
    to: finance.invoice_count
  - from: triage.report
    to: finance.report
  - from: $input.region
    to: incident.region
  - from: triage.report
    to: incident.report
  - from: $input.text
    to: executive.text
  - from: triage.report
    to: executive.report
  - from: compliance.compliance
    to: executive.compliance
  - from: retention.retention
    to: executive.retention
  - from: finance.finance
    to: executive.finance
  - from: incident.incident
    to: executive.incident

outputs:
  final_case: executive.final_case

decisions:
  - id: choose-triage-composite
    rationale: "Use the public triage composite rather than rebuilding extract, score, and report from primitives."
    selected: [triage]
  - id: fan-out-specialists
    rationale: "Run compliance, retention, finance, and incident specialists in parallel from the triage report."
    selected: [compliance, retention, finance, incident]
  - id: fan-in-executive-summary
    rationale: "Join all specialist outputs into one final escalation packet."
    selected: [executive]
