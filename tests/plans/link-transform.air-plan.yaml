plan:
  name: link-transform-run-plan
  version: 0.1.0

nodes:
  - id: plan
    module: test.link_transform_source@0.1.0
  - id: topic
    module: test.link_transform_target@0.1.0

entry: plan

edges:
  - from: plan
    to: topic

connect:
  - to: topic.request
    value:
      object:
        research_brief:
          from: plan.plan.brief
        topic:
          from: plan.plan.topics[0]
        topic_count:
          count:
            from: plan.plan.topics
        owner:
          coalesce:
            - from: plan.plan.owner
            - from: $input.default_owner
            - literal: research
        notes:
          array:
            - literal: planner
            - from: plan.plan.topics[1]

outputs:
  request: topic.response
