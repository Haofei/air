plan:
  name: dynamic-multiple-boundaries
  version: 0.1.0

nodes:
  - id: plan_a
    module: test.dynamic_plan@0.1.0
  - id: plan_b
    module: test.dynamic_plan@0.1.0
  - id: final
    module: test.final_notes@0.1.0

entry: plan_a

edges:
  - from: plan_a
    to: plan_b
  - from: plan_a
    to: final
  - from: plan_b
    to: final

dynamic:
  fanouts:
    - id: topic_wave_a
      after: plan_a
      source: plan_a.topics
      module: test.topic_note@0.1.0
      id_prefix: topic_a
      min_items: 2
      max_items: 2
      max_parallel: 2
      input:
        - from: $item
          to: $each.topic
      fan_in:
        - from: $each.note
          to: final.notes[]
    - id: topic_wave_b
      after: plan_b
      source: plan_b.topics
      module: test.topic_note@0.1.0
      id_prefix: topic_b
      min_items: 2
      max_items: 2
      max_parallel: 2
      input:
        - from: $item
          to: $each.topic
      fan_in:
        - from: $each.note
          to: final.notes[]

outputs:
  report: final.report
