system:
  name: pr-review-linked-system
  version: 0.1.0

modules:
  read:
    path: tests/agents/read-pr.air.yaml
  review:
    path: tests/agents/review.air.yaml
  report:
    path: tests/agents/report.air.yaml

entry: read

edges:
  - from: read
    to: review
  - from: review
    to: report

connect:
  - from: read.pr_payload
    to: review.pr_payload
  - from: review.review
    to: report.review

outputs:
  report: report.report
