system:
  name: schema-contract-system
  version: 0.1.0

modules:
  extract:
    path: tests/agents/schema-extract.air.yaml
  score:
    path: tests/agents/schema-score.air.yaml
  report:
    path: tests/agents/schema-report.air.yaml

entry: extract

edges:
  - from: extract
    to: score
  - from: score
    to: report

connect:
  - from: $input.text
    to: extract.text
  - from: $input.text
    to: score.text
  - from: $input.text
    to: report.text
  - from: extract.extracted
    to: score.extracted
  - from: extract.extracted
    to: report.extracted
  - from: score.score
    to: report.score

outputs:
  report: report.report
